uga e maionese, servito con patatine fritte. Unisce strati cremosi, freschi e croccanti.","en":"A classic club sandwich with chicken, crispy bacon, eggs, tomato, lettuce and mayonnaise, served with French fries. It combines creamy, fresh and crunchy layers.","es":"Un club sándwich clásico con pollo, bacon crujiente, huevos, tomate, lechuga y mayonesa, servido con patatas fritas. Combina capas cremosas, frescas y crujientes."},"nota":"A ficha lista os ingredientes; confirme com a cozinha a composição da maionese e o método de preparação."},{"comp":{"pt":"Pão artesanal, hambúrguer Black Angus, cheddar, folhas e maionese; servido com batatas fritas.","it":"Bun artigianale, hamburger di Black Angus, cheddar, misticanza e maionese; servito con patatine.","en":"Artisan bun, Black Angus beef burger, cheddar, mixed salad leaves and mayonnaise; served with French fries.","es":"Pan artesanal, hamburguesa de Black Angus, cheddar, mezcla de hojas y mayonesa; servido con patatas fritas."},"perfil":{"pt":"A carne Black Angus é descrita na ficha como marmorizada, com gordura entre as fibras que contribui para suculência. Cheddar acrescenta intensidade láctea e salinidade; pão artesanal, notas de fermentação e tostado; folhas, frescor; maionese, cremosidade. Perfil robusto e familiar.","it":"La carne Black Angus è descritta nella scheda come marezzata, con grasso tra le fibre che contribuisce alla succosità. Il cheddar aggiunge intensità lattica e sapidità; il bun artigianale note di lievitazione e tostatura; le foglie freschezza; la maionese cremosità. Profilo ricco e familiare.","en":"The menu describes Black Angus beef as marbled, with intramuscular fat contributing to juiciness. Cheddar adds dairy intensity and saltiness; the artisan bun brings fermentation and toast notes; leaves add freshness; mayonnaise adds creaminess. A robust, familiar profile.","es":"La ficha describe la carne Black Angus como marmoleada, con grasa entre las fibras que contribuye a la jugosidad. El cheddar añade intensidad láctica y salinidad; el pan artesanal, notas de fermentación y tostado; las hojas, frescura; y la mayonesa, cremosidad. Perfil intenso y familiar."},"aroma":{"pt":"Carne grelhada, pão tostado, cheddar e notas verdes das folhas.","it":"Carne grigliata, pane tostato, cheddar e note verdi delle foglie.","en":"Grilled beef, toasted bun, cheddar and green leafy notes.","es":"Carne a la parrilla, pan tostado, cheddar y notas verdes de las hojas."},"textura":{"pt":"Pão macio, carne suculenta, cheddar derretido e folhas frescas; batatas fritas à parte.","it":"Pane morbido, carne succosa, cheddar fuso e foglie fresche; patatine a parte.","en":"Soft bun, juicy beef, melted cheddar and fresh leaves, with fries on the side.","es":"Pan suave, carne jugosa, cheddar fundido y hojas frescas, con patatas fritas aparte."},"apre":{"pt":"Hambúrguer de Black Angus em pão artesanal, com cheddar, folhas e maionese, acompanhado de batatas fritas. A carne marmorizada contribui para uma mordida suculenta e saborosa.","it":"Hamburger di Black Angus in bun artigianale, con cheddar, misticanza e maionese, accompagnato da patatine fritte. La carne marezzata contribuisce a una consistenza succosa e saporita.","en":"A Black Angus burger in an artisan bun, with cheddar, mixed leaves and mayonnaise, served with fries. The marbling helps create a juicy, savoury bite.","es":"Hamburguesa de Black Angus en pan artesanal, con cheddar, mezcla de hojas y mayonesa, acompañada de patatas fritas. El marmoleado contribuye a una mordida jugosa y sabrosa."},"nota":"A ficha descreve Black Angus como raça bovina escocesa, hoje criada sobretudo nas Américas, e destaca a marmorização. Ponto e peso não são informados."},{"comp":{"pt":"Pão branco, presunto cozido, queijo derretido e bechamel gratinado.","it":"Pane bianco, prosciutto cotto, formaggio fuso e besciamella gratinata.","en":"White bread, cooked ham, melted cheese and gratinated béchamel sauce.","es":"Pan blanco, jamón cocido, queso fundido y bechamel gratinada."},"perfil":{"pt":"Presunto cozido traz salinidade suave; queijo derretido, gordura e sabor lácteo; bechamel, cremosidade; pão, notas de cereal e tostado. O gratinado acrescenta uma superfície dourada e aromas de forno. Perfil reconfortante, rico e macio.","it":"Il prosciutto cotto porta una sapidità delicata; il formaggio fuso grasso e gusto lattico; la besciamella cremosità; il pane note di cereale e tostatura. La gratinatura aggiunge una superficie dorata e profumi di forno. Profilo ricco, morbido e confortante.","en":"Cooked ham brings gentle saltiness; melted cheese adds fat and dairy flavour; béchamel provides creaminess; bread contributes cereal and toast notes. Gratinating adds a golden surface and oven aromas. A rich, soft and comforting profile.","es":"El jamón cocido aporta salinidad suave; el queso fundido, grasa y sabor lácteo; la bechamel, cremosidad; el pan, notas de cereal y tostado. El gratinado añade una superficie dorada y aromas de horno. Perfil rico, suave y reconfortante."},"aroma":{"pt":"Aroma de pão tostado, queijo gratinado e presunto cozido.","it":"Profumo di pane tostato, formaggio gratinato e prosciutto cotto.","en":"Toasted bread, gratinated cheese and cooked-ham aromas.","es":"Aroma de pan tostado, queso gratinado y jamón cocido."},"textura":{"pt":"Interior macio e cremoso, exterior de pão tostado e superfície gratinada.","it":"Interno morbido e cremoso, esterno di pane tostato e superficie gratinata.","en":"Soft, creamy interior with toasted bread and a gratinated top.","es":"Interior suave y cremoso, exterior de pan tostado y superficie gratinada."},"apre":{"pt":"Um clássico francês de pão branco, presunto cozido, queijo derretido e bechamel gratinado. É quente, cremoso e reconfortante, com uma superfície dourada.","it":"Un classico francese con pane bianco, prosciutto cotto, formaggio fuso e besciamella gratinata. È caldo, cremoso e confortante, con una superficie dorata.","en":"A French classic with white bread, cooked ham, melted cheese and gratinated béchamel. Warm, creamy and comforting, with a golden top.","es":"Un clásico francés con pan blanco, jamón cocido, queso fundido y bechamel gratinada. Es caliente, cremoso y reconfortante, con una superficie dorada."},"nota":"A ficha explica bechamel como leite, manteiga e farinha cozidos até formar um creme."},{"comp":{"pt":"Frutas frescas da estação.","it":"Frutta fresca di stagione.","en":"Seasonal fresh fruit.","es":"Fruta fresca de temporada."},"perfil":{"pt":"O perfil muda conforme as frutas da estação. Pode reunir doçura madura, acidez cítrica ou de frutas vermelhas, notas florais e frescor vegetal. É a sobremesa mais leve e refrescante da lista, sem um perfil fixo de sabor.","it":"Il profilo cambia secondo la frutta di stagione. Può unire dolcezza matura, acidità agrumata o di frutti rossi, note floreali e freschezza vegetale. È il dessert più leggero e rinfrescante della lista, senza un profilo gustativo fisso.","en":"The profile changes with the seasonal fruit. It may combine ripe sweetness, citrus or berry acidity, floral notes and vegetal freshness. It is the lightest and most refreshing dessert on the list, with no fixed flavour profile.","es":"El perfil cambia según la fruta de temporada. Puede combinar dulzor maduro, acidez cítrica o de frutos rojos, notas florales y frescura vegetal. Es el postre más ligero y refrescante de la carta, sin un perfil de sabor fijo."},"aroma":{"pt":"Aromas variáveis de fruta fresca e madura, conforme a seleção do dia.","it":"Profumi variabili di frutta fresca e matura, secondo la selezione del giorno.","en":"Changing aromas of fresh, ripe fruit, depending on the day’s selection.","es":"Aromas variables de fruta fresca y madura, según la selección del día."},"textura":{"pt":"Combinação de frutas macias, suculentas e eventualmente crocantes.","it":"Combinazione di frutti morbidi, succosi ed eventualmente croccanti.","en":"A combination of soft, juicy and sometimes crisp fruit textures.","es":"Combinación de frutas suaves, jugosas y, en ocasiones, crujientes."},"apre":{"pt":"Uma macedônia preparada com frutas frescas da estação. É uma opção leve e refrescante, ideal para terminar a refeição com doçura natural.","it":"Una macedonia preparata con frutta fresca di stagione. È una scelta leggera e rinfrescante, ideale per concludere il pasto con dolcezza naturale.","en":"A fruit salad prepared with fresh seasonal fruit. A light and refreshing way to finish the meal with natural sweetness.","es":"Una macedonia preparada con fruta fresca de temporada. Es una opción ligera y refrescante para terminar la comida con dulzor natural."},"nota":"A composição varia conforme a fruta da estação; confirme os frutos utilizados no dia."},{"comp":{"pt":"Tarte Tatin de maçã com sorvete de baunilha.","it":"Tarte Tatin alle mele con gelato alla vaniglia.","en":"Apple tarte Tatin with vanilla ice cream.","es":"Tarta Tatin de manzana con helado de vainilla."},"perfil":{"pt":"Maçã caramelizada reúne doçura frutada, acidez e notas de caramelo tostado. A massa acrescenta manteiga e cereal assado; o sorvete de baunilha oferece cremosidade fria e perfume doce. O contraste entre maçã quente e gelado é característico se a casa servir a sobremesa nessa temperatura — confirme a apresentação.","it":"La mela caramellata unisce dolcezza fruttata, acidità e note di caramello tostato. La pasta aggiunge burro e note di cereale cotto; il gelato alla vaniglia offre cremosità fredda e profumo dolce. Il contrasto tra mela calda e gelato è caratteristico se il dessert viene servito a questa temperatura: verificare il servizio.","en":"Caramelised apple combines fruit sweetness, acidity and toasted caramel notes. Pastry adds butter and baked-cereal flavours; vanilla ice cream provides cool creaminess and sweet fragrance. A warm-apple/cold-ice-cream contrast is characteristic if served that way—confirm the presentation.","es":"La manzana caramelizada combina dulzor frutal, acidez y notas lates sugere camadas de intensidade: notas mais amargas e tostadas do chocolate escuro, doçura e cremosidade do chocolate ao leite e perfil mais doce e lácteo do chocolate branco. A mousse tende a proporcionar textura aveludada. A proporção e os tipos exatos não são especificados na ficha.","it":"La proposta dei tre cioccolati suggerisce diversi livelli d’intensità: note più amare e tostate del fondente, dolcezza e cremosità del cioccolato al latte e un profilo più dolce e lattico del bianco. La mousse tende a offrire una consistenza vellutata. La scheda non specifica proporzioni e tipologie esatte.","en":"The three-chocolate concept suggests different levels of intensity: more bitter, toasted notes from dark chocolate; sweetness and creaminess from milk chocolate; and a sweeter, dairy-like profile from white chocolate. The mousse suggests a velvety texture. Exact chocolate types and proportions are not specified.","es":"La propuesta de tres chocolates sugiere distintos niveles de intensidad: notas más amargas y tostadas del chocolate negro, dulzor y cremosidad del chocolate con leche y un perfil más dulce y lácteo del chocolate blanco. La mousse sugiere una textura aterciopelada. La ficha no especifica proporciones ni tipos exactos."},"aroma":{"pt":"Perfume de cacau, chocolate tostado, leite e manteiga de cacau.","it":"Profumo di cacao, cioccolato tostato, latte e burro di cacao.","en":"Cocoa, toasted chocolate, milk and cocoa-butter aromas.","es":"Aroma de cacao, chocolate tostado, leche y manteca de cacao."},"textura":{"pt":"Mousse macia, densa ou aerada conforme a receita; sensação aveludada e persistente.","it":"Mousse morbida, più densa o ariosa secondo la ricetta; sensazione vellutata e persistente.","en":"Soft mousse, denser or airier depending on the recipe; a velvety, lingering mouthfeel.","es":"Mousse suave, más densa o aireada según la receta; sensación aterciopelada y persistente."},"apre":{"pt":"Uma sobremesa de três chocolates assinada por Ernst Knam. A ideia é explorar diferentes intensidades de cacau e uma textura de mousse cremosa e aveludada.","it":"Un dessert ai tre cioccolati firmato Ernst Knam. L’idea è esplorare diverse intensità di cacao e una consistenza cremosa e vellutata.","en":"A three-chocolate dessert by Ernst Knam, designed to explore different cocoa intensities and a creamy, velvety mousse texture.","es":"Un postre de tres chocolates de Ernst Knam, pensado para explorar distintas intensidades de cacao y una textura de mousse cremosa y aterciopelada."},"nota":"A ficha identifica Ernst Knam como confeiteiro radicado em Milão, conhecido como 'rei do chocolate'."},{"comp":{"pt":"Cheesecake de manga.","it":"Cheesecake al mango.","en":"Mango cheesecake.","es":"Cheesecake de mango."},"perfil":{"pt":"Manga oferece doçura tropical, perfume frutado e acidez moderada; a base de cheesecake costuma trazer cremosidade láctea e leve acidez. A combinação sugere contraste entre fruta fresca e recheio rico. A ficha não detalha base, cobertura ou receita.","it":"Il mango offre dolcezza tropicale, profumo fruttato e acidità moderata; la base della cheesecake porta generalmente cremosità lattica e una lieve acidità. L’insieme suggerisce un contrasto tra frutta fresca e farcia ricca. La scheda non dettaglia base, copertura o ricetta.","en":"Mango brings tropical sweetness, fruity fragrance and moderate acidity; cheesecake typically contributes dairy creaminess and gentle tang. The combination suggests a contrast between fresh fruit and a rich filling. The menu does not detail the base, topping or recipe.","es":"El mango aporta dulzor tropical, aroma frutal y acidez moderada; la base de cheesecake suele ofrecer cremosidad láctica y una ligera acidez. La combinación sugiere un contraste entre fruta fresca y relleno rico. La ficha no detalla la base, cobertura ni receta."},"aroma":{"pt":"Manga madura e notas lácteas suaves.","it":"Mango maturo e delicate note lattiche.","en":"Ripe mango and gentle dairy notes.","es":"Mango maduro y suaves notas lácteas."},"textura":{"pt":"Recheio cremoso; base possivelmente mais firme ou crocante, dependendo da receita.","it":"Farcitura cremosa; base eventualmente più compatta o croccante, secondo la ricetta.","en":"Creamy filling; the base may be firmer or crisp, depending on the recipe.","es":"Relleno cremoso; la base puede ser más firme o crujiente, según la receta."},"apre":{"pt":"Cheesecake de manga, com perfil frutado e tropical. É uma opção cremosa para quem prefere a doçura da fruta a uma sobremesa centrada no chocolate.","it":"Cheesecake al mango, dal profilo fruttato e tropicale. È una scelta cremosa per chi preferisce la dolcezza della frutta a un dessert incentrato sul cioccolato.","en":"Mango cheesecake with a fruity, tropical profile. A creamy choice for guests who prefer fruit sweetness to a chocolate-led dessert.","es":"Cheesecake de mango, de perfil frutal y tropical. Una opción cremosa para quienes prefieren el dulzor de la fruta a un postre centrado en el chocolate."},"nota":"A ficha não detalha a receita; confirmar se há coulis, fruta fresca ou outros componentes."},{"comp":{"pt":"Tiramisù.","it":"Tiramisù.","en":"Tiramisù.","es":"Tiramisú."},"perfil":{"pt":"O perfil clássico do tiramisù combina creme de mascarpone, café, cacau e biscoito embebido, mas a ficha do menu apenas informa o nome. Como referência sensorial tradicional, espera-se cremosidade láctea, aroma de café, amargor do cacau e doçura equilibrada. Confirme a receita efetiva da casa.","it":"Il profilo classico del tiramisù combina crema al mascarpone, caffè, cacao e biscotto inzuppato, ma la scheda del menu riporta soltanto il nome. Come riferimento sensoriale tradizionale, ci si aspetta cremosità lattica, aroma di caffè, amaro del cacao e dolcezza equilibrata. Verificare la ricetta effettiva della casa.","en":"Classic tiramisù typically combines mascarpone cream, coffee, cocoa and soaked biscuits, but the menu lists only the dish name. As a traditional sensory reference, expect dairy creaminess, coffee aroma, cocoa bitterness and balanced sweetness. Confirm the restaurant’s actual recipe.","es":"El tiramisú clásico suele combinar crema de mascarpone, café, cacao y bizcocho empapado, pero la ficha del menú solo indica el nombre. Como referencia sensorial tradicional, se espera cremosidad láctica, aroma de café, amargor del cacao y dulzor equilibrado. Confirmar la receta real de la casa."},"aroma":{"pt":"Referência clássica: café torrado, cacau e notas lácteas.","it":"Riferimento classico: caffè tostato, cacao e note lattiche.","en":"Classic reference: roasted coffee, cocoa and dairy notes.","es":"Referencia clásica: café tostado, cacao y notas lácteas."},"textura":{"pt":"Tradicionalmente, creme macio com camadas de biscoito úmido; confirmar a montagem da casa.","it":"Tradizionalmente, crema morbida con strati di biscotto umido; verificare la composizione della casa.","en":"Traditionally, soft cream layered with moist biscuits; confirm the house presentation.","es":"Tradicionalmente, crema suave con capas de bizcocho húmedo; confirmar la presentación de la casa."},"apre":{"pt":"Um clássico italiano. A versão tradicional combina mascarpone, café e cacau, criando contraste entre cremosidade, doçura e o amargor aromático do café. Posso confirmar os detalhes da nossa receita.","it":"Un classico italiano. La versione tradizionale unisce mascarpone, caffè e cacao, creando un contrasto tra cremosità, dolcezza e l’amaro aromatico del caffè. Posso confermare i dettagli della nostra ricetta.","en":"An Italian classic. The traditional version combines mascarpone, coffee and cocoa, balancing creaminess and sweetness with coffee’s aromatic bitterness. I can confirm the details of our recipe.","es":"Un clásico italiano. La versión tradicional combina mascarpone, café y cacao, equilibrando cremosidad y dulzor con el amargor aromático del café. Puedo confirmar los detalles de nuestra receta."},"nota":"A ficha original lista apenas o nome e alérgenos, sem ingredientes. A descrição sensorial é uma referencia tradicional e deve ser confirmada com a cozinha."}];

const DCATS=['Antipasti','Insalate','Primi','Secondi','Speciali','Contorni','Pizze','Panini','Dolci'];
function eur(s){var m=String(s||'').replace('€','').match(/([\d.]+)/);return m?parseInt(m[1].replace(/\./g,'')):0;}
function wtier(w){var v=eur(w.pz);return v<=100?1:(v<=250?2:3);}
function dtier(p){if(p.tg.indexOf('informale')>=0||p.tg.indexOf('contorno')>=0)return 1;return p.pz<=20?1:(p.pz<=30?2:3);}
function pairScore(w,p){
 var P=w.perfil,corpo=P[0][2],doce=P[1][2],acid=P[2][2],q=P[3][2],arom=P[4][2];
 var red=w.cat==='Rosso',bolha=(w.cat==='Spumante'||w.cat==='Champagne');
 var tan=red?q:0,crem=red?0:q,t=p.tp,tg=p.tg,s=0;
 if(t==='dolce'){
  if(w.cat!=='Dolce')return -99;
  s+=8;
  if(tg.indexOf('cioccolato')>=0)s+=(doce>=5&&corpo>=4)?2:-1;
  if(tg.indexOf('dolce_leggero')>=0)s+=(corpo<=4)?2:-1;
  if(tg.indexOf('frutta_tropicale')>=0||tg.indexOf('frutta')>=0)s+=1;
  return s+(arom-3)*0.4;}
 if(w.cat==='Dolce')return -99;
 s-=Math.abs(corpo-p.pf[0])*1.3;
 s-=Math.abs(arom-p.pf[3])*0.6;
 if(p.pf[1]>=5)s+=(acid-3)*0.9+(tan-3)*0.5;
 if(p.pf[2]>=5)s+=(acid>=5)?2.0:-2.5;
 if(t==='pesce'||t==='crostacei'){ if(red&&tan>=4)s-=7; else if(red)s-=2; else if(bolha)s+=1.5; else s+=2.2; }
 else if(t==='carne_rossa'){ if(red&&tan>=4)s+=3.5; else if(red)s+=1; else s-=4.5; }
 else if(t==='carne_bianca'){ if(!red&&crem>=4)s+=1.5; if(red&&tan<=3)s+=1.5; if(red&&tan>=5)s-=1.5; }
 else if(t==='salumi'){ if(w.cat==='Rosato'||bolha)s+=2; }
 else if(t==='formaggio'){ if(bolha)s+=1.5; if(red&&tan>=5)s-=1; }
 else if(t==='verdura'){ if(red&&tan>=5)s-=2; }
 var neb=/nebbiolo/i.test(w.gr||'');
 var F={fritto: bolha?3:((!red&&acid>=5)?1.5:(red?-1:0)),
  tartufo:((red&&arom>=5&&neb)?4:0)+((red&&arom>=5)?1.5:0)+((crem>=4)?1.2:0)+(bolha?-1.5:0),
  piccante:((tan>=5)?-2:0)+(!red?1:0)+((corpo<=4)?1:0),
  pomodoro:((acid>=5)?1.8:-1.2)+((red&&acid>=5)?2.5:0),
  crudo:((red&&tan>=4)?-3:0)+(!red?1.5:0),
  agrume:(acid>=5)?1.5:-0.5,
  salsa_cremosa:((crem>=4)?1.5:0)+(bolha?1:0),
  zafferano:(crem>=4)?1.5:0,
  lusso:(w.cat==='Champagne')?3:0,
  acciuga:((!red&&acid>=5)?1.5:0)+(red?-2:0),
  tonno_rosso:((red&&tan<=3)?2.5:0)+(!red?1:0),
  griglia:(corpo>=4)?1:0, affumicato:bolha?1:0,
  pizza:((bolha||(red&&corpo<=4))?1:0)+((wtier(w)===3)?-1.5:0),
  contorno:-1.5, formaggio:bolha?0.8:0, informale:0};
 for(var k=0;k<tg.length;k++){var v=F[tg[k]];if(v)s+=v;}
 if(bolha&&p.pf[0]>=4&&tg.indexOf('fritto')<0&&tg.indexOf('lusso')<0&&tg.indexOf('salsa_cremosa')<0)s-=2.5;
 s-=Math.abs(dtier(p)-wtier(w))*2.2;
 if(tg.indexOf('informale')>=0)s-=[0,0,2.0,4.0][wtier(w)];
 return s;}
function bestDish(w){var b=null,bs=-1e9;for(var i=0;i<DISHES.length;i++){var sc=pairScore(w,DISHES[i]);if(sc>bs){bs=sc;b=DISHES[i];}}return b;}
const BANDS=[[0,150],[151,300],[301,550],[551,900]];
const TIERL={pt:['Em conta','Meio-termo','Especial','Grande garrafa'],it:['Conveniente','Intermedio','Speciale','Grande bottiglia'],
 en:['Affordable','Mid-range','Special','Grand bottle'],de:['Preiswert','Mittelklasse','Besonders','Große Flasche'],
 ar:['اقتصادي','متوسط','مميز','زجاجة كبرى'],zh:['实惠','中档','臻选','顶级'],
 es:['Asequible','Intermedio','Especial','Gran botella'],fr:['Abordable','Intermédiaire','Exception','Grande bouteille'],
 ja:['お手頃','中価格帯','スペシャル','特別な一本'],ru:['Доступное','Средний','Особое','Большая бутылка']};
const MAXSUG=900;
function bandOf(v){for(var i=0;i<BANDS.length;i++){if(v>=BANDS[i][0]&&v<=BANDS[i][1])return i;}return BANDS.length-1;}
function bestWines(p,n){
 n=n||4;
 var r=WINES.map(function(w){return {w:w,s:pairScore(w,p),v:eur(w.pz)};})
   .filter(function(x){return x.s>-50&&x.v>0&&x.v<=MAXSUG;})
   .sort(function(a,b){return b.s-a.s;});
 var out=[],prs={};
 BANDS.forEach(function(b){
  for(var i=0;i<r.length;i++){var x=r[i];
   if(x.v<b[0]||x.v>b[1])continue;
   if(prs[x.w.pr])continue;
   prs[x.w.pr]=1;out.push(x.w);return;}});
 for(var j=0;j<r.length&&out.length<3;j++){var w2=r[j].w;if(prs[w2.pr])continue;prs[w2.pr]=1;out.push(w2);}
 out=out.slice(0,n);

const SUGT={
 corpo:{pt:"Vinho de grande corpo e concentração. Pede um prato de peso equivalente — se o prato for leve, o vinho o atropela. Tanino macio, então não precisa de carne dura: pede carne saborosa.",
  it:"Vino di grande corpo e concentrazione. Chiede un piatto di peso equivalente — se il piatto è leggero, il vino lo travolge. Tannino morbido, quindi non serve carne dura: serve carne saporita.",
  en:"A wine of great body and concentration. It needs a dish of matching weight — a light dish would simply be run over. The tannins are soft, so it doesn't call for tough meat, but for flavourful meat.",
  de:"Ein Wein von großem Körper und hoher Konzentration. Er verlangt ein Gericht von gleichem Gewicht — ein leichtes Gericht würde überrollt. Die Tannine sind weich: es braucht kein zähes, sondern geschmacksintensives Fleisch.",
  ar:"نبيذ ذو قوام كبير وتركيز عالٍ. يتطلّب طبقًا بالوزن نفسه — فالطبق الخفيف يضيع أمامه. تانيناته ناعمة، لذا لا يحتاج لحمًا قاسيًا بل لحمًا غنيّ النكهة.",
  zh:"酒体庞大、风味浓缩。需要一道分量相当的菜——清淡的菜会被完全压过。单宁柔顺，因此不必是耐嚼的肉，而应是风味浓郁的肉。",

  ja:"豊かなボディと凝縮感を備えたワイン。同じだけの重みを持つ料理が必要で、軽い皿では押し切られてしまいます。タンニンはやわらかいので、硬い肉ではなく味の濃い肉を。",
  ru:"Вино большого тела и высокой концентрации. Ему нужно блюдо сопоставимого веса — лёгкое просто будет смято. Танины мягкие, поэтому нужна не жёсткая, а насыщенная по вкусу мясная подача."},
 tanico:{pt:"Os taninos firmes encontram a gordura da carne: a gordura amacia o tanino, e o tanino limpa o paladar para a próxima garfada. É a harmonização mais clássica que existe.",
  it:"I tannini fermi incontrano il grasso della carne: il grasso ammorbidisce il tannino e il tannino pulisce il palato per il boccone successivo. È l'abbinamento più classico che esista.",

  ar:"تلتقي التانينات القوية بدهن اللحم: الدهن يليّن التانين، والتانين ينظّف الحنك للقضمة التالية. إنه أشهر تناغم في عالم النبيذ.",
  zh:"强劲的单宁遇上肉类的油脂：油脂柔化单宁，单宁又为下一口清洁味蕾。这是最经典的搭配。",

  ja:"しっかりしたタンニンが肉の脂と出会います。脂がタンニンをやわらげ、タンニンが次の一口へと口中をリセットする。最も古典的な組み合わせです。",
  ru:"Плотные танины встречаются с жиром мяса: жир смягчает танин, а танин очищает вкус перед следующим куском. Самое классическое сочетание из существующих."},
 acidez:{pt:"A acidez viva do vinho acompanha a acidez do tomate no molho. Sem ela, o vinho pareceria mole ao lado do prato.",

  de:"Die lebendige Säure des Weins begleitet die Säure der Tomate in der Sauce. Ohne sie wirkte der Wein neben dem Gericht flach.",
  ar:"حموضة النبيذ النابضة توازي حموضة الطماطم في الصلصة. من دونها يبدو النبيذ باهتًا إلى جانب الطبق.",

  it:"L'acidità fa nel piatto ciò che farebbe il limone: rinfresca, taglia il grasso ed esalta il sapore del pesce. Vino abbastanza leggero da non coprire l'ingrediente.",
  en:"The acidity does what a squeeze of lemon would: it refreshes, cuts the fat and lifts the flavour of the fish. Light enough not to cover the ingredient.",

  zh:"酸度在菜肴中的作用如同挤上一瓣柠檬：清爽解腻，提升鱼的鲜味。酒体足够轻盈，不会掩盖食材本味。",
  es:"La acidez hace en el plato lo que haría el limón: refresca, corta la grasa y realza el sabor del pescado. Un vino lo bastante ligero para no tapar el ingrediente.",

  ru:"Кислотность делает то же, что долька лимона: освежает, режет жир и подчёркивает вкус рыбы. Вино достаточно лёгкое, чтобы не перекрыть продукт."},
 cremoso:{pt:"A textura cremosa do vinho espelha a manteiga do prato. Peso parecido dos dois lados — nenhum abafa o outro.",

 bolha:{pt:"A borbulha e a acidez limpam a gordura entre uma garfada e outra. Por isso espumante funciona do começo ao fim da refeição.",

  ar:"تنظّف الفقاعات والحموضة الدهن بين قضمة وأخرى. لذلك يصلح النبيذ الفوار من بداية الوجبة حتى نهايتها.",
  zh:"气泡与酸度在每一口之间洗去油脂。因此起泡酒从餐前到餐后都合适。",
  es:"La burbuja y la acidez limpian la grasa entre bocado y bocado. Por eso el espumoso funciona de principio a fin de la comida.",

 doce:{pt:"A regra de ouro: o vinho precisa ser mais doce que a sobremesa. Se o doce vencer, o vinho parece azedo.",

function sugFor(w){var p=w.perfil,corpo=p[0][2],doce=p[1][2],acid=p[2][2],q=p[3][2],ar=p[4][2],c=w.cat;
 if(c==='Dolce')return{k:'doce',d:'Doces'};
 if(c==='Spumante'||c==='Champagne')return{k:'bolha',d:(w.tipos.indexOf('Polvo')>=0?'Polvo':'Saladas')};
 if(c==='Rosato')return{k:'rosato',d:'Saladas'};
 if(c==='Rosso'){
  var neb=/nebbiolo/i.test(w.gr||'');
  if(neb&&w.tipos.indexOf('Tartufo')>=0&&ar>=5&&q>=4)return{k:'tartufo',d:'Tartufo'};
  if(q>=5)return{k:'tanico',d:'Carne vermelha'};
  if(corpo>=5)return{k:'corpo',d:'Carne vermelha'};
  if(acid>=5&&corpo<=4)return{k:'acidez',d:'Massas'};
  if(acid>=4&&corpo<=3&&w.tipos.indexOf('Massas')>=0)return{k:'acidez',d:'Massas'};
  return{k:'leve',d:'Frango'};}
 if(q>=4)return{k:'cremoso',d:(w.tipos.indexOf('Lagosta')>=0?'Lagosta':'Arroz')};
 return{k:'peixe',d:(w.tipos.indexOf('Peixe')>=0?'Peixe':'Saladas')};}
function openSug(){var w=WINES[curIdx],s=sugFor(w),L2=SUGL[lang]||SUGL.en,bd=bestDish(w);

 el.innerHTML='<div class="sugbox"><div class="sughead">'+L2.t+'</div>'
  +'<div class="sugdish">'+(bd?bd.nm:tipT(s.d))+'</div>'+(bd?'<div class="sugsub">'+(bd.ds[lang]||bd.ds.en)+' · €'+bd.pz+'</div>':'')
  +'<div class="suglbl">'+L2.w+'</div><p class="sugwhy">'+(SUGT[s.k][lang]||SUGT[s.k].en)+'</p>'
  +'<button class="sugclose">'+L2.c+'</button></div>';
 el.hidden=false;
 el.querySelector('.sugclose').onclick=function(){el.hidden=true;};
 el.onclick=function(e){if(e.target===el)el.hidden=true;};}
function perfHelp(){return PHELP[lang].map(function(g){return '<div class="gr"><span class="t">'+g[0]+'</span><b>'+g[1]+'</b> — '+g[2]+'. <b>'+g[3]+'</b> — '+g[4]+'.</div>';}).join('');}
function togglePerfInfo(e){e.stopPropagation();var el=document.getElementById('perfhelp');if(el)el.hidden=!el.hidden;}
function gauge(b){var v=b[2],pos=6+((v-1)/5)*88,st=v<=2?"L":(v>=5?"R":"M");var lc=st==="L"?"p on":"p off",rc=st==="R"?"p r on":"p r off";return `<div class="axis"><div class="axhead"><span class="${lc}">${poleT(b[0])}</span><span class="${rc}">${poleT(b[1])}</span></div><div class="track"><div class="fill" style="width:${pos}%"></div><div class="knob" style="left:${pos}%"></div></div></div>`;}function bars(p){return p.map(gauge).join('');}
function grapes(g){return g.split(/\s*·\s*/).map(x=>`<span class="grape">${x}</span>`).join('');}
function tipos(t){return ALLT.map(x=>`<span class="tipo${t.includes(x)?' on':''}">${tipT(x)}</span>`).join('');}
const detail=document.getElementById('detail'),dwrap=document.getElementById('dwrap');let curIdx=0;
function openDetail(i,keep){curIdx=i;const w=WINES[i];detail.style.setProperty('--accent','var(--c-'+w.cat+')');detail.style.setProperty('--ink','var(--i-'+w.cat+')');detail.style.setProperty('--solid','var(--s-'+w.cat+')');detail.style.setProperty('--g',w.col);
 dwrap.innerHTML=`<div class="hero" style="--g:${w.col}"><img src="${w.img}" onerror="this.style.display='none'"></div>
  <div style="text-align:center"><span class="dtag">${catT(w.cat)}</span></div>
  <div class="dhead"><div><div class="dname">${w.nm}</div><div class="dprod">${w.pr}</div><div class="dmeta">${w.reg}</div></div><div class="dprice">${w.pz||''}</div></div>
  ${w.gr?`<div class="sec"><div class="lbl">${L().comp}</div><div class="grapes">${grapes(w.gr)}</div></div>`:''}
  ${w.fmt?`<div class="sec"><div class="lbl">${FMTL[lang]||FMTL.en}</div><div class="fmts">${w.fmt.map(f=>`<div class="fmtrow"><span>${f.n}</span><b>${f.p}</b></div>`).join('')}</div></div>`:''}
  <div class="sec"><div class="lbl">${L().perf} <span class="pinfo" onclick="togglePerfInfo(event)">?</span></div><div class="perfil">${bars(w.perfil)}</div><div class="perfhelp" id="perfhelp" hidden>${perfHelp()}</div></div>
  ${TX(w.hist)?`<div class="sec"><div class="lbl">${L().hist}</div><p${FB(w.hist)}>${TX(w.hist)}</p></div>`:''}
  ${TX(w.arom)?`<div class="sec"><div class="lbl">${L().arom}</div><p${FB(w.arom)}>${TX(w.arom)}</p></div>`:''}
  <div class="sec"><div class="lbl">${L().harm}</div><div class="tipos">${tipos(w.tipos)}</div></div>
  <div class="sugbtn" onclick="openSug()"><span class="sk">${(SUGL[lang]||SUGL.en).t}</span><span class="sar">›</span></div><div class="sec"><div class="serv"><div class="servbox"><div class="k">${L().dec}</div><div class="v">${decT(w.decant)}</div></div>
    <div class="servbox"><div class="k">${L().temp}</div><div class="v">${w.temp}</div></div></div><div class="decnote"><span class="declbl">${w.decant.startsWith("Sim")?DECLBL[lang].y:DECLBL[lang].n}</span>${TX(w.decwhy)}</div></div>
  ${TX(w.scr)?`<div class="frase"${FB(w.scr)}>“${TX(w.scr)}”</div>`:''}`;
 if(!keep){detail.scrollTop=0;detail.classList.add('show');history.pushState({d:1},'');}}
var curDish=0;
function openDish(i,keep){curDish=i;var p=DISHES[i];
 detail.style.setProperty('--accent','var(--c-Champagne)');detail.style.setProperty('--ink','var(--i-Champagne)');
 detail.style.setProperty('--solid','var(--s-Champagne)');
 var ws=bestWines(p,4);
 dwrap.innerHTML='<div style="text-align:center;margin-top:22px"><span class="dtag">'+p.cat+'</span></div>'
  +'<div class="dhead"><div><div class="dname">'+glosMark(p.nm)+'</div></div><div class="dprice">€'+p.pz+'</div></div>'
  +'<div class="sec"><p'+(p.ds[lang]?'':' dir="ltr" class="fbtxt"')+'>'+glosMark(p.ds[lang]||p.ds.en)+'</p></div>'
  +(p.al?'<div class="sec"><div class="lbl">'+ML().alerg+'</div><div class="algchips">'+algList(p.al).map(function(n){return '<span class="algchip" onclick="openAlg('+i+',\''+n+'\')">'+n+'</span>';}).join('')+'</div><div class="alghint">'+((ALGL[lang]||ALGL.en).h)+'</div></div>':'')
  +'<div class="sec"><div class="lbl">'+ML().wines+'</div>'
  + ws.map(function(w){return '<div class="wsug" onclick="openDetail('+WINES.indexOf(w)+')">'
      +'<span class="wtag" style="background:var(--s-'+w.cat+')">'+catT(w.cat)+'</span>'
      +'<div class="wsn">'+w.nm+'</div><div class="wsp">'+w.pr+'</div>'
      +'<div class="wspz">'+(w.pz||'')+'</div></div>';}).join('')
  +'</div>';
 if(!keep){detail.scrollTop=0;detail.classList.add('show');history.pushState({d:1},'');}}
function openArom(i){curDish=i;var p=DISHES[i],a=AROM[i];var AD=AL2();
 detail.style.setProperty('--accent','var(--c-Champagne)');detail.style.setProperty('--ink','var(--i-Champagne)');

 var ws=bestWines(p,4);
 function sec(lbl,txt){return txt?('<div class="sec"><div class="lbl">'+lbl+'</div><p>'+txt+'</p></div>'):'';}
 dwrap.innerHTML='<div style="text-align:center;margin-top:22px"><span class="dtag">'+p.cat+'</span></div>'

  +sec(AD.comp,(a.comp[lang]||a.comp.en))

  +sec(AD.textura,(a.textura[lang]||a.textura.en))
  +sec(AD.apre,(a.apre[lang]||a.apre.en))
  +(p.al?'<div class="sec"><div class="lbl">'+ML().alerg+'</div><div class="algchips">'+algList(p.al).map(function(n){return '<span class="algchip" onclick="openAlg('+i+',\''+n+'\')">'+n+'</span>';}).join('')+'</div><div class="alghint">'+((ALGL[lang]||ALGL.en).h)+'</div></div>':'')
  +sec(AD.nota,a.nota)
  +'<div class="sec"><div class="lbl">'+ML().wines+'</div>'
  + ws.map(function(w){return '<div class="wsug" onclick="openDetail('+WINES.indexOf(w)+')">'

      +'<div class="wsn">'+w.nm+'</div><div class="wsp">'+w.pr+'</div>'
      +'<div class="wspz">'+(w.pz||'')+'</div></div>';}).join('')
  +'</div>';
 detail.scrollTop=0;detail.classList.add('show');history.pushState({d:1},'');}
function closeDetail(){detail.classList.remove('show');}
document.getElementById('dback').onclick=()=>{if(history.state&&history.state.d)history.back();else closeDetail();};
window.addEventListener('popstate',()=>{if(detail.classList.contains('show'))closeDetail();});
document.addEventListener('keydown',e=>{var gm=document.getElementById('glosmodal');if(e.key==='Escape'&&gm&&!gm.hidden){gm.hidden=true;return;}var am=document.getElementById('algmodal');if(e.key==='Escape'&&am&&!am.hidden){am.hidden=true;return;}var sm=document.getElementById('sugmodal');if(e.key==='Escape'&&sm&&!sm.hidden){sm.hidden=true;return;}if(e.key==='Escape'&&detail.classList.contains('show'))history.back();});
document.documentElement.lang=lang;document.documentElement.dir=RTL.indexOf(lang)>=0?'rtl':'ltr';applyStatic();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
