:"A Bordeaux blend from Franciacorta — soft, modern and fruity. An easy red for Merlot and Cabernet lovers."},"decwhy":{"pt":"Tinto leve e macio, já pronto para beber. Não precisa decantar — se quiser, alguns minutos na taça já bastam para abrir.","it":"Rosso leggero e morbido, già pronto da bere. Non serve decantare — se vuoi, bastano pochi minuti nel calice per aprirlo.","en":"A light, soft red, ready to drink. No need to decant — if you like, a few minutes in the glass is enough to open it.","de":"Leichter, weicher Rotwein, trinkfertig. Dekantieren ist nicht nötig — einige Minuten im Glas genügen, damit er sich öffnet.","ar":"نبيذ أحمر خفيف وناعم، جاهز للشرب. لا حاجة للتهوية — بضع دقائق في الكأس تكفي ليتفتّح.","zh":"轻盈柔顺的红葡萄酒，已可直接饮用。无需醒酒——在杯中静置几分钟即可打开。","es":"Tinto ligero y suave, ya listo para beber. No necesita decantación — unos minutos en copa bastan para que se abra.","fr":"Rouge léger et souple, prêt à boire. Pas besoin de décanter — quelques minutes au verre suffisent à l'ouvrir.","ja":"軽やかでやわらかい赤。すでに飲み頃です。デキャンタージュは不要で、グラスで数分置けば開きます。","ru":"Лёгкое мягкое красное, готовое к употреблению. Декантация не нужна — достаточно нескольких минут в бокале."}},{"cat":"Rosso","reg":"Lombardia","pr":"Ca' Del Bosco","nm":"Maurizio Zanella","gr":"50% Cabernet Sauvignon · 25% Merlot · 25% Cabernet Franc","pz":"€150","col":"#5C1F2A","img":"img/ca-del-bosco-maurizio-zanella-2019.png","perfil":[["Leve","Encorpado",5],["Seco","Doce",1],["Suave","Vibrante",4],["Macio","Tânico",4],["Delicado","Intenso",6]],"tipos":["Massas","Arroz","Molhos","Carne vermelha","Bolognesa","Tartufo","Pizza"],"temp":"16–18°C","decant":"Sim — 30min","hist":{"pt":"O tinto-ícone da casa, com o nome do próprio proprietário — um Bordeaux italiano estruturado e elegante.","it":"Il rosso-icona della casa, dal nome del proprietario — un Bordeaux italiano strutturato ed elegante.","en":"The house's icon red, named after the owner himself — a structured, elegant Italian Bordeaux."},"arom":{"pt":"maçã assada, cítricos, brioche, avelã, flores brancas e mineralidade","it":"mela cotta, agrumi, brioche, nocciola, fiori bianchi, mineralità","en":"baked apple, citrus, brioche, hazelnut, white flowers, minerality"},"scr":{"pt":"O tinto-ícone da casa — um Bordeaux italiano estruturado e elegante. Para quem quer seriedade.","it":"Il rosso-icona della casa — un Bordeaux italiano strutturato ed elegante. Per chi vuole serietà.","en":"The house's icon red — a structured, elegant Italian Bordeaux. For those wanting seriousness."},"decwhy":{"pt":"Tinto jovem e tânico. Decantar por 30min deixa o vinho respirar: oxigena, abre os aromas ainda fechados e amacia os taninos, deixando-o mais redondo na taça.","it":"Rosso giovane e tannico. Decantare per 30min lo fa respirare: ossigena, apre gli aromi ancora chiusi e ammorbidisce i tannini, rendendolo più rotondo nel calice.","en":"A young, tannic red. Decanting for 30min lets it breathe: it oxygenates, opens still-closed aromas and softens the tannins, making it rounder in the glass.","de":"Junger, tanninreicher Rotwein. Das Dekantieren für 30min lässt den Wein atmen: es versorgt ihn mit Sauerstoff, öffnet noch verschlossene Aromen und mildert die Tannine, sodass er runder im Glas wirkt.","ar":"نبيذ أحمر شاب وقابض. التهوية لمدة 30 دقيقة تتيح للنبيذ أن يتنفس: تمدّه بالأكسجين، وتفتح الروائح المغلقة، وتليّن التانينات فيصبح أكثر استدارة في الكأس.","zh":"年轻且单宁强劲的红葡萄酒。醒酒30分钟让酒呼吸：接触空气可打开尚未展开的香气、柔化单宁，在杯中更为圆润。","es":"Tinto joven y tánico. Decantarlo por 30min lo deja respirar: lo oxigena, abre los aromas aún cerrados y suaviza los taninos, haciéndolo más redondo en copa.","fr":"Rouge jeune et tannique. Le décanter pendant 30min le laisse respirer : cela l'oxygène, ouvre les arômes encore fermés et adoucit les tanins, pour plus de rondeur au verre.","ja":"若くタンニンの強い赤ワイン。30分デキャンタージュすると酒が呼吸します。酸素に触れることで閉じた香りが開き、タンニンがやわらいでグラスの中でまろやかになります。","ru":"Молодое танинное красное. Декантация в течение 30мин даёт вину дышать: насыщает кислородом, раскрывает ещё закрытые ароматы и смягчает танины, делая вино округлее в бокале."}},{"cat":"Rosso","reg":"Lombardia","pr":"Ca' Del Bosco","nm":"Merlot","gr":"100% Merlot","pz":"€200","col":"#7A2A34","perfil":[["Leve","Encorpado",5],["Seco","Doce",1],["Suave","Vibrante",3],["Macio","Tânico",4],["Delicado","Intenso",5]],"tipos":["Massas","Molhos","Carne vermelha","Bolognesa","Tartufo","Pizza"],"temp":"16–18°C","decant":"Sim — 1h","hist":{"pt":"Merlot varietal do Ca' del Bosco, de uma safra já madura. Fruta escura em compota, chocolate e taninos amaciados pelo tempo.","it":"Merlot in purezza del Ca' del Bosco, da un'annata già matura. Frutta scura in confettura, cioccolato e tannini ammorbiditi dal tempo.","en":"A varietal Merlot from Ca' del Bosco, from an already mature vintage. Jammy dark fruit, chocolate and tannins softened by time."},"arom":{"pt":"ameixa, cereja negra, chocolate, couro e especiarias","it":"prugna, ciliegia nera, cioccolato, cuoio, spezie","en":"plum, black cherry, chocolate, leather, spices"},"scr":{"pt":"Um Merlot com dez anos de garrafa — já resolvido, macio, pronto para beber.","it":"Un Merlot con dieci anni di bottiglia — già risolto, morbido, pronto da bere.","en":"A Merlot with ten years in bottle — resolved, smooth, ready to drink."},"decwhy":{"pt":"Tinto maduro. Decantar por 1h cumpre dois papéis: separa o sedimento natural que se forma com os anos e oxigena o vinho, revelando aromas terciários (couro, especiarias, terra).","it":"Rosso maturo. Decantare per 1h ha due scopi: separa il sedimento che si forma con gli anni e ossigena il vino, rivelando aromi terziari (cuoio, spezie, terra).","en":"A mature red. Decanting for 1h does two things: it separates the sediment that forms over the years and aerates the wine, revealing tertiary aromas (leather, spice, earth).","de":"Reifer Rotwein. Das Dekantieren für 1h erfüllt zwei Zwecke: es trennt das über die Jahre entstandene Depot ab und belüftet den Wein, wodurch tertiäre Aromen (Leder, Gewürze, Erde) zum Vorschein kommen.","ar":"نبيذ أحمر ناضج. التهوية لمدة 1 ساعة لها غرضان: فصل الرواسب المتكوّنة مع السنين، وإمداد النبيذ بالأكسجين لتظهر الروائح الثلاثية (الجلد، التوابل، التراب).","zh":"成熟的红葡萄酒。醒酒1小时有两个作用：分离多年沉淀的酒渣，并让酒接触空气，展现皮革、香料、泥土等三类香气。","es":"Tinto maduro. Decantarlo por 1h cumple dos funciones: separa el sedimento formado con los años y oxigena el vino, revelando aromas terciarios (cuero, especias, tierra).","fr":"Rouge mûr. Le décanter pendant 1h remplit deux rôles : séparer le dépôt formé au fil des ans et aérer le vin, révélant les arômes tertiaires (cuir, épices, terre).","ja":"熟成した赤ワイン。1時間デキャンタージュには二つの役割があります。長年で生じた澱を取り除き、空気に触れさせて熟成由来の香り（革、スパイス、土）を引き出します。","ru":"Зрелое красное. Декантация в течение 1ч решает две задачи: отделяет осадок, образовавшийся за годы, и насыщает вино кислородом, раскрывая третичные ароматы (кожа, специи, земля)."},"img":"img/ca-del-bosco-merlot-2015.png"},{"cat":"Rosso","reg":"Piemonte · Langhe","pr":"Ceretto","nm":"Nebbiolo d'Alba DOC Bernardina","gr":"100% Nebbiolo","pz":"€80","col":"#8E3B36","img":"img/ceretto-nebbiolo-d-alba-bernardina-2022.png","perfil":[["Leve","Encorpado",3],["Seco","Doce",1],["Suave","Vibrante",5],["Macio","Tânico",5],["Delicado","Intenso",4]],"tipos":["Massas","Molhos","Carne vermelha","Frango","Bolognesa","Tartufo","Pizza"],"temp":"15–17°C","decant":"Não","hist":{"pt":"Nebbiolo na sua face acessível — rosas, alcatrão, cereja, tanino firme mas mais leve que o Barolo.","it":"Nebbiolo nella sua veste accessibile — rose, catrame, ciliegia, tannino fermo ma più leggero del Barolo.","en":"Nebbiolo in its accessible guise — roses, tar, cherry, firm but lighter tannin than Barolo."},"arom":{"pt":"cereja, rosas, alcatrão, couro, alcaçuz e especiarias","it":"ciliegia, rose, catrame, cuoio, liquirizia, spezie","en":"cherry, roses, tar, leather, licorice, spices"},"scr":{"pt":"Nebbiolo é o paradoxo: cor clara e granada, mas tânico e potente. Esta versão é a porta de entrada — Barolo sem a longa espera.","it":"Il Nebbiolo è const UVAS={"chardonnay":{"n":"Chardonnay","a":["chardonnay"],"o":{"pt":"A branca da Borgonha: muda de rosto conforme o clima e a madeira.","it":"La bianca della Borgogna: cambia volto secondo il clima e il legno.","en":"Burgundy's white: it changes face with the climate and the oak."},"d":{"pt":"Nasceu na Borgonha e hoje é plantada no mundo inteiro — é a uva do Chablis, do Champagne blanc de blancs e do Franciacorta. Sozinha tem sabor discreto, por isso espelha o lugar e a vinificação: em aço fica cítrica e afiada; em barrica ganha manteiga, avelã e baunilha. Na mesa: «é a uva mais versátil que existe — o mesmo nome dá um vinho tenso de Chablis e um cremoso de barrica».","it":"Nata in Borgogna e oggi piantata in tutto il mondo — è l'uva dello Chablis, dello Champagne blanc de blancs e del Franciacorta. Da sola ha sapore discreto, per questo rispecchia il luogo e la vinificazione: in acciaio resta agrumata e tesa; in barrique prende burro, nocciola e vaniglia. A tavola: «è l'uva più versatile che esista — lo stesso nome dà un vino teso di Chablis e uno cremoso di barrique».","en":"Born in Burgundy and now planted everywhere — it is the grape of Chablis, of blanc de blancs Champagne and of Franciacorta. On its own its flavour is discreet, which is why it mirrors place and winemaking: in steel it stays citrusy and taut; in oak it takes on butter, hazelnut and vanilla. At the table: «the most versatile white there is — the same name gives a lean Chablis and a creamy barrel-aged wine»."},"t":"b","i":0,"q":[4,3,null],"c":{"pt":"Amadurece cedo, o que a põe em risco de geada na primavera. Colhe-se cedo em clima fresco e para espumante — quando o açúcar ainda está baixo e a acidez alta — e mais tarde onde se quer um branco cheio.","it":"Matura presto, il che la espone alle gelate primaverili. Si vendemmia presto in clima fresco e per gli spumanti — quando lo zucchero è ancora basso e l'acidità alta — e più tardi dove si cerca un bianco pieno.","en":"It ripens early, which exposes it to spring frost. It is picked early in cool climates and for sparkling wine — while sugar is still low and acidity high — and later where a fuller white is wanted."},"v":{"pt":"É a uva que mais responde à vinificação. Em aço inox a frio mantém o cítrico; fermentada em barrica e deixada sobre as borras com bâtonnage ganha corpo e avelã. A malolática transforma o ácido málico, duro, em lático, macio — é daí que vem a nota de manteiga. No espumante, fermenta duas vezes: a segunda dentro da garrafa.","it":"È l'uva che risponde di più alla vinificazione. In acciaio a freddo mantiene l'agrume; fermentata in barrique e lasciata sui lieviti con bâtonnage prende corpo e nocciola. La malolattica trasforma l'acido malico, duro, in lattico, morbido — da lì la nota di burro. Nello spumante fermenta due volte: la seconda in bottiglia.","en":"It is the grape that responds most to winemaking. Cold-fermented in steel it keeps its citrus; fermented in barrel and left on the lees with bâtonnage it gains body and hazelnut. Malolactic turns hard malic acid into soft lactic acid — that is where the buttery note comes from. In sparkling wine it ferments twice: the second time inside the bottle."}},"sauvignonblanc":{"n":"Sauvignon Blanc","a":["sauvignon blanc","sauvignon"],"o":{"pt":"Aromática e cortante: sabugueiro, maracujá e grama cortada.","it":"Aromatica e tagliente: fiori di sambuco, passion fruit, erba tagliata.","en":"Aromatic and cutting: elderflower, passion fruit, cut grass."},"d":{"pt":"Do vale do Loire, onde faz o Sancerre e o Pouilly-Fumé, e hoje a estrela da Nova Zelândia. É reconhecida de olhos fechados: sabugueiro, maracujá, grama recém-cortada e um fundo mineral. Acidez alta, sempre seca, raramente passa por madeira. Na mesa: «se o cliente quer algo que acorde o paladar antes da comida, é esta».","it":"Dalla Valle della Loira, dove firma Sancerre e Pouilly-Fumé, e oggi stella della Nuova Zelanda. Si riconosce a occhi chiusi: sambuco, passion fruit, erba appena tagliata e un fondo minerale. Acidità alta, sempre secco, raramente passa in legno. A tavola: «se il cliente vuole qualcosa che svegli il palato prima del cibo, è questo».","en":"From the Loire, where it signs Sancerre and Pouilly-Fumé, and today New Zealand's star. You recognise it blind: elderflower, passion fruit, fresh-cut grass and a mineral base. High acidity, always dry, rarely oaked. At the table: «if the guest wants something that wakes the palate before the food, this is it»."},"t":"b","i":0,"q":[5,2,null],"c":{"pt":"A janela de colheita é curta e decide tudo: cedo demais dá pimentão verde, tarde demais perde o aroma e vira fruta tropical mole. Colhe-se de madrugada ou à noite, com a uva fria, para não perder os tióis — as moléculas do aroma.","it":"La finestra di vendemmia è stretta e decide tutto: troppo presto dà peperone verde, troppo tardi perde profumo e diventa frutta tropicale molle. Si raccoglie all'alba o di notte, con l'uva fredda, per non perdere i tioli — le molecole dell'aroma.","en":"The picking window is narrow and decides everything: too early gives green pepper, too late loses perfume and turns into soft tropical fruit. It is picked at dawn or at night, with the fruit cold, to preserve the thiols — the aroma molecules."},"v":{"pt":"Quase sempre em aço inox, a temperatura baixa (14–16°C), sem madeira e sem malolática: tudo para proteger o aroma e manter a acidez afiada. Alguns produtores deixam uma parte sobre as borras finas por alguns meses para dar textura sem tirar o nervo — é o caso do Ronco delle Mele.","it":"Quasi sempre in acciaio, a bassa temperatura (14–16°C), senza legno e senza malolattica: tutto per proteggere l'aroma e tenere l'acidità tagliente. Alcuni lasciano una parte sui lieviti fini per qualche mese, per dare texture senza togliere nervo — è il caso del Ronco delle Mele.","en":"Almost always in steel, at low temperature (14–16°C), without oak and without malolactic: all to protect the aroma and keep acidity sharp. Some producers leave part of it on fine lees for a few months to add texture without blunting the nerve — as in Ronco delle Mele."}},"riesling":{"n":"Riesling","a":["riesling renano","riesling"],"o":{"pt":"A grande branca alemã: acidez de limão que atravessa décadas.","it":"La grande bianca tedesca: acidità di limone che attraversa decenni.","en":"Germany's great white: a lemon acidity that lasts decades."},"d":{"pt":"A uva mais nobre da Alemanha, e das poucas brancas que envelhecem trinta anos. Pode ser seca ou doce — na Itália e na Alsácia é quase sempre seca. Dá lima, pêssego branco, flor e uma mineralidade de pedra; com os anos aparece uma nota de querosene que, aqui, é sinal de qualidade. Na mesa: «é seco, apesar do perfume — o aroma engana, o gosto é afiado».","it":"L'uva più nobile della Germania, e tra le poche bianche che invecchiano trent'anni. Può essere secco o dolce — in Italia e in Alsazia è quasi sempre secco. Dà lime, pesca bianca, fiori e una mineralità di pietra; con gli anni arriva una nota di idrocarburo che qui è segno di qualità. A tavola: «è secco, nonostante il profumo — l'aroma inganna, il gusto è teso».","en":"Germany's noblest grape, and one of the few whites that ages thirty years. It can be dry or sweet — in Italy and Alsace almost always dry. Lime, white peach, blossom and a stony minerality; with age a petrol note appears which here signals quality. At the table: «it is dry despite the perfume — the nose misleads, the palate is sharp»."},"t":"b","i":0,"q":[5,2,null],"c":{"pt":"Brota cedo e amadurece muito tarde — fica na vinha até outubro ou novembro, o que só é possível em clima fresco. A casca fina deixa entrar a Botrytis, e é por isso que a mesma uva dá tanto o seco quanto o doce, conforme o dia em que se colhe.","it":"Germoglia presto e matura molto tardi — resta in vigna fino a ottobre o novembre, cosa possibile solo in clima fresco. La buccia sottile lascia entrare la Botrytis, ed è per questo che la stessa uva dà sia il secco sia il dolce, a seconda del giorno di vendemmia.","en":"It buds early and ripens very late — it stays on the vine into October or November, possible only in a cool climate. Its thin skin lets in Botrytis, which is why the same grape gives both dry and sweet wines, depending on the day it is picked."},"v":{"pt":"Vinificação propositadamente neutra: aço inox ou grandes tonéis velhos de carvalho que já não dão aroma, sem malolática, para que o ácido málico cortante permaneça. Madeira nova é raríssima — tiraria justamente o que faz o Riesling. O açúcar residual, quando existe, vem de parar a fermentação pelo frio.","it":"Vinificazione volutamente neutra: acciaio o grandi botti vecchie che non cedono più aroma, senza malolattica, perché l'acido malico tagliente rimanga. Il legno nuovo è rarissimo — toglierebbe proprio ciò che fa il Riesling. Lo zucchero residuo, quando c'è, viene dal fermare la fermentazione col freddo.","en":"Deliberately neutral winemaking: steel or large old casks that no longer give aroma, with no malolactic, so the cutting malic acid remains. New oak is very rare — it would remove the very thing that makes Riesling. Residual sugar, when present, comes from stopping fermentation with cold."}},"semillon":{"n":"Sémillon","a":["sémillon","semillon"],"o":{"pt":"Parceira do Sauvignon em Bordeaux; casca fina, ideal para botrytis.","it":"Compagna del Sauvignon a Bordeaux; buccia fine, ideale per la botrytis.","en":"Sauvignon's partner in Bordeaux; thin-skinned, made for botrytis."},"d":{"pt":"Uva de Bordeaux, quase sempre misturada ao Sauvignon Blanc: dá corpo, cera e textura onde o Sauvignon dá acidez. A casca é fina, o que a torna presa fácil da Botrytis cinerea, a podridão nobre — é dela que nasce o Sauternes. Nos secos aparece como mel discreto e lanolina. Na mesa: «é o que dá o corpo; o Sauvignon dá o nervo».","it":"Uva di Bordeaux, quasi sempre in blend con il Sauvignon Blanc: dà corpo, cera e texture dove il Sauvignon dà acidità. La buccia è sottile, il che la rende facile preda della Botrytis cinerea, la muffa nobile — da lei nasce il Sauternes. Nei secchi arriva come miele discreto e lanolina. A tavola: «è lei che dà il corpo; il Sauvignon dà il nervo».","en":"A Bordeaux grape, almost always blended with Sauvignon Blanc: it brings body, wax and texture where Sauvignon brings acidity. Its thin skin makes it easy prey for Botrytis cinerea, noble rot — the source of Sauternes. In dry wines it shows as discreet honey and lanolin. At the table: «this is what gives the body; Sauvignon gives the nerve»."},"t":"b","i":0,"q":[3,4,null],"c":{"pt":"Colhe-se tarde e, nos doces, em várias passagens pela mesma vinha: os apanhadores voltam cacho a cacho, às vezes bago a bago, colhendo só o que já foi tomado pela podridão nobre. É uma das colheitas mais caras que existem.","it":"Si vendemmia tardi e, nei dolci, in più passaggi nella stessa vigna: i vendemmiatori tornano grappolo per grappolo, a volte acino per acino, raccogliendo solo ciò che la muffa nobile ha già preso. È una delle vendemmie più costose che esistano.","en":"It is picked late and, for sweet wines, in several passes through the same vineyard: pickers return bunch by bunch, sometimes berry by berry, taking only what noble rot has already claimed. It is one of the most expensive harvests there is."},"v":{"pt":"Nos secos, fermenta em barrica e repousa sobre as borras, o que lhe dá a textura de cera. Nos doces, o mosto é tão concentrado que a fermentação para sozinha: as leveduras morrem com o álcool antes de consumir todo o açúcar, e o que sobra é o doce natural.","it":"Nei secchi fermenta in barrique e riposa sui lieviti, da cui la texture di cera. Nei dolci il mosto è così concentrato che la fermentazione si ferma da sola: i lieviti muoiono per l'alcol prima di consumare tutto lo zucchero, e ciò che resta è il dolce naturale.","en":"In dry wines it ferments in barrel and rests on the lees, hence its waxy texture. In sweet wines the must is so concentrated that fermentation stops by itself: the yeasts die of alcohol before consuming all the sugar, and what remains is natural sweetness."}},"gewurztraminer":{"n":"Gewürztraminer","a":["gewürztraminer","gewurztraminer","traminer"],"o":{"pt":"Lichia, rosa e especiaria: a branca mais perfumada que existe.","it":"Litchi, rosa e spezie: la bianca più profumata che esista.","en":"Lychee, rose and spice: the most perfumed white there is."},"d":{"pt":"«Gewürz» é especiaria em alemão, e o nome diz tudo. Nasceu em Tramin, no Alto Adige — a casa dela é aqui ao lado — e brilha também na Alsácia. Lichia, pétala de rosa, gengibre e um toque de canela; a acidez é baixa e o corpo cheio, o que faz muita gente jurar que é doce quando não é. Na mesa: «perfume de sobremesa, gosto seco — funciona com queijo forte e com cozinha asiática».","it":"«Gewürz» in tedesco è spezia, e il nome dice tutto. È nata a Termeno, in Alto Adige — la sua casa è qui accanto — e brilla anche in Alsazia. Litchi, petalo di rosa, zenzero e un tocco di cannella; l'acidità è bassa e il corpo pieno, per questo molti giurano che sia dolce quando non lo è. A tavola: «profumo da dessert, gusto secco — funziona con formaggi forti e con la cucina asiatica».","en":"«Gewürz» is German for spice, and the name says it all. It was born in Tramin, in Alto Adige — its home is next door — and shines in Alsace too. Lychee, rose petal, ginger and a touch of cinnamon; acidity is low and the body full, which is why many swear it is sweet when it is not. At the table: «a dessert perfume with a dry taste — it works with strong cheese and with Asian food»."},"t":"b","i":2,"q":[4,null,null],"c":{"pt":"Brota cedo e amadurece cedo, acumulando açúcar muito depressa — e perdendo acidez na mesma velocidade. Por isso se colhe no momento exato: um ou dois dias a mais e o vinho fica mole e alcoólico demais.","it":"Germoglia presto e matura presto, accumulando zucchero molto in fretta — e perdendo acidità alla stessa velocità. Per questo si vendemmia nel momento esatto: uno o due giorni in più e il vino diventa molle e troppo alcolico.","en":"It buds and ripens early, piling up sugar very fast — and losing acidity just as fast. Hence the picking must be exact: a day or two more and the wine turns flabby and overly alcoholic."},"v":{"pt":"Fermenta em aço a temperatura baixa para preservar os terpenos, as moléculas que dão o aroma de rosa e lichia. Costuma-se fazer uma maceração curta com a casca, porque é lá que estão os aromas — e é dela que vem também a cor dourada mais intensa que a dos outros brancos.","it":"Fermenta in acciaio a bassa temperatura per preservare i terpeni, le molecole del profumo di rosa e litchi. Si fa spesso una breve macerazione sulle bucce, perché lì stanno gli aromi — e da lì viene anche il colore dorato più intenso rispetto agli altri bianchi.","en":"It ferments in steel at low temperature to preserve the terpenes, the molecules behind the rose and lychee aroma. A short skin maceration is common, because the aromas sit in the skins — and so does the deeper golden colour that sets it apart from other whites."}},"pinotgrigio":{"n":"Pinot Grigio","a":["pinot grigio","pinot gris"],"o":{"pt":"Mutação cinza do Pinot Nero: pera, amêndoa e um final salino.","it":"Mutazione grigia del Pinot Nero: pera, mandorla e un finale sapido.","en":"The grey mutation of Pinot Nero: pear, almond and a saline finish."},"d":{"pt":"É o mesmo Pinot Nero com uma mutação na cor da casca — rosada-acinzentada, e não vermelha. Na Itália dá um branco limpo de pera, maçã e amêndoa; na Alsácia, onde se chama Pinot Gris, fica mais gordo e especiado. Quando a casca fica em contato com o mosto, nasce o ramato, de cor cobre. Na mesa: «é o branco mais fácil da carta — não contraria prato nenhum».","it":"È lo stesso Pinot Nero con una mutazione nel colore della buccia — rosata-grigia, non rossa. In Italia dà un bianco pulito di pera, mela e mandorla; in Alsazia, dove si chiama Pinot Gris, diventa più grasso e speziato. Quando la buccia resta a contatto col mosto nasce il ramato, color rame. A tavola: «è il bianco più facile della carta — non contraddice nessun piatto».","en":"It is the same Pinot Nero with a mutation in skin colour — pinkish-grey rather than red. In Italy it gives a clean white of pear, apple and almond; in Alsace, as Pinot Gris, it turns richer and spicier. Left in contact with its skins it becomes ramato, copper-coloured. At the table: «the easiest white on the list — it contradicts no dish»."},"t":"b","i":0,"q":[3,3,null],"c":{"pt":"A casca rosada-acinzentada obriga a uma decisão na vindima: colher cedo e prensar logo, para um branco pálido e fresco, ou deixar amadurecer e macerar, para um vinho mais encorpado e de cor cobre. São dois vinhos diferentes da mesma uva.","it":"La buccia rosata-grigia impone una decisione in vendemmia: raccogliere presto e pressare subito, per un bianco pallido e fresco, oppure lasciar maturare e macerare, per un vino più pieno e di colore rame. Sono due vini diversi dalla stessa uva.","en":"The pinkish-grey skin forces a choice at harvest: pick early and press at once for a pale, fresh white, or let it ripen and macerate for a fuller, copper-coloured wine. They are two different wines from one grape."},"v":{"pt":"A versão italiana é prensada de imediato e fermentada a frio em aço, sem contato com a casca — daí a cor quase incolor. Se a casca fica algumas horas no mosto, o vinho sai cobre: é o ramato, estilo tradicional do Friul que voltou à moda.","it":"La versione italiana viene pressata subito e fermentata a freddo in acciaio, senza contatto con le bucce — da cui il colore quasi incolore. Se la buccia resta qualche ora nel mosto, il vino esce ramato: è lo stile tradizionale friulano tornato di moda.","en":"The Italian version is pressed at once and cold-fermented in steel, with no skin contact — hence the near-colourless wine. If the skins stay a few hours in the must, the wine turns copper: ramato, the traditional Friulian style now back in fashion."}},"pinotbianco":{"n":"Pinot Bianco","a":["pinot bianco","pinot blanc"],"o":{"pt":"Discreto e cremoso: maçã, amêndoa e muita textura em espumante.","it":"Discreto e cremoso: mela, mandorla e molta texture negli spumanti.","en":"Discreet and creamy: apple, almond and great texture in sparkling."},"d":{"pt":"Outra mutação da família Pinot, de casca branca. Não é uma uva de aroma exuberante: o que ela traz é textura, corpo macio e acidez média. É por isso que entra nas cuvées do Franciacorta — sobretudo no Satèn, que não admite uva tinta — e brilha no Alto Adige, onde ganha nervo e mineralidade. Na mesa: «é a uva que dá a cremosidade, não o perfume».","it":"Un'altra mutazione della famiglia Pinot, a buccia bianca. Non è un'uva dal profumo esuberante: quello che porta è texture, corpo morbido e acidità media. Per questo entra nelle cuvée del Franciacorta — soprattutto nel Satèn, che non ammette uva rossa — e brilla in Alto Adige, dove prende nervo e mineralità. A tavola: «è l'uva che dà la cremosità, non il profumo».","en":"Another mutation of the Pinot family, white-skinned. It is not an exuberantly aromatic grape: what it brings is texture, soft body and medium acidity. Hence its place in Franciacorta cuvées — above all in Satèn, which allows no red grapes — and its brilliance in Alto Adige, where it gains nerve and minerality. At the table: «this is the grape that gives creaminess, not perfume»."},"t":"b","i":0,"q":[4,3,null],"c":{"pt":"Amadurece cedo e mantém acidez mesmo com açúcar alto, o que a torna ideal para espumante: colhe-se na segunda quinzena de agosto, bem antes do ponto de um vinho tranquilo, e sempre à mão em caixas pequenas para a uva chegar inteira.","it":"Matura presto e mantiene acidità anche con zuccheri alti, il che la rende ideale per lo spumante: si vendemmia nella seconda metà di agosto, ben prima del punto di un vino fermo, e sempre a mano in cassette piccole perché l'uva arrivi intatta.","en":"It ripens early and keeps its acidity even at high sugar, which makes it ideal for sparkling wine: picked in the second half of August, well before still-wine ripeness, and always by hand in small crates so the fruit arrives whole."},"v":{"pt":"Prensagem muito suave, para extrair só o mosto-flor, e fermentação a frio. No Franciacorta Satèn entra ao lado do Chardonnay e nunca com uva tinta — por disciplinare, o Satèn só admite brancas, e a pressão na garrafa é menor (até 5 atmosferas em vez de 6), o que dá aquela espuma mais macia.","it":"Pressatura molto soffice, per estrarre solo il mosto fiore, e fermentazione a freddo. Nel Franciacorta Satèn entra accanto allo Chardonnay e mai con uva rossa — per disciplinare il Satèn ammette solo bianche, e la pressione in bottiglia è minore (fino a 5 atmosfere invece di 6), da cui quella spuma più morbida.","en":"Very gentle pressing, to take only the free-run must, and cold fermentation. In Franciacorta Satèn it joins Chardonnay and never red grapes — the rules allow only white varieties, and bottle pressure is lower (up to 5 atmospheres instead of 6), which gives that softer mousse."}},"viognier":{"n":"Viognier","a":["viognier"],"o":{"pt":"Damasco e flor branca, corpo cheio e pouca acidez.","it":"Albicocca e fiori bianchi, corpo pieno e poca acidità.","en":"Apricot and white blossom, full body, low acidity."},"d":{"pt":"Uva do norte do Ródano, quase extinta nos anos 1960 e recuperada depois. Dá damasco maduro, flor de laranjeira e mel, com corpo largo e acidez baixa — parece doce sem ter açúcar. Na mesa: «é o branco mais perfumado e mais cheio; quem gosta de Chardonnay de barrica costuma gostar».","it":"Uva del Rodano settentrionale, quasi estinta negli anni Sessanta e poi recuperata. Dà albicocca matura, fiori d'arancio e miele, con corpo ampio e acidità bassa — sembra dolce senza avere zucchero. A tavola: «è il bianco più profumato e più pieno; chi ama lo Chardonnay in barrique di solito lo apprezza».","en":"A northern Rhône grape, nearly extinct in the 1960s and since recovered. Ripe apricot, orange blossom and honey, with a broad body and low acidity — it tastes sweet without sugar. At the table: «the most perfumed and fullest white; people who like oaked Chardonnay usually like it»."},"t":"b","i":0,"q":[2,4,null],"c":{"pt":"Precisa de maturação completa para revelar o damasco — colhida cedo demais não tem aroma nenhum. Mas espera demais e a acidez desaparece: é das uvas mais difíceis de acertar na vindima.","it":"Ha bisogno di piena maturazione per rivelare l'albicocca — vendemmiata troppo presto non ha alcun profumo. Ma aspettando troppo l'acidità sparisce: è tra le uve più difficili da cogliere al momento giusto.","en":"It needs full ripeness to reveal its apricot — picked too early it has no aroma at all. But wait too long and the acidity vanishes: it is among the hardest grapes to time at harvest."},"v":{"pt":"Fermenta em aço ou em barrica usada, muitas vezes com as borras finas, para ganhar textura sem perder o perfume. A malolática é frequente: como a acidez já é baixa, amaciar ainda mais não incomoda.","it":"Fermenta in acciaio o in barrique usata, spesso con i lieviti fini, per guadagnare texture senza perdere profumo. La malolattica è frequente: poiché l'acidità è già bassa, ammorbidire ancora non disturba.","en":"It ferments in steel or used barrels, often with fine lees, to gain texture without losing perfume. Malolactic is common: since acidity is already low, softening further does no harm."}},"glera":{"n":"Glera","a":["glera"],"o":{"pt":"A uva do Prosecco: maçã verde, pera e flor de acácia.","it":"L'uva del Prosecco: mela verde, pera e fiori d'acacia.","en":"The Prosecco grape: green apple, pear and acacia blossom."},"d":{"pt":"Até 2009 chamava-se «prosecco»; o nome da uva foi trocado para Glera justamente para que «Prosecco» passasse a designar só a denominação. Vem do Vêneto e do Friul, tem acidez média e aroma delicado de maçã verde, pera e flor de acácia. Faz-se em autoclave (método Martinotti/Charmat), não em garrafa — é isso que mantém o frutado fresco. Na mesa: «Prosecco é o lugar, Glera é a uva».","it":"Fino al 2009 si chiamava «prosecco»; il nome dell'uva è stato cambiato in Glera proprio perché «Prosecco» indicasse solo la denominazione. Viene dal Veneto e dal Friuli, ha acidità media e profumo delicato di mela verde, pera e fiori d'acacia. Si spumantizza in autoclave (metodo Martinotti/Charmat), non in bottiglia — ed è questo che mantiene il frutto fresco. A tavola: «Prosecco è il luogo, Glera è l'uva».","en":"Until 2009 it was called «prosecco»; the grape was renamed Glera precisely so that «Prosecco» would denote only the appellation. From the Veneto and Friuli, it has medium acidity and a delicate scent of green apple, pear and acacia blossom. It is made in tank (Martinotti/Charmat), not in bottle — which is what keeps the fruit fresh. At the table: «Prosecco is the place, Glera is the grape»."},"t":"b","i":1,"q":[3,2,null],"c":{"pt":"Colhe-se cedo, em setembro, deliberadamente antes da maturação plena: o objetivo é um mosto de pouco álcool e acidez viva, porque o que se quer é frescor, não concentração. Nas encostas de Valdobbiadene a vindima é à mão, porque o declive não aceita máquina.","it":"Si vendemmia presto, a settembre, volutamente prima della piena maturazione: serve un mosto di poco alcol e acidità viva, perché si cerca freschezza, non concentrazione. Sulle colline di Valdobbiadene la vendemmia è a mano, perché la pendenza non accetta macchine.","en":"It is picked early, in September, deliberately before full ripeness: the aim is a must low in alcohol with lively acidity, because what is wanted is freshness, not concentration. On the slopes of Valdobbiadene picking is by hand — the gradient admits no machine."},"v":{"pt":"Método Martinotti, também chamado Charmat: a segunda fermentação acontece num tanque de aço pressurizado, em semanas, e não dentro da garrafa, em anos. É exatamente o contrário do Champagne — e é de propósito: o tanque preserva o aroma de fruta fresca e flor, que o longo contato com as borras apagaria.","it":"Metodo Martinotti, detto anche Charmat: la seconda fermentazione avviene in autoclave d'acciaio, in settimane, e non in bottiglia, in anni. È l'esatto contrario dello Champagne — ed è voluto: l'autoclave preserva il profumo di frutta fresca e fiori, che un lungo contatto con i lieviti cancellerebbe.","en":"The Martinotti method, also called Charmat: the second fermentation happens in a pressurised steel tank, over weeks, not inside the bottle over years. It is the exact opposite of Champagne — and deliberately so: the tank preserves the fresh fruit and floral aromas that long lees contact would erase."}},"arneis":{"n":"Arneis","a":["arneis"],"o":{"pt":"A branca do Roero: pera, amêndoa e um amargo fino no final.","it":"La bianca del Roero: pera, mandorla e un amaro fine nel finale.","en":"Roero's white: pear, almond and a fine bitter finish."},"d":{"pt":"Branca piemontesa do Roero, logo ao norte de Alba. «Arneis» em dialeto quer dizer mais ou menos «encrenqueiro» — é uva difícil na vinha. Quase desapareceu nos anos 1970 e foi salva por poucos produtores. Dá pera, pêssego branco, amêndoa e um amargor elegante no final, com acidez média. Na mesa: «é o branco do Piemonte, da mesma terra do Barolo».","it":"Bianca piemontese del Roero, appena a nord di Alba. «Arneis» in dialetto vuol dire più o meno «birichino» — è un'uva difficile in vigna. Era quasi scomparsa negli anni Settanta ed è stata salvata da pochi produttori. Dà pera, pesca bianca, mandorla e un amaro elegante nel finale, con acidità media. A tavola: «è il bianco del Piemonte, della stessa terra del Barolo».","en":"A Piedmontese white from Roero, just north of Alba. «Arneis» in dialect means roughly «the rascal» — it is awkward in the vineyard. It had nearly vanished by the 1970s and was saved by a handful of growers. Pear, white peach, almond and an elegant bitter finish, with medium acidity. At the table: «this is Piedmont's white, from the same land as Barolo»."},"t":"b","i":1,"q":[3,3,null],"c":{"pt":"Amadurece cedo e perde acidez depressa quando passa do ponto — por isso se colhe cedo, em setembro. Além disso tem brotação irregular e produção instável de ano para ano, o que ajuda a explicar por que quase desapareceu.","it":"Matura presto e perde acidità in fretta quando supera il punto — per questo si vendemmia presto, a settembre. Ha inoltre germogliamento irregolare e produzione instabile di anno in anno, il che aiuta a spiegare perché sia quasi scomparsa.","en":"It ripens early and loses acidity quickly once past its point — hence an early September picking. It also buds irregularly and yields unpredictably from year to year, which helps explain why it nearly disappeared."},"v":{"pt":"Prensagem suave e fermentação a frio em aço, sem madeira, para manter a pera e a flor. A malolática costuma ser evitada: com acidez já média, amaciar mais tiraria o pouco nervo que tem.","it":"Pressatura soffice e fermentazione a freddo in acciaio, senza legno, per tenere la pera e il fiore. La malolattica di solito si evita: con acidità già media, ammorbidire ancora toglierebbe il poco nervo che ha.","en":"Gentle pressing and cold fermentation in steel, without oak, to keep the pear and the blossom. Malolactic is usually avoided: with medium acidity already, softening further would take away what little nerve it has."}},"timorasso":{"n":"Timorasso","a":["timorasso"],"o":{"pt":"Branca quase extinta dos Colli Tortonesi; envelhece como poucas.","it":"Bianca quasi estinta dei Colli Tortonesi; invecchia come poche.","en":"A near-extinct white from Colli Tortonesi; it ages like few others."},"d":{"pt":"Uva antiga do leste do Piemonte, nos Colli Tortonesi, praticamente abandonada no pós-guerra e trazida de volta nos anos 1980 por Walter Massa. O vinho chama-se Derthona, o nome romano de Tortona. Corpo cheio, acidez alta, mineralidade salina e um perfume que ganha mel e hidrocarboneto com os anos. Na mesa: «é o branco do Piemonte que envelhece como um Riesling».","it":"Uva antica del Piemonte orientale, nei Colli Tortonesi, praticamente abbandonata nel dopoguerra e riportata in vita negli anni Ottanta da Walter Massa. Il vino si chiama Derthona, il nome romano di Tortona. Corpo pieno, acidità alta, mineralità sapida e un profumo che prende miele e idrocarburo con gli anni. A tavola: «è il bianco del Piemonte che invecchia come un Riesling».","en":"An old grape from eastern Piedmont, in the Colli Tortonesi, all but abandoned after the war and brought back in the 1980s by Walter Massa. The wine is called Derthona, the Roman name for Tortona. Full body, high acidity, saline minerality and a nose that gains honey and petrol with age. At the table: «Piedmont's white that ages like a Riesling»."},"t":"b","i":1,"q":[5,4,null],"c":{"pt":"Amadurece tarde, em meados de setembro, e é difícil na vinha: o cacho é compacto e apodrece com facilidade se chove. Foi esse trabalho todo que fez os produtores abandonarem a uva no pós-guerra, trocando-a pela Cortese, mais fácil.","it":"Matura tardi, a metà settembre, ed è difficile in vigna: il grappolo è compatto e marcisce facilmente con la pioggia. È stato questo lavoro a far abbandonare l'uva nel dopoguerra, sostituita dalla più facile Cortese.","en":"It ripens late, in mid-September, and is awkward in the vineyard: the bunch is compact and rots easily in rain. That labour is why growers abandoned it after the war, replacing it with the easier Cortese."},"v":{"pt":"Fermenta em aço e repousa longamente sobre as borras finas — às vezes um ano — o que lhe dá corpo e a textura quase oleosa. Não precisa de madeira: a estrutura vem da própria uva. É um branco que deve ser aberto com alguns anos, porque jovem ainda está fechado.","it":"Fermenta in acciaio e riposa a lungo sui lieviti fini — a volte un anno — il che gli dà corpo e quella texture quasi oleosa. Non ha bisogno di legno: la struttura viene dall'uva. È un bianco da aprire con qualche anno, perché da giovane è ancora chiuso.","en":"It ferments in steel and rests long on fine lees — sometimes a year — which gives it body and an almost oily texture. It needs no oak: the structure comes from the grape itself. It is a white to open with a few years on it, because young it is still closed."}},"ribollagialla":{"n":"Ribolla Gialla","a":["ribolla gialla"],"o":{"pt":"Friulana antiga: cítrica, salina, de casca grossa e cor dourada.","it":"Friulana antica: agrumata, sapida, buccia spessa e colore dorato.","en":"An old Friulian: citrusy, saline, thick-skinned, golden."},"d":{"pt":"Cultivada no Collio e na Eslovênia desde o século XIII — aparece em documentos venezianos. Casca grossa e amarelada, o que explica a cor dourada e a boa afinidade com maceração. Dá cítrico, flor de campo, erva e uma salinidade marcada; acidez alta. Na mesa: «é a uva histórica do Friul, da fronteira com a Eslovênia».","it":"Coltivata nel Collio e in Slovenia dal XIII secolo — compare in documenti veneziani. Buccia spessa e gialla, il che spiega il colore dorato e la buona attitudine alla macerazione. Dà agrumi, fiori di campo, erbe e una sapidità marcata; acidità alta. A tavola: «è l'uva storica del Friuli, del confine con la Slovenia».","en":"Grown in the Collio and in Slovenia since the 13th century — it appears in Venetian records. Thick yellow skin, which explains the golden colour and its affinity with skin contact. Citrus, meadow flowers, herbs and marked salinity; high acidity. At the table: «Friuli's historic grape, from the Slovenian border»."},"t":"b","i":1,"q":[4,3,null],"c":{"pt":"Colhe-se em setembro, e a casca grossa é uma vantagem: resiste à chuva e ao transporte, e aguenta ficar em contato com o mosto sem dar amargor. É por isso que é a uva escolhida para os vinhos de maceração do Friul.","it":"Si vendemmia a settembre, e la buccia spessa è un vantaggio: resiste alla pioggia e al trasporto, e regge il contatto col mosto senza dare amaro. Per questo è l'uva scelta per i vini macerati del Friuli.","en":"It is picked in September, and its thick skin is an advantage: it resists rain and handling, and tolerates contact with the must without turning bitter. Hence its role in Friuli's skin-contact wines."},"v":{"pt":"Pode seguir dois caminhos opostos. Vinificada em branco, prensada logo e fermentada em aço, dá um vinho cítrico e salino. Deixada em maceração com a casca por dias ou meses, torna-se um orange wine: cor âmbar, tanino e aroma de casca de laranja e chá.","it":"Può seguire due strade opposte. Vinificata in bianco, pressata subito e fermentata in acciaio, dà un vino agrumato e sapido. Lasciata in macerazione sulle bucce per giorni o mesi, diventa un orange wine: colore ambra, tannino e profumo di scorza d'arancia e tè.","en":"It can take two opposite roads. Vinified as a white, pressed at once and fermented in steel, it gives a citrusy, saline wine. Left to macerate on its skins for days or months, it becomes an orange wine: amber colour, tannin, and aromas of orange peel and tea."}},"friulano":{"n":"Friulano","a":["friulano","tocai friulano"],"o":{"pt":"O branco de casa do Friul: amêndoa amarga e pera.","it":"Il bianco di casa del Friuli: mandorla amara e pera.","en":"Friuli's house white: bitter almond and pear."},"d":{"pt":"Chamava-se Tocai Friulano até 2007, quando a União Europeia reservou o nome «Tokaj» à Hungria. É o branco mais plantado do Friul e o que os friulanos bebem em casa. Pera, maçã, flor e um final inconfundível de amêndoa amarga, com boa acidez. Na mesa: «é o branco local; o nome mudou mas a uva é a mesma de sempre».","it":"Si chiamava Tocai Friulano fino al 2007, quando l'Unione Europea ha riservato il nome «Tokaj» all'Ungheria. È il bianco più piantato del Friuli e quello che i friulani bevono in casa. Pera, mela, fiori e un finale inconfondibile di mandorla amara, con buona acidità. A tavola: «è il bianco locale; il nome è cambiato ma l'uva è la stessa di sempre».","en":"It was called Tocai Friulano until 2007, when the EU reserved the name «Tokaj» for Hungary. It is Friuli's most planted white and what the Friulians drink at home. Pear, apple, blossom and an unmistakable bitter-almond finish, with good acidity. At the table: «the local white; the name changed, the grape did not»."},"t":"b","i":1,"q":[4,3,null],"c":{"pt":"Vigoroso e produtivo, exige poda curta e desbaste para não dar uva demais e perder concentração. Colhe-se em meados de setembro, antes da Ribolla, quando a acidez ainda segura.","it":"Vigoroso e produttivo, richiede potatura corta e diradamento per non caricare troppo e perdere concentrazione. Si vendemmia a metà settembre, prima della Ribolla, quando l'acidità regge ancora.","en":"Vigorous and productive, it needs short pruning and thinning so it does not overcrop and lose concentration. It is picked in mid-September, before Ribolla, while acidity still holds."},"v":{"pt":"Fermentação a frio em aço na maioria dos casos. Uma pequena maceração a frio antes de fermentar é comum: extrai o aroma e reforça a amêndoa amarga do final, que é a assinatura da uva. Grandes tonéis de madeira velha aparecem nas versões de guarda.","it":"Fermentazione a freddo in acciaio nella maggior parte dei casi. Una breve macerazione a freddo prima della fermentazione è frequente: estrae il profumo e rinforza la mandorla amara del finale, firma dell'uva. Grandi botti di legno vecchio compaiono nelle versioni da guardia.","en":"Cold fermentation in steel in most cases. A short cold maceration before fermenting is common: it draws out the aroma and reinforces the bitter-almond finish that is the grape's signature. Large old casks appear in the versions meant for keeping."}},"malvasia":{"n":"Malvasia Istriana","a":["malvasia istriana","malvasia"],"o":{"pt":"A Malvásia do Adriático: damasco, salva e muita salinidade.","it":"La Malvasia dell'Adriatico: albicocca, salvia e molta sapidità.","en":"The Adriatic Malvasia: apricot, sage and great salinity."},"d":{"pt":"«Malvasia» é um nome que cobre dezenas de uvas diferentes pelo Mediterrâneo; a do Collio é a Malvasia Istriana, da Ístria, plantada ali desde os tempos da República de Veneza. Levemente aromática: damasco, pêssego, salva e tomilho, com uma salinidade mineral que vem do solo de ponca. Na mesa: «não é a Malvásia doce de Madeira — esta é seca, salina e friulana».","it":"«Malvasia» è un nome che copre decine di uve diverse nel Mediterraneo; quella del Collio è la Malvasia Istriana, dall'Istria, piantata lì dai tempi della Repubblica di Venezia. Leggermente aromatica: albicocca, pesca, salvia e timo, con una sapidità minerale che viene dalla ponca. A tavola: «non è la Malvasia dolce di Madeira — questa è secca, sapida e friulana».","en":"«Malvasia» is a name covering dozens of different grapes around the Mediterranean; the Collio one is Malvasia Istriana, from Istria, planted there since the days of the Venetian Republic. Lightly aromatic: apricot, peach, sage and thyme, with a mineral salinity from the ponca soil. At the table: «not the sweet Madeira Malvasia — this one is dry, saline and Friulian»."},"t":"b","i":1,"q":[4,4,null],"c":{"pt":"Colhida à mão em setembro, com a uva madura mas não passada — o aroma de damasco só aparece com maturação completa, e a acidez cai rápido depois disso. Nas colinas do Collio o solo é a ponca, uma marga que se desfaz na mão.","it":"Vendemmiata a mano a settembre, con l'uva matura ma non surmatura — il profumo di albicocca arriva solo a piena maturazione, e l'acidità cala in fretta dopo. Sulle colline del Collio il suolo è la ponca, una marna che si sbriciola in mano.","en":"Hand-picked in September, ripe but not overripe — the apricot aroma appears only at full ripeness, and acidity drops fast after that. On the Collio hills the soil is ponca, a marl that crumbles in the hand."},"v":{"pt":"Maceração curta a frio, de cerca de 20 horas, para extrair o aroma da casca; depois fermentação e repouso sobre as borras, parte em grandes tonéis de madeira, parte em aço. Os melhores produtores trabalham protegendo o mosto do oxigênio com o próprio gás da fermentação.","it":"Macerazione breve a freddo, circa 20 ore, per estrarre il profumo dalla buccia; poi fermentazione e riposo sui lieviti, in parte in botti grandi, in parte in acciaio. I migliori proteggono il mosto dall'ossigeno con la stessa anidride carbonica della fermentazione.","en":"A short cold maceration of about 20 hours to draw aroma from the skins; then fermentation and lees ageing, part in large casks, part in steel. The best growers shield the must from oxygen using the carbon dioxide of its own fermentation."}},"picolit":{"n":"Picolit","a":["picolit"],"o":{"pt":"Raríssima friulana de cacho minúsculo; mel e flor.","it":"Rarissima friulana dal grappolo minuscolo; miele e fiori.","en":"A very rare Friulian with tiny bunches; honey and blossom."},"d":{"pt":"O nome vem de «picol», pequeno: a uva aborta a maior parte das bagas e o cacho fica ralo, com rendimento mínimo — era o vinho de presente das cortes europeias no século XVIII. Dá mel, flor seca, amêndoa e damasco; costuma aparecer em doces ou em pequena quantidade em grandes brancos. Na mesa: «é a uva mais rara do Friul — por isso entra em poucos vinhos e sempre em pouca quantidade».","it":"Il nome viene da «picol», piccolo: l'uva aborta la maggior parte degli acini e il grappolo resta spargolo, con resa minima — era il vino da regalo delle corti europee nel Settecento. Dà miele, fiori secchi, mandorla e albicocca; compare nei dolci o in piccola parte nei grandi bianchi. A tavola: «è l'uva più rara del Friuli — per questo entra in pochi vini e sempre in piccola quantità».","en":"The name comes from «picol», small: the vine aborts most of its berries and the bunch stays sparse, with minimal yield — it was the gift wine of 18th-century European courts. Honey, dried flowers, almond and apricot; it appears in sweet wines or in small proportions in great whites. At the table: «Friuli's rarest grape — hence few wines, and always a small share»."},"t":"b","i":1,"q":[3,4,null],"c":{"pt":"A videira sofre de aborto floral: a maior parte das flores não vinga e o cacho fica com poucas bagas espalhadas. Isso significa rendimento mínimo, mas também bagas muito concentradas — e permite secá-las sem apodrecer, porque o ar circula entre elas.","it":"La vite soffre di aborto floreale: gran parte dei fiori non allega e il grappolo resta spargolo, con pochi acini. Significa resa minima, ma anche acini molto concentrati — e permette l'appassimento senza marcire, perché l'aria circola tra di essi.","en":"The vine suffers floral abortion: most flowers fail to set and the bunch is left sparse. That means a minimal yield, but also highly concentrated berries — and allows them to dry without rotting, because air circulates between them."},"v":{"pt":"A uva é colhida tarde e muitas vezes posta a secar sobre esteiras por semanas antes de ser prensada. A fermentação é lenta e para antes de consumir todo o açúcar. Em pequena quantidade, entra também em brancos secos, onde dá perfume e corpo sem adoçar.","it":"L'uva si raccoglie tardi e spesso si appassisce su graticci per settimane prima della pressatura. La fermentazione è lenta e si ferma prima di consumare tutto lo zucchero. In piccola quantità entra anche in bianchi secchi, dove dà profumo e corpo senza addolcire.","en":"The fruit is picked late and often dried on racks for weeks before pressing. Fermentation is slow and stops before all the sugar is consumed. In small amounts it also joins dry whites, where it lends perfume and body without sweetening."}},"grechetto":{"n":"Grechetto","a":["grechetto"],"o":{"pt":"Umbra de casca grossa: amêndoa, erva e corpo firme.","it":"Umbra dalla buccia spessa: mandorla, erbe e corpo saldo.","en":"A thick-skinned Umbrian: almond, herbs and firm body."},"d":{"pt":"Branca da Úmbria, de casca grossa e muito resistente — por isso aguenta ficar na vinha até tarde e serve tanto para secos como para passitos. Dá amêndoa, pera, erva e um corpo mais firme que a média dos brancos italianos. É a uva que dá estrutura ao Orvieto e ao Cervaro della Sala, ao lado do Chardonnay. Na mesa: «é a parte italiana do blend — dá a amêndoa e o corpo».","it":"Bianca dell'Umbria, dalla buccia spessa e molto resistente — per questo regge la vendemmia tardiva e serve sia per i secchi sia per i passiti. Dà mandorla, pera, erbe e un corpo più saldo della media dei bianchi italiani. È l'uva che dà struttura all'Orvieto e al Cervaro della Sala, accanto allo Chardonnay. A tavola: «è la parte italiana del blend — dà la mandorla e il corpo».","en":"An Umbrian white, thick-skinned and very resistant — hence it withstands late harvest and serves both dry wines and passiti. Almond, pear, herbs and a firmer body than most Italian whites. It is the grape that gives structure to Orvieto and to Cervaro della Sala, alongside Chardonnay. At the table: «the Italian half of the blend — it brings the almond and the body»."},"t":"b","i":1,"q":[4,4,null],"c":{"pt":"Amadurece tarde, em outubro, e a casca grossa resiste muito bem — por isso pode ficar na vinha até depois das outras e serve tanto para o vinho seco quanto para o passito e para os muffati, quando a podridão nobre a toma.","it":"Matura tardi, in ottobre, e la buccia spessa resiste molto bene — per questo può restare in vigna dopo le altre e serve sia per il vino secco sia per il passito e per i muffati, quando la muffa nobile la prende.","en":"It ripens late, in October, and its thick skin is very resistant — so it can stay on the vine after the others, serving dry wines as well as passiti and muffati, once noble rot takes hold."},"v":{"pt":"Nos blends com Chardonnay, fermenta junto ou separado, parte em barrica. A casca grossa dá mais fenóis que a média das brancas, o que explica o corpo e o leve amargor — e também permite longa permanência sobre as borras sem o vinho cansar.","it":"Nei blend con lo Chardonnay fermenta insieme o separato, in parte in barrique. La buccia spessa cede più fenoli della media dei bianchi, il che spiega corpo e lieve amaro — e permette anche una lunga permanenza sui lieviti senza stancare il vino.","en":"In blends with Chardonnay it ferments together or apart, partly in barrel. The thick skin gives more phenolics than most whites, which explains the body and faint bitterness — and also allows long lees ageing without tiring the wine."}},"trebbiano":{"n":"Trebbiano","a":["trebbiano"],"o":{"pt":"A branca mais plantada da Itália; no Abruzzo fica séria.","it":"La bianca più piantata d'Italia; in Abruzzo diventa seria.","en":"Italy's most planted white; in Abruzzo it turns serious."},"d":{"pt":"É a branca mais difundida da Itália e, por muito tempo, sinônimo de vinho simples de grande volume. Mas o Trebbiano d'Abruzzo é outra história: de vinhas velhas e baixo rendimento dá um branco salino, de amêndoa, erva e cítrico, com acidez viva e capacidade de envelhecer. Na mesa: «esqueça o Trebbiano de garrafão — no Abruzzo é um branco de guarda».","it":"È la bianca più diffusa d'Italia e, per molto tempo, sinonimo di vino semplice da grandi volumi. Ma il Trebbiano d'Abruzzo è un'altra storia: da vigne vecchie e basse rese dà un bianco sapido, di mandorla, erbe e agrumi, con acidità viva e capacità di invecchiare. A tavola: «dimentichi il Trebbiano da damigiana — in Abruzzo è un bianco da guardia».","en":"Italy's most widespread white and, for a long time, shorthand for simple bulk wine. But Trebbiano d'Abruzzo is another story: from old vines and low yields it gives a saline white of almond, herbs and citrus, with lively acidity and real ageing capacity. At the table: «forget jug Trebbiano — in Abruzzo it is a white for keeping»."},"t":"b","i":1,"q":[4,3,null],"c":{"pt":"Muito produtivo por natureza: a diferença entre o vinho banal e o sério está em cortar o rendimento pela metade e colher mais tarde. No Abruzzo, as vinhas velhas conduzidas em pergola abruzzese, alta e larga, protegem a uva do sol excessivo.","it":"Molto produttivo per natura: la differenza tra il vino banale e quello serio sta nel dimezzare le rese e vendemmiare più tardi. In Abruzzo le vigne vecchie allevate a pergola abruzzese, alta e larga, proteggono l'uva dal sole eccessivo.","en":"Naturally very productive: the difference between banal and serious wine lies in halving yields and picking later. In Abruzzo the old vines trained on the high, wide pergola abruzzese shield the fruit from excessive sun."},"v":{"pt":"Vinificação em branco, fermentação a temperatura controlada em aço, depois alguns meses sobre as borras finas e muitas vezes um período em vasilhas de cimento — que mantêm a temperatura estável sem ceder aroma. Os melhores engarrafam sem filtrar nem estabilizar à força.","it":"Vinificazione in bianco, fermentazione a temperatura controllata in acciaio, poi alcuni mesi sui lieviti fini e spesso un periodo in vasche di cemento — che tengono la temperatura stabile senza cedere aroma. I migliori imbottigliano senza chiarifiche né stabilizzazioni forzate.","en":"White vinification, temperature-controlled fermentation in steel, then some months on fine lees and often a spell in concrete tanks — which hold temperature steady without giving aroma. The best bottle it without fining or forced stabilisation."}},"fiano":{"n":"Fiano","a":["fiano"],"o":{"pt":"Campana antiga: avelã, mel e cera, com nervo mineral.","it":"Campana antica: nocciola, miele e cera, con nervo minerale.","en":"An ancient Campanian: hazelnut, honey and wax, with mineral nerve."},"d":{"pt":"Uva da Campânia cultivada desde a época romana — era possivelmente o «vitis apiana», a videira das abelhas, atraídas pelo açúcar das bagas. O Fiano di Avellino nasce em solos vulcânicos de altitude e dá avelã, pera, mel e cera, com acidez firme e grande capacidade de guarda. Na mesa: «é um branco do sul que não é quente nem mole — ganha corpo com os anos».","it":"Uva della Campania coltivata dall'epoca romana — era forse la «vitis apiana», la vite delle api, attirate dallo zucchero degli acini. Il Fiano di Avellino nasce su suoli vulcanici d'altura e dà nocciola, pera, miele e cera, con acidità saldissima e grande capacità di invecchiamento. A tavola: «è un bianco del sud che non è né caldo né molle — prende corpo con gli anni».","en":"A Campanian grape grown since Roman times — possibly the «vitis apiana», the bee vine, drawn by the sugar in its berries. Fiano di Avellino grows on high volcanic soils and gives hazelnut, pear, honey and wax, with firm acidity and real ageing potential. At the table: «a southern white that is neither hot nor soft — it gains body with age»."},"t":"b","i":1,"q":[4,4,null],"c":{"pt":"Cacho pequeno e produção baixa, em vinhas de altitude sobre solo vulcânico. Colhe-se em outubro, tarde para o sul da Itália, porque a altitude atrasa a maturação e preserva a acidez mesmo num clima quente.","it":"Grappolo piccolo e produzione bassa, in vigne d'altura su suolo vulcanico. Si vendemmia in ottobre, tardi per il sud Italia, perché l'altitudine ritarda la maturazione e conserva l'acidità anche in clima caldo.","en":"Small bunches and low yields, on high-altitude vineyards over volcanic soil. It is picked in October, late for southern Italy, because altitude delays ripening and preserves acidity even in a warm climate."},"v":{"pt":"Fermenta em aço a temperatura controlada e repousa sobre as borras finas por meses. Tende a fechar-se nos primeiros anos e abrir depois: é uma das poucas brancas do sul que melhora com cinco ou dez anos de garrafa, ganhando mel, avelã e cera.","it":"Fermenta in acciaio a temperatura controllata e riposa sui lieviti fini per mesi. Tende a chiudersi nei primi anni e ad aprirsi dopo: è tra le poche bianche del sud che migliorano con cinque o dieci anni di bottiglia, guadagnando miele, nocciola e cera.","en":"It ferments in steel under controlled temperature and rests on fine lees for months. It tends to close up in its first years and open later: one of the few southern whites that improves with five or ten years in bottle, gaining honey, hazelnut and wax."}},"catarratto":{"n":"Catarratto","a":["catarratto","lucido"],"o":{"pt":"A branca mais plantada da Sicília; cítrica e salina.","it":"La bianca più piantata della Sicilia; agrumata e sapida.","en":"Sicily's most planted white; citrusy and saline."},"d":{"pt":"A branca mais cultivada da Sicília, historicamente destinada ao Marsala e ao vinho de corte. A seleção melhor, chamada Lucido, dá hoje brancos secos e precisos: cítrico, flor de laranjeira, erva mediterrânea e uma salinidade clara, com acidez média-alta. Na mesa: «é a uva branca da Sicília — fresca, salina, feita para peixe».","it":"La bianca più coltivata della Sicilia, storicamente destinata al Marsala e al vino da taglio. La selezione migliore, detta Lucido, dà oggi bianchi secchi e precisi: agrumi, zagara, erbe mediterranee e una sapidità netta, con acidità medio-alta. A tavola: «è l'uva bianca della Sicilia — fresca, sapida, fatta per il pesce».","en":"Sicily's most planted white, historically destined for Marsala and blending wine. Its better selection, called Lucido, now gives dry, precise whites: citrus, orange blossom, Mediterranean herbs and a clear salinity, with medium-high acidity. At the table: «Sicily's white grape — fresh, saline, made for fish»."},"t":"b","i":1,"q":[3,3,null],"c":{"pt":"Resiste bem ao calor e à seca, mas produz muito: sem desbaste, o vinho fica diluído. Colhe-se de madrugada, quando a uva ainda está fria, prática normal na Sicília para evitar que o calor comece a fermentação antes da adega.","it":"Resiste bene al caldo e alla siccità, ma produce molto: senza diradamento il vino risulta diluito. Si vendemmia all'alba, con l'uva ancora fredda, pratica normale in Sicilia per evitare che il caldo avvii la fermentazione prima della cantina.","en":"It stands heat and drought well but crops heavily: without thinning, the wine comes out diluted. Picking is at dawn, with the fruit still cold — standard practice in Sicily to stop the heat starting fermentation before the cellar."},"v":{"pt":"Prensagem suave e fermentação a frio em aço, muitas vezes com uma maceração curta antes, para extrair os aromas cítricos da casca. Alguns produtores deixam parte sobre as borras para dar corpo; a madeira é rara, porque cobriria a salinidade.","it":"Pressatura soffice e fermentazione a freddo in acciaio, spesso con una breve macerazione prima, per estrarre gli aromi agrumati dalla buccia. Alcuni lasciano una parte sui lieviti per dare corpo; il legno è raro, perché coprirebbe la sapidità.","en":"Gentle pressing and cold fermentation in steel, often after a short maceration to draw citrus aromas from the skins. Some producers leave part on the lees for body; oak is rare, as it would cover the salinity."}},"carricante":{"n":"Carricante","a":["carricante"],"o":{"pt":"A uva do Etna: acidez de limão e lava, pura tensão.","it":"L'uva dell'Etna: acidità di limone e lava, pura tensione.","en":"Etna's grape: lemon acidity and lava, pure tension."},"d":{"pt":"Cresce nas encostas do Etna, até mais de 900 metros, em solo de areia vulcânica. O nome vem de «carricare», carregar: a videira produz muito. Dá um branco de acidez cortante — às vezes maior que a de um Riesling — com limão, maçã verde, cinza e sal; com os anos ganha nota de pedra e mel. Na mesa: «é vinho de vulcão: o que se sente de mineral vem da lava mesmo».","it":"Cresce sulle pendici dell'Etna, fino a oltre 900 metri, su sabbia vulcanica. Il nome viene da «carricare», caricare: la vite produce molto. Dà un bianco di acidità tagliente — a volte superiore a quella di un Riesling — con limone, mela verde, cenere e sale; con gli anni prende pietra e miele. A tavola: «è vino di vulcano: quel minerale viene davvero dalla lava».","en":"It grows on the slopes of Etna, up to over 900 metres, on volcanic sand. The name comes from «carricare», to load: the vine is productive. It gives a white of cutting acidity — sometimes beyond a Riesling's — with lemon, green apple, ash and salt; with age, stone and honey. At the table: «volcano wine: that mineral edge really does come from lava»."},"t":"b","i":1,"q":[5,3,null],"c":{"pt":"Colhe-se tarde, em outubro — às vezes em novembro, nas vinhas mais altas do Etna, a mais de 900 metros. A vindima é toda à mão, em terraços de pedra de lava onde não entra máquina, e cada altitude amadurece numa semana diferente.","it":"Si vendemmia tardi, in ottobre — a volte a novembre, nelle vigne più alte dell'Etna, oltre i 900 metri. La vendemmia è tutta a mano, su terrazze di pietra lavica dove non entra alcuna macchina, e ogni altitudine matura in una settimana diversa.","en":"It is picked late, in October — sometimes November on the highest Etna vineyards, above 900 metres. Picking is entirely by hand, on lava-stone terraces no machine can reach, and each altitude ripens in a different week."},"v":{"pt":"A acidez málica é tão alta que a malolática aqui é quase necessária: é ela que torna o vinho bebível, trocando o ácido duro por um mais macio. Fermentação em aço ou em tonel grande, e repouso sobre as borras. A mineralidade vem do solo de areia vulcânica, pobre em matéria orgânica.","it":"L'acidità malica è così alta che qui la malolattica è quasi necessaria: è lei a rendere il vino bevibile, scambiando l'acido duro con uno più morbido. Fermentazione in acciaio o in botte grande, e riposo sui lieviti. La mineralità viene dalla sabbia vulcanica, povera di sostanza organica.","en":"Malic acidity is so high that malolactic is almost necessary here: it is what makes the wine drinkable, trading hard acid for a softer one. Fermentation in steel or large cask, then lees ageing. The minerality comes from the volcanic sand, poor in organic matter."}},"grillo":{"n":"Grillo","a":["grillo"],"o":{"pt":"Siciliana de corpo e sal: cítrico, erva e final longo.","it":"Siciliana di corpo e sale: agrumi, erbe e finale lungo.","en":"A Sicilian of body and salt: citrus, herbs and a long finish."},"d":{"pt":"Cruzamento siciliano do século XIX entre Catarratto e Zibibbo, criado para o Marsala e hoje a branca de maior prestígio da ilha. Resiste ao calor sem perder acidez e dá cítrico, erva-doce, pêssego e uma salinidade firme, com corpo médio a cheio — aguanta madeira e cimento sem se perder. Na mesa: «é o branco siciliano com corpo; não é só fresco, tem estrutura».","it":"Incrocio siciliano dell'Ottocento tra Catarratto e Zibibbo, nato per il Marsala e oggi la bianca più prestigiosa dell'isola. Resiste al caldo senza perdere acidità e dà agrumi, finocchietto, pesca e una sapidità saldissima, con corpo medio-pieno — regge legno e cemento senza perdersi. A tavola: «è il bianco siciliano con corpo; non è solo fresco, ha struttura».","en":"A 19th-century Sicilian crossing of Catarratto and Zibibbo, created for Marsala and today the island's most prestigious white. It resists heat without losing acidity, giving citrus, wild fennel, peach and a firm salinity, with medium to full body — it takes oak and concrete without losing itself. At the table: «the Sicilian white with body; not just fresh, it has structure»."},"t":"b","i":1,"q":[4,4,null],"c":{"pt":"Colhe-se cedo, no fim de agosto, para não perder acidez no calor de Noto. As vinhas melhores são conduzidas em alberello — a videira baixa, em forma de arbusto, sem arame — que protege os cachos do sol com as próprias folhas.","it":"Si vendemmia presto, a fine agosto, per non perdere acidità nel caldo di Noto. Le vigne migliori sono allevate ad alberello — la vite bassa, a cespuglio, senza filo — che protegge i grappoli dal sole con le proprie foglie.","en":"It is picked early, at the end of August, so as not to lose acidity in the heat of Noto. The best vineyards are bush-trained as alberello — low, shrub-shaped, wireless vines — whose own leaves shade the bunches."},"v":{"pt":"Aguenta o que a maioria das brancas do sul não aguenta: fermentação parcial em barrica e em ovos de cimento, e meses de repouso sobre as borras. O cimento dá textura sem aroma de madeira; a barrica dá corpo. É por isso que o Grillo faz brancos de guarda, e não só de verão.","it":"Regge ciò che la maggior parte dei bianchi del sud non regge: fermentazione parziale in barrique e in uova di cemento, e mesi sui lieviti. Il cemento dà texture senza profumo di legno; la barrique dà corpo. Per questo il Grillo fa bianchi da guardia, non solo d'estate.","en":"It withstands what most southern whites cannot: partial fermentation in barrel and in concrete eggs, and months on the lees. Concrete gives texture without oak aroma; the barrel gives body. This is why Grillo makes whites for keeping, not just for summer."}},"vermentino":{"n":"Vermentino","a":["vermentino"],"o":{"pt":"O branco do mar: cítrico, amêndoa amarga e sal.","it":"Il bianco del mare: agrumi, mandorla amara e sale.","en":"The wine of the sea: citrus, bitter almond and salt."},"d":{"pt":"Plantado em toda a costa do Tirreno — Sardenha, Ligúria, Toscana e, na Provença, com o nome de Rolle. A Gallura, no norte da Sardenha, é a única DOCG da ilha e o lugar onde ele fica mais sério. Dá cítrico, pêssego, erva mediterrânea, um amargor de amêndoa no final e sal; acidez média-alta. Na mesa: «é a uva que sabe a mar — cresce com vento salgado em cima».","it":"Piantato su tutta la costa tirrenica — Sardegna, Liguria, Toscana e, in Provenza, col nome di Rolle. La Gallura, nel nord della Sardegna, è l'unica DOCG dell'isola e il luogo in cui diventa più serio. Dà agrumi, pesca, erbe mediterranee, un amaro di mandorla nel finale e sale; acidità medio-alta. A tavola: «è l'uva che sa di mare — cresce con il vento salato addosso».","en":"Planted all along the Tyrrhenian coast — Sardinia, Liguria, Tuscany and, in Provence, under the name Rolle. Gallura, in northern Sardinia, is the island's only DOCG and where it turns most serious. Citrus, peach, Mediterranean herbs, a bitter-almond finish and salt; medium-high acidity. At the table: «the grape that tastes of the sea — it grows with salt wind on it»."},"t":"b","i":1,"q":[4,3,null],"c":{"pt":"Amadurece tarde, no fim de setembro, e gosta de vento: na Gallura as vinhas ficam sobre granito decomposto, varridas pelo mistral, o que seca a uva e evita doenças. Colhe-se de madrugada para manter a frescura.","it":"Matura tardi, a fine settembre, e ama il vento: in Gallura le vigne stanno su granito disfatto, spazzate dal maestrale, che asciuga l'uva ed evita le malattie. Si vendemmia all'alba per mantenere la freschezza.","en":"It ripens late, at the end of September, and likes wind: in Gallura the vines sit on decomposed granite, swept by the mistral, which dries the fruit and keeps disease away. Picking is at dawn to hold the freshness."},"v":{"pt":"Prensagem suave e fermentação a frio em aço na maioria dos casos. Às vezes uma maceração curta a frio, que reforça o amargor de amêndoa típico do final. As versões mais ambiciosas ficam sobre as borras e às vezes passam por madeira ou cimento, ganhando corpo sem perder o sal.","it":"Pressatura soffice e fermentazione a freddo in acciaio nella maggior parte dei casi. A volte una breve macerazione a freddo, che rinforza l'amaro di mandorla tipico del finale. Le versioni più ambiziose restano sui lieviti e talvolta passano in legno o cemento, prendendo corpo senza perdere sapidità.","en":"Gentle pressing and cold fermentation in steel in most cases. Sometimes a short cold maceration, which reinforces the typical bitter-almond finish. The more ambitious versions stay on the lees and sometimes see wood or concrete, gaining body without losing salinity."}},"rolle":{"n":"Rolle","a":["rolle"],"o":{"pt":"É o Vermentino com o nome que usa na Provença.","it":"È il Vermentino col nome che porta in Provenza.","en":"It is Vermentino under its Provençal name."},"d":{"pt":"Rolle e Vermentino são a mesma uva: é assim que a chamam na Provença e no sul da França. Nos rosés de Côtes de Provence entra em pequena parte para dar cítrico, flor e salinidade, levantando o Grenache e o Cinsault. Na mesa: «Rolle é só o nome francês do Vermentino — a mesma uva da Sardenha».","it":"Rolle e Vermentino sono la stessa uva: è così che la chiamano in Provenza e nel sud della Francia. Nei rosé di Côtes de Provence entra in piccola parte per dare agrumi, fiori e sapidità, alleggerendo Grenache e Cinsault. A tavola: «Rolle è solo il nome francese del Vermentino — la stessa uva della Sardegna».","en":"Rolle and Vermentino are the same grape: that is what it is called in Provence and the French south. In Côtes de Provence rosés it plays a small part, lending citrus, blossom and salinity that lift Grenache and Cinsault. At the table: «Rolle is simply the French name for Vermentino — the Sardinian grape»."},"t":"b","i":0,"q":[4,3,null],"c":{"pt":"Nos rosés da Provença é colhida cedo, de madrugada, com a uva fria — o calor da tarde bastaria para começar a oxidar o mosto e escurecer a cor, que ali é o cartão de visita do vinho.","it":"Nei rosé di Provenza si vendemmia presto, all'alba, con l'uva fredda — il caldo del pomeriggio basterebbe a ossidare il mosto e scurire il colore, che lì è il biglietto da visita del vino.","en":"For Provençal rosés it is picked early, at dawn, with the fruit cold — the afternoon heat alone would start oxidising the must and darken the colour, which there is the wine's calling card."},"v":{"pt":"Entra prensada direto em branco e fermentada a frio, junto com as tintas já prensadas. O papel dela é dar acidez cítrica e sal ao conjunto, equilibrando a fruta doce do Grenache.","it":"Entra pressata direttamente in bianco e fermentata a freddo, insieme alle rosse già pressate. Il suo ruolo è dare acidità agrumata e sapidità all'insieme, bilanciando la frutta dolce del Grenache.","en":"It goes in pressed straight as a white and cold-fermented, together with the already-pressed red grapes. Its role is to lend citrus acidity and salinity to the blend, balancing Grenache's sweet fruit."}},"moscatobianco":{"n":"Moscato Bianco","a":["moscato bianco","moscato"],"o":{"pt":"Uva de bago doce e perfume de flor: sálvia, rosa, uva fresca.","it":"Uva dall'acino dolce e profumo floreale: salvia, rosa, uva fresca.","en":"A sweet-berried grape with a floral nose: sage, rose, fresh grape."},"d":{"pt":"Uma das uvas mais antigas que se conhece, cultivada no Mediterrâneo desde a Antiguidade. No Piemonte faz o Moscato d'Asti: pouco álcool (cerca de 5%), açúcar natural e espuma leve, porque a fermentação é interrompida no frio antes de terminar. Aroma de flor de laranjeira, sálvia, pêssego e uva fresca. Na mesa: «é doce mas leve — e é o único vinho da carta com metade do álcool dos outros».","it":"Una delle uve più antiche conosciute, coltivata nel Mediterraneo dall'antichità. In Piemonte firma il Moscato d'Asti: poco alcol (circa 5%), zucchero naturale e spuma leggera, perché la fermentazione viene fermata a freddo prima di concludersi. Profumo di zagara, salvia, pesca e uva fresca. A tavola: «è dolce ma leggero — ed è il solo vino della carta con metà dell'alcol degli altri».","en":"One of the oldest grapes known, grown around the Mediterranean since antiquity. In Piedmont it signs Moscato d'Asti: low alcohol (about 5%), natural sugar and a light sparkle, because fermentation is stopped cold before it finishes. Orange blossom, sage, peach and fresh grape. At the table: «sweet but light — and the only wine on the list with half the alcohol of the others»."},"t":"b","i":1,"q":[4,2,null],"c":{"pt":"Colhe-se cedo, no fim de agosto, com açúcar suficiente e acidez ainda intacta. O cacho é frágil e a uva é doce de comer — é uma das poucas castas de vinho que também se vende como uva de mesa.","it":"Si vendemmia presto, a fine agosto, con zucchero sufficiente e acidità ancora intatta. Il grappolo è fragile e l'uva è dolce da mangiare — è tra le poche varietà da vino che si vendono anche da tavola.","en":"It is picked early, at the end of August, with enough sugar and acidity still intact. The bunch is fragile and the fruit is sweet to eat — one of the few wine varieties also sold as table grapes."},"v":{"pt":"O mosto é guardado a frio, quase congelado, e fermentado aos poucos durante o ano, à medida que se engarrafa. A fermentação acontece num tanque fechado e é interrompida pelo frio quando o álcool chega a cerca de 5%: o gás que ficou preso dá a espuma, e o açúcar que não fermentou dá o doce.","it":"Il mosto si conserva a freddo, quasi congelato, e si fermenta un po' alla volta durante l'anno, man mano che si imbottiglia. La fermentazione avviene in autoclave e viene fermata col freddo quando l'alcol arriva al 5% circa: il gas rimasto dà la spuma, e lo zucchero non fermentato dà il dolce.","en":"The must is kept cold, almost frozen, and fermented in batches through the year as bottling demands. Fermentation takes place in a sealed tank and is stopped with cold once alcohol reaches about 5%: the trapped gas gives the sparkle, the unfermented sugar the sweetness."}},"zibibbo":{"n":"Zibibbo","a":["zibibbo","moscato d'alessandria"],"o":{"pt":"O Moscatel de Alexandria de Pantelleria, uva de passito.","it":"Il Moscato d'Alessandria di Pantelleria, uva da passito.","en":"Pantelleria's Muscat of Alexandria, a passito grape."},"d":{"pt":"É o Moscatel de Alexandria, trazido do Egito e conhecido na Sicília pelo nome árabe «zibibb», uva seca. Em Pantelleria cresca em alberello, baixo e protegido do vento, prática reconhecida pela UNESCO. Parte da uva é secada ao sol e volta ao mosto: daí vêm o damasco seco, o figo, o mel e a casca de laranja do Passito. Na mesa: «metade da uva vai ao sol antes de entrar no vinho — é dali que vem o doce, não do açúcar adicionado».","it":"È il Moscato d'Alessandria, arrivato dall'Egitto e noto in Sicilia col nome arabo «zibibb», uva passa. A Pantelleria cresce ad alberello, basso e protetto dal vento, pratica riconosciuta dall'UNESCO. Parte dell'uva viene appassita al sole e rientra nel mosto: da lì l'albicocca secca, il fico, il miele e la scorza d'arancia del Passito. A tavola: «metà dell'uva va al sole prima di entrare nel vino — il dolce viene da lì, non da zucchero aggiunto».","en":"It is Muscat of Alexandria, brought from Egypt and known in Sicily by the Arabic «zibibb», dried grape. On Pantelleria it grows as a low bush vine sheltered from the wind, a practice recognised by UNESCO. Part of the crop is sun-dried and returned to the must: hence the dried apricot, fig, honey and orange peel of the Passito. At the table: «half the fruit is sun-dried before it enters the wine — that is where the sweetness comes from, not added sugar»."},"t":"b","i":1,"q":[3,5,null],"c":{"pt":"Colhida em duas etapas. A primeira, em agosto, vai para secar ao sol sobre esteiras por duas a três semanas, até virar passa. A segunda, em setembro, é vinificada fresca. As videiras crescem em alberello pantesco, dentro de covas cavadas no chão para fugir do vento — prática reconhecida pela UNESCO.","it":"Vendemmiata in due tempi. La prima, in agosto, va ad appassire al sole su stenditoi per due o tre settimane, fino a diventare uva passa. La seconda, a settembre, si vinifica fresca. Le viti crescono ad alberello pantesco, in conche scavate nel terreno per ripararsi dal vento — pratica riconosciuta dall'UNESCO.","en":"Picked in two stages. The first, in August, is laid out to dry in the sun for two or three weeks, until it becomes raisin. The second, in September, is vinified fresh. The vines grow as alberello pantesco, in hollows dug into the ground to escape the wind — a practice recognised by UNESCO."},"v":{"pt":"A uva fresca fermenta primeiro; depois a uva seca é mergulhada no vinho em fermentação, aos poucos, e cede açúcar e aroma durante semanas. Mexe-se à mão. É um processo lento e inteiramente natural: não entra açúcar nem álcool de fora.","it":"L'uva fresca fermenta per prima; poi l'uva appassita viene immersa nel vino in fermentazione, poco alla volta, e cede zucchero e aroma per settimane. Si rimon
