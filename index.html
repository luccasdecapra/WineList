 hence century-old ungrafted vines on their own roots, a rarity in the wine world."},"v":{"pt":"A uva tem tanino e acidez de sobra, e rendimento alto se não for controlado: a qualidade depende de podar curto. Maceração média a longa e envelhecimento em madeira, muitas vezes tonneaux de 500 litros, seguido de meses em cimento — que estabiliza sem acrescentar aroma.","it":"L'uva ha tannino e acidità in abbondanza, e rese alte se non controllate: la qualità dipende dalla potatura corta. Macerazione media o lunga e affinamento in legno, spesso tonneaux da 500 litri, seguito da mesi in cemento — che stabilizza senza aggiungere aroma.","en":"The grape has tannin and acidity to spare, and high yields if unchecked: quality depends on short pruning. Medium to long maceration and wood ageing, often in 500-litre tonneaux, followed by months in concrete — which stabilises without adding aroma."}}};

const SUGT={
 corpo:{pt:"Vinho de grande corpo e concentração. Pede um prato de peso equivalente — se o prato for leve, o vinho o atropela. Tanino macio, então não precisa de carne dura: pede carne saborosa.",
  it:"Vino di grande corpo e concentrazione. Chiede un piatto di peso equivalente — se il piatto è leggero, il vino lo travolge. Tannino morbido, quindi non serve carne dura: serve carne saporita.",
  en:"A wine of great body and concentration. It needs a dish of matching weight — a light dish would simply be run over. The tannins are soft, so it doesn't call for tough meat, but for flavourful meat.",
  de:"Ein Wein von großem Körper und hoher Konzentration. Er verlangt ein Gericht von gleichem Gewicht — ein leichtes Gericht würde überrollt. Die Tannine sind weich: es braucht kein zähes, sondern geschmacksintensives Fleisch.",
  ar:"نبيذ ذو قوام كبير وتركيز عالٍ. يتطلّب طبقًا بالوزن نفسه — فالطبق الخفيف يضيع أمامه. تانيناته ناعمة، لذا لا يحتاج لحمًا قاسيًا بل لحمًا غنيّ النكهة.",
  zh:"酒体庞大、风味浓缩。需要一道分量相当的菜——清淡的菜会被完全压过。单宁柔顺，因此不必是耐嚼的肉，而应是风味浓郁的肉。",
  es:"Vino de gran cuerpo y concentración. Pide un plato de peso equivalente: uno ligero quedaría arrollado. El tanino es suave, así que no pide carne dura, sino carne sabrosa.",
  fr:"Vin de grand corps et de forte concentration. Il exige un plat d'un poids équivalent — un plat léger serait écrasé. Les tanins sont souples : il ne demande pas une viande dure, mais une viande savoureuse.",
  ja:"豊かなボディと凝縮感を備えたワイン。同じだけの重みを持つ料理が必要で、軽い皿では押し切られてしまいます。タンニンはやわらかいので、硬い肉ではなく味の濃い肉を。",
  ru:"Вино большого тела и высокой концентрации. Ему нужно блюдо сопоставимого веса — лёгкое просто будет смято. Танины мягкие, поэтому нужна не жёсткая, а насыщенная по вкусу мясная подача."},
 tanico:{pt:"Os taninos firmes encontram a gordura da carne: a gordura amacia o tanino, e o tanino limpa o paladar para a próxima garfada. É a harmonização mais clássica que existe.",

  en:"The firm tannins meet the fat of the meat: the fat softens the tannin, and the tannin cleans the palate for the next bite. It's the most classic pairing there is.",
  de:"Die festen Tannine treffen auf das Fett des Fleisches: das Fett mildert das Tannin, das Tannin reinigt den Gaumen für den nächsten Bissen. Die klassischste Kombination überhaupt.",
  ar:"تلتقي التانينات القوية بدهن اللحم: الدهن يليّن التانين، والتانين ينظّف الحنك للقضمة التالية. إنه أشهر تناغم في عالم النبيذ.",
  zh:"强劲的单宁遇上肉类的油脂：油脂柔化单宁，单宁又为下一口清洁味蕾。这是最经典的搭配。",

  ja:"しっかりしたタンニンが肉の脂と出会います。脂がタンニンをやわらげ、タンニンが次の一口へと口中をリセットする。最も古典的な組み合わせです。",
  ru:"Плотные танины встречаются с жиром мяса: жир смягчает танин, а танин очищает вкус перед следующим куском. Самое классическое сочетание из существующих."},
 acidez:{pt:"A acidez viva do vinho acompanha a acidez do tomate no molho. Sem ela, o vinho pareceria mole ao lado do prato.",

  de:"Die lebendige Säure des Weins begleitet die Säure der Tomate in der Sauce. Ohne sie wirkte der Wein neben dem Gericht flach.",
  ar:"حموضة النبيذ النابضة توازي حموضة الطماطم في الصلصة. من دونها يبدو النبيذ باهتًا إلى جانب الطبق.",

 peixe:{pt:"A acidez faz no prato o que o limão faria: refresca, corta a gordura e realça o sabor do peixe. Vinho leve o bastante para não cobrir o ingrediente.",
  it:"L'acidità fa nel piatto ciò che farebbe il limone: rinfresca, taglia il grasso ed esalta il sapore del pesce. Vino abbastanza leggero da non coprire l'ingrediente.",
  en:"The acidity does what a squeeze of lemon would: it refreshes, cuts the fat and lifts the flavour of the fish. Light enough not to cover the ingredient.",
  de:"Die Säure wirkt wie ein Spritzer Zitrone: sie erfrischt, schneidet das Fett und hebt den Geschmack des Fisches. Leicht genug, um die Zutat nicht zu überdecken.",

  zh:"酸度在菜肴中的作用如同挤上一瓣柠檬：清爽解腻，提升鱼的鲜味。酒体足够轻盈，不会掩盖食材本味。",
  es:"La acidez hace en el plato lo que haría el limón: refresca, corta la grasa y realza el sabor del pescado. Un vino lo bastante ligero para no tapar el ingrediente.",

  ru:"Кислотность делает то же, что долька лимона: освежает, режет жир и подчёркивает вкус рыбы. Вино достаточно лёгкое, чтобы не перекрыть продукт."},
 cremoso:{pt:"A textura cremosa do vinho espelha a manteiga do prato. Peso parecido dos dois lados — nenhum abafa o outro.",

  de:"Die cremige Textur des Weins spiegelt die Butter des Gerichts. Ähnliches Gewicht auf beiden Seiten — keines erdrückt das andere.",
  ar:"يعكس قوام النبيذ الكريمي زبدة الطبق. وزن متقارب من الجانبين، فلا يطغى أحدهما على الآخر.",
  zh:"酒的绵密质地呼应菜肴中的黄油。两边分量相当，谁也不会盖过谁。",

 bolha:{pt:"A borbulha e a acidez limpam a gordura entre uma garfada e outra. Por isso espumante funciona do começo ao fim da refeição.",

  de:"Perlage und Säure tragen das Fett zwischen den Bissen ab. Deshalb funktioniert Schaumwein vom Anfang bis zum Ende des Menüs.",
  ar:"تنظّف الفقاعات والحموضة الدهن بين قضمة وأخرى. لذلك يصلح النبيذ الفوار من بداية الوجبة حتى نهايتها.",

 doce:{pt:"A regra de ouro: o vinho precisa ser mais doce que a sobremesa. Se o doce vencer, o vinho parece azedo.",

 tartufo:{pt:"Aromas terciários — terra, cogumelo, especiaria — encontram o perfume do tartufo. Duas coisas complexas que se somam em vez de brigar.",

function ML(){return MODEL[lang]||MODEL.en;}
function sugFor(w){var p=w.perfil,corpo=p[0][2],doce=p[1][2],acid=p[2][2],q=p[3][2],ar=p[4][2],c=w.cat;
 if(c==='Dolce')return{k:'doce',d:'Doces'};
 if(c==='Spumante'||c==='Champagne')return{k:'bolha',d:(w.tipos.indexOf('Polvo')>=0?'Polvo':'Saladas')};
 if(c==='Rosato')return{k:'rosato',d:'Saladas'};
 if(c==='Rosso'){
  var neb=/nebbiolo/i.test(w.gr||'');
  if(neb&&w.tipos.indexOf('Tartufo')>=0&&ar>=5&&q>=4)return{k:'tartufo',d:'Tartufo'};
  if(q>=5)return{k:'tanico',d:'Carne vermelha'};
  if(corpo>=5)return{k:'corpo',d:'Carne vermelha'};
  if(acid>=5&&corpo<=4)return{k:'acidez',d:'Massas'};
  if(acid>=4&&corpo<=3&&w.tipos.indexOf('Massas')>=0)return{k:'acidez',d:'Massas'};
  return{k:'leve',d:'Frango'};}
 if(q>=4)return{k:'cremoso',d:(w.tipos.indexOf('Lagosta')>=0?'Lagosta':'Arroz')};
 return{k:'peixe',d:(w.tipos.indexOf('Peixe')>=0?'Peixe':'Saladas')};}
function openSug(){var w=WINES[curIdx],s=sugFor(w),L2=SUGL[lang]||SUGL.en,bd=bestDish(w);
 var el=document.getElementById('sugmodal');
 el.innerHTML='<div class="sugbox"><div class="sughead">'+L2.t+'</div>'
  +'<div class="sugdish">'+(bd?bd.nm:tipT(s.d))+'</div>'+(bd?'<div class="sugsub">'+(bd.ds[lang]||bd.ds.en)+' · €'+bd.pz+'</div>':'')
  +'<div class="suglbl">'+L2.w+'</div><p class="sugwhy">'+(SUGT[s.k][lang]||SUGT[s.k].en)+'</p>'
  +'<button class="sugclose">'+L2.c+'</button></div>';
 el.hidden=false;
 el.querySelector('.sugclose').onclick=function(){el.hidden=true;};
 el.onclick=function(e){if(e.target===el)el.hidden=true;};}
function perfHelp(){return PHELP[lang].map(function(g){return '<div class="gr"><span class="t">'+g[0]+'</span><b>'+g[1]+'</b> — '+g[2]+'. <b>'+g[3]+'</b> — '+g[4]+'.</div>';}).join('');}
function togglePerfInfo(e){e.stopPropagation();var el=document.getElementById('perfhelp');if(el)el.hidden=!el.hidden;}
function gauge(b){var v=b[2],pos=6+((v-1)/5)*88,st=v<=2?"L":(v>=5?"R":"M");var lc=st==="L"?"p on":"p off",rc=st==="R"?"p r on":"p r off";return `<div class="axis"><div class="axhead"><span class="${lc}">${poleT(b[0])}</span><span class="${rc}">${poleT(b[1])}</span></div><div class="track"><div class="fill" style="width:${pos}%"></div><div class="knob" style="left:${pos}%"></div></div></div>`;}function bars(p){return p.map(gauge).join('');}
function grapes(g){return g.split(/\s*\u00b7\s*/).map(function(x){var ks=uvaKeys(x);if(ks.length===1)return '<span class="grape gk" onclick="openUva(\''+ks[0]+'\',event)">'+x+'</span>';return '<span class="grape">'+x+'</span>';}).join('');}
function tipos(t){return ALLT.map(x=>`<span class="tipo${t.includes(x)?' on':''}">${tipT(x)}</span>`).join('');}
const detail=document.getElementById('detail'),dwrap=document.getElementById('dwrap');let curIdx=0;
function openDetail(i,keep){curIdx=i;const w=WINES[i];detail.style.setProperty('--accent','var(--c-'+w.cat+')');detail.style.setProperty('--ink','var(--i-'+w.cat+')');detail.style.setProperty('--solid','var(--s-'+w.cat+')');detail.style.setProperty('--g',w.col);
 dwrap.innerHTML=`<div class="hero" style="--g:${w.col}"><img src="${w.img}" onerror="this.style.display='none'"></div>
  <div style="text-align:center"><span class="dtag">${catT(w.cat)}</span></div>
  <div class="dhead"><div><div class="dname">${w.nm}</div><div class="dprod">${w.pr}</div><div class="dmeta">${w.reg}</div></div><div class="dprice">${w.pz||''}</div></div>
  ${w.gr?`<div class="sec"><div class="lbl">${L().comp}</div><div class="grapes">${grapes(w.gr)}</div></div>`:''}
  ${w.gr&&uvaKeys(w.gr).length?`<div class="sec"><div class="lbl">${UL().t}</div><div class="uvas">${uvaRows(w.gr)}</div><div class="alghint">${UL().h}</div></div>`:''}
  ${w.fmt?`<div class="sec"><div class="lbl">${FMTL[lang]||FMTL.en}</div><div class="fmts">${w.fmt.map(f=>`<div class="fmtrow"><span>${f.n}</span><b>${f.p}</b></div>`).join('')}</div></div>`:''}
  <div class="sec"><div class="lbl">${L().perf} <span class="pinfo" onclick="togglePerfInfo(event)">?</span></div><div class="perfil">${bars(w.perfil)}</div><div class="perfhelp" id="perfhelp" hidden>${perfHelp()}</div></div>
  ${TX(w.hist)?`<div class="sec"><div class="lbl">${L().hist}</div><p${FB(w.hist)}>${TX(w.hist)}</p></div>`:''}
  ${TX(w.arom)?`<div class="sec"><div class="lbl">${L().arom}</div><p${FB(w.arom)}>${TX(w.arom)}</p></div>`:''}
  <div class="sec"><div class="lbl">${L().harm}</div><div class="tipos">${tipos(w.tipos)}</div></div>
  <div class="sugbtn" onclick="openSug()"><span class="sk">${(SUGL[lang]||SUGL.en).t}</span><span class="sar">›</span></div><div class="sec"><div class="serv"><div class="servbox"><div class="k">${L().dec}</div><div class="v">${decT(w.decant)}</div></div>
    <div class="servbox"><div class="k">${L().temp}</div><div class="v">${w.temp}</div></div></div><div class="decnote"><span class="declbl">${w.decant.startsWith("Sim")?DECLBL[lang].y:DECLBL[lang].n}</span>${TX(w.decwhy)}</div></div>
  ${TX(w.scr)?`<div class="frase"${FB(w.scr)}>“${TX(w.scr)}”</div>`:''}`;
 if(!keep){detail.scrollTop=0;detail.classList.add('show');history.pushState({d:1},'');}}
var curDish=0;
function openDish(i,keep){curDish=i;var p=DISHES[i];
 detail.style.setProperty('--accent','var(--c-Champagne)');detail.style.setProperty('--ink','var(--i-Champagne)');
 detail.style.setProperty('--solid','var(--s-Champagne)');
 var ws=bestWines(p,4);
 dwrap.innerHTML='<div style="text-align:center;margin-top:22px"><span class="dtag">'+p.cat+'</span></div>'
  +'<div class="dhead"><div><div class="dname">'+glosMark(p.nm)+'</div></div><div class="dprice">€'+p.pz+'</div></div>'
  +'<div class="sec"><p'+(p.ds[lang]?'':' dir="ltr" class="fbtxt"')+'>'+glosMark(p.ds[lang]||p.ds.en)+'</p></div>'
  +(p.al?'<div class="sec"><div class="lbl">'+ML().alerg+'</div><div class="algchips">'+algList(p.al).map(function(n){return '<span class="algchip" onclick="openAlg('+i+',\''+n+'\')">'+n+'</span>';}).join('')+'</div><div class="alghint">'+((ALGL[lang]||ALGL.en).h)+'</div></div>':'')
  +'<div class="sec"><div class="lbl">'+ML().wines+'</div>'
  + ws.map(function(w){return '<div class="wsug" onclick="openDetail('+WINES.indexOf(w)+')">'
      +'<span class="wtag" style="background:var(--s-'+w.cat+')">'+catT(w.cat)+'</span>'
      +'<div class="wsn">'+w.nm+'</div><div class="wsp">'+w.pr+'</div>'
      +'<div class="wspz">'+(w.pz||'')+'</div></div>';}).join('')
  +'</div>';
 if(!keep){detail.scrollTop=0;detail.classList.add('show');history.pushState({d:1},'');}}
function closeDetail(){detail.classList.remove('show');}
document.getElementById('dback').onclick=()=>{if(history.state&&history.state.d)history.back();else closeDetail();};
window.addEventListener('popstate',()=>{if(detail.classList.contains('show'))closeDetail();});
document.addEventListener('keydown',e=>{var um=document.getElementById('uvamodal');if(e.key==='Escape'&&um&&!um.hidden){um.hidden=true;return;}var gm=document.getElementById('glosmodal');if(e.key==='Escape'&&gm&&!gm.hidden){gm.hidden=true;return;}var am=document.getElementById('algmodal');if(e.key==='Escape'&&am&&!am.hidden){am.hidden=true;return;}var sm=document.getElementById('sugmodal');if(e.key==='Escape'&&sm&&!sm.hidden){sm.hidden=true;return;}if(e.key==='Escape'&&detail.classList.contains('show'))history.back();});
document.documentElement.lang=lang;document.documentElement.dir=RTL.indexOf(lang)>=0?'rtl':'ltr';applyStatic();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script></body></html>
