 corpo:{pt:"Vinho de grande corpo e concentração. Pede um prato de peso equivalente — se o prato for leve, o vinho o atropela. Tanino macio, então não precisa de carne dura: pede carne saborosa.",

function ML(){return MODEL[lang]||MODEL.en;}
function sugFor(w){var p=w.perfil,corpo=p[0][2],doce=p[1][2],acid=p[2][2],q=p[3][2],ar=p[4][2],c=w.cat;
 if(c==='Dolce')return{k:'doce',d:'Doces'};
 if(c==='Spumante'||c==='Champagne')return{k:'bolha',d:(w.tipos.indexOf('Polvo')>=0?'Polvo':'Saladas')};
 if(c==='Rosato')return{k:'rosato',d:'Saladas'};
 if(c==='Rosso'){
  var neb=/nebbiolo/i.test(w.gr||'');
  if(neb&&w.tipos.indexOf('Tartufo')>=0&&ar>=5&&q>=4)return{k:'tartufo',d:'Tartufo'};
  if(q>=5)return{k:'tanico',d:'Carne vermelha'};
  if(corpo>=5)return{k:'corpo',d:'Carne vermelha'};
  if(acid>=5&&corpo<=4)return{k:'acidez',d:'Massas'};
  if(acid>=4&&corpo<=3&&w.tipos.indexOf('Massas')>=0)return{k:'acidez',d:'Massas'};
  return{k:'leve',d:'Frango'};}
 if(q>=4)return{k:'cremoso',d:(w.tipos.indexOf('Lagosta')>=0?'Lagosta':'Arroz')};
 return{k:'peixe',d:(w.tipos.indexOf('Peixe')>=0?'Peixe':'Saladas')};}
