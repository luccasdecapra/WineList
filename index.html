ta a mano. È un processo lento e del tutto naturale: non entrano né zucchero né alcol dall'esterno.","en":"The fresh grapes ferment first; then the dried grapes are steeped into the fermenting wine, a little at a time, releasing sugar and aroma over weeks. It is worked by hand. The process is slow and entirely natural: no sugar and no alcohol are added."}},"cabernetsauvignon":{"n":"Cabernet Sauvignon","a":["cabernet sauvignon"],"o":{"pt":"A tinta mais plantada do mundo: cássis, tanino firme, longa guarda.","it":"La rossa più piantata al mondo: cassis, tannino saldo, lunga guardia.","en":"The world's most planted red: blackcurrant, firm tannin, long life."},"d":{"pt":"Nasceu em Bordeaux de um cruzamento espontâneo entre Cabernet Franc e Sauvignon Blanc, descoberto por DNA só em 1996. Casca grossa e bago pequeno: daí a cor escura, o tanino firme e a capacidade de envelhecer décadas. Cássis, grafite, pimentão e cedro; com barrica, baunilha e tabaco. Na mesa: «é a espinha dorsal dos grandes tintos — em Bolgheri faz o que faz em Bordeaux».","it":"È nata a Bordeaux da un incrocio spontaneo tra Cabernet Franc e Sauvignon Blanc, scoperto col DNA solo nel 1996. Buccia spessa e acino piccolo: da qui il colore scuro, il tannino saldo e la capacità di invecchiare decenni. Cassis, grafite, peperone e cedro; con la barrique, vaniglia e tabacco. A tavola: «è la spina dorsale dei grandi rossi — a Bolgheri fa quello che fa a Bordeaux».","en":"Born in Bordeaux from a spontaneous crossing of Cabernet Franc and Sauvignon Blanc, identified by DNA only in 1996. Thick skin and small berry: hence the dark colour, the firm tannin and the ability to age for decades. Blackcurrant, graphite, bell pepper and cedar; with oak, vanilla and tobacco. At the table: «the backbone of the great reds — in Bolgheri it does what it does in Bordeaux»."},"t":"r","i":0,"q":[4,5,5],"c":{"pt":"Brota tarde, o que a protege da geada, e amadurece tarde, o que exige um lugar quente o bastante — em Bordeaux nem sempre consegue, na costa toscana consegue quase sempre. O que se espera não é o açúcar, é a maturação fenólica: tanino e semente maduros, para o vinho não ficar verde.","it":"Germoglia tardi, il che la protegge dalle gelate, e matura tardi, il che richiede un luogo abbastanza caldo — a Bordeaux non sempre ci riesce, sulla costa toscana quasi sempre. Non si aspetta lo zucchero, ma la maturità fenolica: tannino e vinaccioli maturi, perché il vino non resti verde.","en":"It buds late, which protects it from frost, and ripens late, which demands a place warm enough — in Bordeaux not always, on the Tuscan coast almost always. What is awaited is not sugar but phenolic ripeness: ripe tannins and pips, so the wine does not stay green."},"v":{"pt":"Maceração longa, de duas a três semanas, com remontagens diárias para extrair cor e tanino da casca grossa. Malolática quase sempre em barrica, e depois 18 a 24 meses em barricas de carvalho francês, boa parte novas — o tanino da uva aguenta a madeira nova, o que poucas castas conseguem.","it":"Macerazione lunga, due o tre settimane, con rimontaggi quotidiani per estrarre colore e tannino dalla buccia spessa. Malolattica quasi sempre in barrique, poi 18-24 mesi in rovere francese, in buona parte nuovo — il tannino dell'uva regge il legno nuovo, cosa che poche varietà riescono a fare.","en":"Long maceration, two to three weeks, with daily pump-overs to draw colour and tannin from the thick skins. Malolactic almost always in barrel, then 18 to 24 months in French oak, much of it new — the grape's tannin can carry new wood, which few varieties manage."}},"merlot":{"n":"Merlot","a":["merlot"],"o":{"pt":"Macio e carnudo: ameixa, cacau e tanino redondo.","it":"Morbido e carnoso: prugna, cacao e tannino rotondo.","en":"Soft and fleshy: plum, cocoa and round tannin."},"d":{"pt":"Também de Bordeaux, e a uva mais plantada da margem direita — Saint-Émilion e Pomerol. Amadurece antes do Cabernet e tem casca mais fina: dá um vinho mais macio, de ameixa, cereja preta, cacau e tanino arredondado. É a parte do blend que torna o vinho gostoso jovem. Na mesa: «é o lado macio — se o cliente acha o Cabernet duro, o Merlot é a resposta».","it":"Anch'esso di Bordeaux, ed è l'uva più piantata sulla rive droite — Saint-Émilion e Pomerol. Matura prima del Cabernet e ha buccia più fine: dà un vino più morbido, di prugna, ciliegia nera, cacao e tannino tondo. È la parte del blend che rende il vino godibile da giovane. A tavola: «è il lato morbido — se il cliente trova il Cabernet duro, il Merlot è la risposta».","en":"Also from Bordeaux, and the most planted grape on the right bank — Saint-Émilion and Pomerol. It ripens before Cabernet and has thinner skin: a softer wine of plum, black cherry, cocoa and rounded tannin. It is the part of the blend that makes a wine enjoyable young. At the table: «the soft side — if the guest finds Cabernet hard, Merlot is the answer»."},"t":"r","i":0,"q":[3,4,3],"c":{"pt":"Brota cedo e amadurece duas semanas antes do Cabernet, o que o expõe à geada da primavera e à chuva de agosto. Em clima quente amadurece depressa demais e perde acidez: a colheita costuma ser antecipada para não virar compota.","it":"Germoglia presto e matura due settimane prima del Cabernet, il che lo espone alle gelate primaverili e alla pioggia d'agosto. In clima caldo matura troppo in fretta e perde acidità: la vendemmia si anticipa per non finire in confettura.","en":"It buds early and ripens two weeks before Cabernet, which exposes it to spring frost and August rain. In warm climates it ripens too fast and loses acidity: picking is brought forward to avoid jam."},"v":{"pt":"Maceração mais curta que a do Cabernet, de dez a quinze dias, e temperaturas um pouco mais baixas: a casca é fina e extrair demais daria amargor. A malolática arredonda ainda mais. Em barrica, o Merlot absorve a madeira com facilidade — por isso o Masseto fica 24 meses em barricas novas sem ficar amadeirado.","it":"Macerazione più breve di quella del Cabernet, dieci-quindici giorni, e temperature un po' più basse: la buccia è fine ed estrarre troppo darebbe amaro. La malolattica arrotonda ancora. In barrique il Merlot assorbe il legno con facilità — per questo il Masseto resta 24 mesi in barrique nuove senza risultare legnoso.","en":"Shorter maceration than Cabernet, ten to fifteen days, at slightly lower temperatures: the skin is thin and over-extraction would bring bitterness. Malolactic rounds it further. In barrel Merlot absorbs oak easily — which is why Masseto spends 24 months in new barrels without tasting woody."}},"cabernetfranc":{"n":"Cabernet Franc","a":["cabernet franc"],"o":{"pt":"O pai do Cabernet Sauvignon: mais leve, floral e herbáceo.","it":"Il padre del Cabernet Sauvignon: più leggero, floreale ed erbaceo.","en":"Cabernet Sauvignon's father: lighter, floral, herbal."},"d":{"pt":"É um dos pais do Cabernet Sauvignon e do Merlot. Amadurece mais cedo e dá vinhos de cor e tanino mais leves, com violeta, framboesa, grafite e uma nota herbácea de folha de tomate que é a sua assinatura. Em Bolgheri entra em pequena parte para dar perfume e frescor; no Loire faz vinhos inteiros. Na mesa: «é o perfume do blend — o floral e o verde elegante vêm dele».","it":"È uno dei genitori del Cabernet Sauvignon e del Merlot. Matura più presto e dà vini di colore e tannino più leggeri, con viola, lampone, grafite e quella nota erbacea di foglia di pomodoro che è la sua firma. A Bolgheri entra in piccola parte per dare profumo e freschezza; nella Loira firma vini interi. A tavola: «è il profumo del blend — il floreale e il verde elegante vengono da lui».","en":"One of the parents of both Cabernet Sauvignon and Merlot. It ripens earlier and gives lighter colour and tannin, with violet, raspberry, graphite and the leafy tomato-stalk note that is its signature. In Bolgheri it plays a small part, lending perfume and freshness; in the Loire it makes whole wines. At the table: «the perfume of the blend — the floral and the elegant green come from here»."},"t":"r","i":0,"q":[4,3,4],"c":{"pt":"Amadurece cerca de uma semana antes do Cabernet Sauvignon e resiste melhor ao frio — por isso dá certo no Loire, onde o Sauvignon não amadureceria. Se colhido antes do ponto, a nota herbácea domina tudo: é a uva que mais castiga a pressa.","it":"Matura circa una settimana prima del Cabernet Sauvignon e resiste meglio al freddo — per questo funziona nella Loira, dove il Sauvignon non maturerebbe. Se vendemmiato prima del punto, la nota erbacea domina tutto: è l'uva che punisce di più la fretta.","en":"It ripens about a week before Cabernet Sauvignon and handles cold better — hence its success in the Loire, where Sauvignon would not ripen. Picked before its point, the herbal note takes over everything: no grape punishes haste more."},"v":{"pt":"Vinifica-se separado e entra no blend só na hora da montagem, geralmente na primavera seguinte. Maceração média e madeira mais discreta que a do Cabernet Sauvignon — barrica usada ou tonel — porque o que se quer dele é perfume, e a madeira nova o apagaria.","it":"Si vinifica separato ed entra nel blend solo all'assemblaggio, di solito la primavera successiva. Macerazione media e legno più discreto rispetto al Cabernet Sauvignon — barrique usata o botte — perché da lui si vuole profumo, e il legno nuovo lo cancellerebbe.","en":"It is vinified separately and joins the blend only at assembly, usually the following spring. Medium maceration and more discreet oak than Cabernet Sauvignon — used barrels or casks — because what is wanted from it is perfume, which new oak would erase."}},"petitverdot":{"n":"Petit Verdot","a":["petit verdot"],"o":{"pt":"Cor, tanino e violeta: entra pouco e muda o vinho.","it":"Colore, tannino e viola: entra poco e cambia il vino.","en":"Colour, tannin and violet: a small share changes the wine."},"d":{"pt":"Uva bordalesa que amadurece tarde — em Bordeaux muitas vezes não chega a maturar, e o nome significa «pequeno verde». Na costa toscana, mais quente, amadurece bem. Entra em 5–10% e dá cor profunda, tanino, violeta e especiaria. Na mesa: «é o tempero do blend: pouca quantidade, mas é dela que vem a cor escura e o floral».","it":"Uva bordolese a maturazione tardiva — a Bordeaux spesso non arriva a maturare, e il nome significa «piccolo verde». Sulla costa toscana, più calda, matura bene. Entra al 5–10% e dà colore profondo, tannino, viola e spezia. A tavola: «è la spezia del blend: poca quantità, ma il colore scuro e il floreale vengono da lì».","en":"A late-ripening Bordeaux grape — in Bordeaux it often fails to ripen, and the name means «little green one». On the warmer Tuscan coast it ripens well. Used at 5–10%, it brings deep colour, tannin, violet and spice. At the table: «the seasoning of the blend: a small share, but the dark colour and the floral note come from it»."},"t":"r","i":0,"q":[4,5,5],"c":{"pt":"A última a ser colhida, sempre: em Bolgheri entra na adega em outubro, semanas depois do Merlot. Em anos frescos não amadurece e simplesmente não entra no blend daquela safra — é o que explica os 4% de um ano e os 17% de outro.","it":"L'ultima a essere vendemmiata, sempre: a Bolgheri entra in cantina in ottobre, settimane dopo il Merlot. Nelle annate fresche non matura e semplicemente non entra nel blend di quell'anno — ecco perché un anno fa il 4% e un altro il 17%.","en":"Always the last picked: in Bolgheri it comes in during October, weeks after the Merlot. In cool years it fails to ripen and simply does not enter that vintage's blend — which explains 4% one year and 17% the next."},"v":{"pt":"Maceração longa, porque a casca é espessa e cede cor e tanino em abundância. Fermenta e amadurece separado, em barrica, e entra no blend em pequena proporção — mais do que isso dominaria o conjunto com tanino e com a sua nota de violeta.","it":"Macerazione lunga, perché la buccia è spessa e cede colore e tannino in abbondanza. Fermenta e matura separato, in barrique, ed entra nel blend in piccola proporzione — di più dominerebbe l'insieme con tannino e con la sua nota di viola.","en":"Long maceration, since the skin is thick and yields colour and tannin generously. It ferments and matures apart, in barrel, and joins the blend in small proportion — any more would dominate the whole with tannin and its violet note."}},"carmenere":{"n":"Carménère","a":["carménère","carmenere"],"o":{"pt":"Bordalesa perdida, reencontrada no Chile; pimentão e especiaria.","it":"Bordolese perduta, ritrovata in Cile; peperone e spezie.","en":"A lost Bordeaux grape, rediscovered in Chile; pepper and spice."},"d":{"pt":"Era uma das seis uvas de Bordeaux e desapareceu de lá com a filoxera no século XIX. Reapareceu no Chile, onde por décadas foi confundida com Merlot, e sobrevive também no nordeste da Itália. Dá cor densa, pimentão, pimenta preta, especiaria doce e tanino médio. Na mesa: «é uma uva de Bordeaux que Bordeaux perdeu — quase ninguém mais planta».","it":"Era una delle sei uve di Bordeaux e da lì è sparita con la fillossera nell'Ottocento. È riapparsa in Cile, dove per decenni è stata confusa col Merlot, e sopravvive anche nel nordest italiano. Dà colore denso, peperone, pepe nero, spezia dolce e tannino medio. A tavola: «è un'uva di Bordeaux che Bordeaux ha perso — quasi nessuno la pianta più».","en":"One of the six Bordeaux grapes, it vanished from there with phylloxera in the 19th century. It reappeared in Chile, where for decades it was mistaken for Merlot, and survives in north-east Italy too. Dense colour, bell pepper, black pepper, sweet spice and medium tannin. At the table: «a Bordeaux grape Bordeaux lost — almost nobody plants it now»."},"t":"r","i":0,"q":[3,4,3],"c":{"pt":"Amadurece muito tarde, até um mês depois do Merlot — e é exatamente isso que a condenou em Bordeaux, onde a chuva de outubro chegava antes. Colhida verde, dá pimentão agressivo; madura, perde o verde e ganha especiaria.","it":"Matura molto tardi, fino a un mese dopo il Merlot — ed è proprio questo che l'ha condannata a Bordeaux, dove la pioggia d'ottobre arrivava prima. Vendemmiata acerba dà peperone aggressivo; matura, perde il verde e guadagna spezia.","en":"It ripens very late, up to a month after Merlot — which is exactly what doomed it in Bordeaux, where October rain arrived first. Picked green it gives aggressive bell pepper; ripe, it loses the green and gains spice."},"v":{"pt":"Maceração média e fermentação a temperatura controlada; o excesso de extração realça a nota verde. Entra quase sempre em pequena parte no blend, para dar cor e especiaria — no Curtefranca Rosso da Ca' del Bosco, onde é uma sobrevivente do século XIX.","it":"Macerazione media e fermentazione a temperatura controllata; l'eccesso di estrazione esalta la nota verde. Entra quasi sempre in piccola parte nel blend, per dare colore e spezia — nel Curtefranca Rosso di Ca' del Bosco, dove è una sopravvissuta dell'Ottocento.","en":"Medium maceration and temperature-controlled fermentation; over-extraction accentuates the green note. It almost always joins blends in a small share, for colour and spice — as in Ca' del Bosco's Curtefranca Rosso, where it survives from the 19th century."}},"pinotnero":{"n":"Pinot Nero","a":["pinot nero","pinot noir"],"o":{"pt":"A uva da Borgonha: cor clara, perfume enorme, tanino de seda.","it":"L'uva della Borgogna: colore chiaro, profumo enorme, tannino di seta.","en":"Burgundy's grape: pale colour, huge perfume, silken tannin."},"d":{"pt":"A grande tinta da Borgonha e uma das mais antigas em cultivo. Casca fina: a cor é clara e o tanino, sedoso — o que confunde quem espera um tinto escuro. Cereja, framboesa, violeta, terra e cogumelo com os anos. É também uma das três uvas do Champagne, onde entra branca (blanc de noirs) ou dá a cor ao rosé. Na mesa: «é claro de cor e leve na boca, mas é o tinto mais perfumado que existe».","it":"La grande rossa della Borgogna e una delle più antiche in coltivazione. Buccia fine: il colore è chiaro e il tannino setoso — cosa che spiazza chi si aspetta un rosso scuro. Ciliegia, lampone, viola, terra e fungo con gli anni. È anche una delle tre uve dello Champagne, dove entra vinificata in bianco (blanc de noirs) o dà il colore al rosé. A tavola: «è chiaro di colore e leggero in bocca, ma è il rosso più profumato che esista».","en":"Burgundy's great red and one of the oldest grapes in cultivation. Thin skin: pale colour and silken tannin — which surprises anyone expecting a dark red. Cherry, raspberry, violet, earth and mushroom with age. It is also one of the three Champagne grapes, vinified white (blanc de noirs) or lending colour to rosé. At the table: «pale in colour and light in the mouth, yet the most perfumed red there is»."},"t":"r","i":0,"q":[5,2,2],"c":{"pt":"A uva mais difícil que existe. Brota cedo e amadurece cedo, com casca fina e cacho compacto — apodrece com qualquer chuva. Para espumante colhe-se em agosto, com acidez alta; para vinho tranquilo, semanas depois. Clone e exposição mudam tudo: por isso se fala em parcelas, e não em safras.","it":"L'uva più difficile che esista. Germoglia presto e matura presto, con buccia sottile e grappolo serrato — marcisce con qualsiasi pioggia. Per lo spumante si vendemmia in agosto, con acidità alta; per il vino fermo, settimane dopo. Clone ed esposizione cambiano tutto: per questo si parla di parcelle, non di annate.","en":"The most difficult grape there is. It buds early and ripens early, with thin skin and a tight bunch — it rots in any rain. For sparkling wine it is picked in August, at high acidity; for still wine, weeks later. Clone and exposure change everything: hence the talk of parcels rather than vintages."},"v":{"pt":"Para tinto: maceração a frio antes de fermentar, para extrair cor sem tanino, e trabalho delicado — pigeage suave, nada de extração bruta. Amadurece em barricas usadas, raramente novas. Para espumante, é prensado inteiro e muito depressa, sem tocar a casca: nasce branco, e é esse o blanc de noirs. No rosé, deixa-se a casca algumas horas.","it":"Per il rosso: macerazione a freddo prima della fermentazione, per estrarre colore senza tannino, e lavoro delicato — follature leggere, nessuna estrazione brutale. Matura in barrique usate, raramente nuove. Per lo spumante si pressa a grappolo intero e molto in fretta, senza toccare la buccia: nasce bianco, ed è il blanc de noirs. Nel rosé la buccia resta qualche ora.","en":"For red: a cold soak before fermentation, to draw colour without tannin, then gentle handling — soft punch-downs, no brute extraction. It matures in used barrels, rarely new. For sparkling it is whole-bunch pressed, very fast, without touching the skins: it is born white, and that is blanc de noirs. In rosé the skins stay a few hours."}},"pinotmeunier":{"n":"Pinot Meunier","a":["pinot meunier","meunier"],"o":{"pt":"A terceira uva do Champagne: fruta madura e maciez imediata.","it":"La terza uva dello Champagne: frutta matura e morbidezza immediata.","en":"Champagne's third grape: ripe fruit and immediate softness."},"d":{"pt":"A menos falada das três uvas do Champagne e, por muito tempo, a mais plantada. «Meunier» é moleiro: as folhas parecem cobertas de farinha. Amadurece cedo e resiste à geada do vale do Marne. Dá fruta madura, pão e maciez — é a uva que torna o champagne agradável logo, sem esperar anos. Na mesa: «é o que dá o lado redondo e frutado; o Pinot Nero dá a estrutura e o Chardonnay a tensão».","it":"La meno citata delle tre uve dello Champagne e, per molto tempo, la più piantata. «Meunier» è mugnaio: le foglie sembrano coperte di farina. Matura presto e resiste alle gelate della Valle della Marna. Dà frutta matura, pane e morbidezza — è l'uva che rende lo champagne piacevole subito, senza aspettare anni. A tavola: «è il lato tondo e fruttato; il Pinot Nero dà la struttura e lo Chardonnay la tensione».","en":"The least discussed of Champagne's three grapes and, for a long time, the most planted. «Meunier» means miller: the leaves look dusted with flour. It ripens early and resists frost in the Marne Valley. Ripe fruit, bread and softness — the grape that makes champagne pleasurable at once, without waiting years. At the table: «it gives the round, fruity side; Pinot Nero gives structure and Chardonnay tension»."},"t":"r","i":0,"q":[4,3,2],"c":{"pt":"Brota duas semanas depois do Pinot Nero e amadurece antes dele — essa diferença é tudo no vale do Marne, onde a geada de abril é frequente: quando ela chega, o Meunier ainda não brotou e escapa. É a uva-seguro do Champagne.","it":"Germoglia due settimane dopo il Pinot Nero e matura prima di lui — questa differenza è tutto nella Valle della Marna, dove la gelata d'aprile è frequente: quando arriva, il Meunier non è ancora germogliato e scampa. È l'uva-assicurazione dello Champagne.","en":"It buds two weeks after Pinot Nero and ripens before it — that difference is everything in the Marne Valley, where April frost is frequent: when it strikes, Meunier has not yet budded and escapes. It is Champagne's insurance grape."},"v":{"pt":"Prensado inteiro e vinificado em branco, como o Pinot Nero. Amadurece mais depressa na garrafa, o que o torna a parte do blend que já está pronta cedo — por isso aparece mais nos champagnes de entrada e menos nos millésimés, feitos para esperar dez anos.","it":"Pressato a grappolo intero e vinificato in bianco, come il Pinot Nero. Matura più in fretta in bottiglia, ed è quindi la parte del blend già pronta presto — per questo compare di più negli champagne d'ingresso e meno nei millesimati, fatti per aspettare dieci anni.","en":"Whole-bunch pressed and vinified white, like Pinot Nero. It matures faster in bottle, so it is the part of the blend that is ready early — which is why it features more in entry cuvées and less in vintage champagnes built to wait a decade."}},"syrah":{"n":"Syrah","a":["syrah","shiraz"],"o":{"pt":"Pimenta preta, azeitona e fruta escura; do Ródano norte.","it":"Pepe nero, oliva e frutta scura; dal Rodano settentrionale.","en":"Black pepper, olive and dark fruit; from the northern Rhône."},"d":{"pt":"Vem do norte do Ródano, de Hermitage e Côte-Rôtie. Syrah e Shiraz são a mesma uva: o segundo nome é australiano e indica um estilo mais maduro e doce de fruta. Dá violeta, amora, pimenta preta, azeitona negra e, em clima quente, um toque defumado e de carne curada. Na mesa: «a pimenta preta que se sente não é tempero — vem da própria uva».","it":"Viene dal Rodano settentrionale, da Hermitage e Côte-Rôtie. Syrah e Shiraz sono la stessa uva: il secondo nome è australiano e indica uno stile di frutta più matura e dolce. Dà viola, mora, pepe nero, oliva nera e, in clima caldo, un tocco affumicato e di carne stagionata. A tavola: «il pepe nero che si sente non è una spezia aggiunta — viene dall'uva».","en":"From the northern Rhône, from Hermitage and Côte-Rôtie. Syrah and Shiraz are the same grape: the second name is Australian and signals a riper, sweeter fruit style. Violet, blackberry, black pepper, black olive and, in warm climates, a smoky, cured-meat touch. At the table: «the black pepper you taste is not a seasoning — it comes from the grape»."},"t":"r","i":0,"q":[4,4,4],"c":{"pt":"Amadurece no meio da estação e é sensível ao excesso de sol: colhida tarde demais, perde a pimenta e vira fruta cozida. No norte do Ródano as vinhas ficam em encostas íngremes viradas a sul, trabalhadas à mão, porque nenhuma máquina sobe ali.","it":"Matura a metà stagione ed è sensibile all'eccesso di sole: vendemmiata troppo tardi perde il pepe e diventa frutta cotta. Nel Rodano settentrionale le vigne stanno su pendii ripidi esposti a sud, lavorati a mano, perché nessuna macchina ci sale.","en":"It ripens mid-season and is sensitive to excess sun: picked too late it loses its pepper and turns to cooked fruit. In the northern Rhône the vines sit on steep south-facing slopes worked by hand, because no machine can climb them."},"v":{"pt":"Uma parte dos cachos costuma fermentar inteira, com o engaço — o caule — o que acentua a pimenta e dá frescor. Maceração média, madeira grande e usada de preferência: a barrica nova cobriria a especiaria, que é a razão de ser da uva.","it":"Una parte dei grappoli fermenta spesso intera, con il raspo, il che accentua il pepe e dà freschezza. Macerazione media, legno grande e usato di preferenza: la barrique nuova coprirebbe la spezia, che è la ragione d'essere dell'uva.","en":"Part of the crop is often fermented whole-bunch, stems included, which accentuates the pepper and brings freshness. Medium maceration, and large or used oak by preference: new barriques would cover the spice that is the grape's whole point."}},"grenache":{"n":"Grenache","a":["grenache","garnacha","cannonau"],"o":{"pt":"Fruta vermelha doce, álcool alto, tanino baixo.","it":"Frutta rossa dolce, alcol alto, tannino basso.","en":"Sweet red fruit, high alcohol, low tannin."},"d":{"pt":"De origem espanhola (Garnacha) ou sarda (Cannonau) — a discussão continua. É a base de Châteauneuf-du-Pape e a uva dominante nos rosés da Provença. Casca fina e muito açúcar: dá álcool alto, tanino baixo e fruta vermelha madura, com morango, framboesa e erva seca. Na mesa: «é a uva que faz o rosé da Provença ter fruta sem peso».","it":"Di origine spagnola (Garnacha) o sarda (Cannonau) — la discussione continua. È la base di Châteauneuf-du-Pape e l'uva dominante nei rosé di Provenza. Buccia fine e molto zucchero: dà alcol alto, tannino basso e frutta rossa matura, con fragola, lampone ed erbe secche. A tavola: «è l'uva che dà al rosé di Provenza frutta senza peso».","en":"Spanish in origin (Garnacha) or Sardinian (Cannonau) — the argument continues. It is the base of Châteauneuf-du-Pape and the dominant grape in Provençal rosé. Thin skin and plenty of sugar: high alcohol, low tannin and ripe red fruit, with strawberry, raspberry and dried herbs. At the table: «the grape that gives Provence rosé its fruit without weight»."},"t":"r","i":0,"q":[3,4,2],"c":{"pt":"Resiste à seca como poucas e amadurece tarde, acumulando muito açúcar — daí o álcool alto. No sul da França cresce em alberello, sem arame, forma que a protege do vento mistral. Nos rosés, colhe-se mais cedo, de propósito, para manter acidez.","it":"Resiste alla siccità come poche e matura tardi, accumulando molto zucchero — da cui l'alcol alto. Nel sud della Francia cresce ad alberello, senza filo, forma che la protegge dal maestrale. Nei rosé si vendemmia più presto, di proposito, per mantenere acidità.","en":"It resists drought like few others and ripens late, piling up sugar — hence the high alcohol. In southern France it grows as a bush vine, wireless, a shape that shields it from the mistral. For rosé it is picked earlier on purpose, to retain acidity."},"v":{"pt":"No rosé da Provença usa-se a prensagem direta: a uva tinta é prensada de imediato e o sumo mal toca a casca — daí a cor pálida, quase rosa-cebola, que ali é marca registrada. Fermentação a frio em aço. No tinto, maceração média e madeira grande, porque oxida com facilidade.","it":"Nel rosé di Provenza si usa la pressatura diretta: l'uva rossa viene pressata subito e il succo tocca appena la buccia — da cui il colore pallido, quasi buccia di cipolla, che lì è un marchio di fabbrica. Fermentazione a freddo in acciaio. Nel rosso, macerazione media e legno grande, perché ossida facilmente.","en":"For Provençal rosé, direct pressing is used: the red grapes are pressed at once and the juice barely touches the skins — hence the pale, almost onion-skin colour that is the region's trademark. Cold fermentation in steel. For red, medium maceration and large oak, since it oxidises easily."}},"cinsault":{"n":"Cinsault","a":["cinsault","cinsaut"],"o":{"pt":"Leveza e perfume no rosé: morango, pêssego e flor.","it":"Leggerezza e profumo nel rosé: fragola, pesca e fiori.","en":"Lightness and perfume in rosé: strawberry, peach and blossom."},"d":{"pt":"Uva do sul da França, resistente ao calor e à seca. Raramente faz vinhos sozinha: entra nos blends e nos rosés da Provença para dar leveza, perfume floral e um paladar delicado de morango e pêssego, com pouco tanino. Na mesa: «é a uva que deixa o rosé leve e floral em vez de pesado».","it":"Uva del sud della Francia, resistente al caldo e alla siccità. Raramente firma vini da sola: entra nei blend e nei rosé di Provenza per dare leggerezza, profumo floreale e un palato delicato di fragola e pesca, con poco tannino. A tavola: «è l'uva che rende il rosé leggero e floreale invece che pesante».","en":"A grape of southern France, resistant to heat and drought. It rarely makes wine alone: it joins blends and Provençal rosés to give lightness, floral perfume and a delicate strawberry-and-peach palate, with little tannin. At the table: «the grape that keeps rosé light and floral instead of heavy»."},"t":"r","i":0,"q":[3,2,2],"c":{"pt":"Resiste muito bem ao calor e à seca, e é produtiva: sem controlo de rendimento dá vinho fraco. Para rosé colhe-se cedo, quando o aroma floral está no auge e a acidez ainda não caiu.","it":"Resiste molto bene al caldo e alla siccità, ed è produttiva: senza controllo delle rese dà vino debole. Per il rosé si vendemmia presto, quando il profumo floreale è al massimo e l'acidità non è ancora calata.","en":"It stands heat and drought very well and is productive: without yield control it gives thin wine. For rosé it is picked early, when the floral aroma peaks and acidity has not yet fallen."},"v":{"pt":"Prensagem direta, como o Grenache, e fermentação a frio em aço. Nunca vê madeira nos rosés: o papel dela é perfume e leveza, e qualquer madeira apagaria os dois.","it":"Pressatura diretta, come il Grenache, e fermentazione a freddo in acciaio. Non vede mai legno nei rosé: il suo ruolo è profumo e leggerezza, e qualsiasi legno li cancellerebbe.","en":"Direct pressing, like Grenache, and cold fermentation in steel. It never sees oak in rosé: its role is perfume and lightness, and any wood would erase both."}},"malbec":{"n":"Malbec","a":["malbec"],"o":{"pt":"Francesa de Cahors que virou símbolo da Argentina.","it":"Francese di Cahors diventata simbolo dell'Argentina.","en":"A French grape from Cahors that became Argentina's symbol."},"d":{"pt":"Nasceu no sudoeste da França, em Cahors, onde fazia o «vinho negro». Levada à Argentina em 1853, encontrou em Mendoza altitude, sol e ar seco, e tornou-se a uva do país. Cor violeta densa, ameixa, amora, violeta e tanino macio, de textura aveludada. Na mesa: «é francesa de origem, mas quem a tornou famosa foi a Argentina — a altitude de Mendoza dá a cor e o perfume».","it":"È nata nel sudovest della Francia, a Cahors, dove firmava il «vino nero». Portata in Argentina nel 1853, a Mendoza ha trovato altitudine, sole e aria secca, diventando l'uva del paese. Colore viola denso, prugna, mora, viola e tannino morbido, di tessitura vellutata. A tavola: «è francese d'origine, ma l'ha resa famosa l'Argentina — l'altitudine di Mendoza dà colore e profumo».","en":"Born in south-west France, in Cahors, where it made the «black wine». Taken to Argentina in 1853, it found altitude, sun and dry air in Mendoza and became the country's grape. Dense purple colour, plum, blackberry, violet and soft, velvety tannin. At the table: «French by origin, but Argentina made its name — Mendoza's altitude gives the colour and the perfume»."},"t":"r","i":0,"q":[3,4,3],"c":{"pt":"Em Mendoza as vinhas ficam entre 900 e 1.500 metros. A altitude é o segredo: muito sol durante o dia, noites frias, e uma amplitude térmica que espessa a casca e fixa a cor. Chuva quase não há — a água vem do degelo dos Andes, por canais.","it":"A Mendoza le vigne stanno tra i 900 e i 1.500 metri. L'altitudine è il segreto: molto sole di giorno, notti fredde, e un'escursione termica che ispessisce la buccia e fissa il colore. Di pioggia quasi non ce n'è — l'acqua arriva dal disgelo delle Ande, per canali.","en":"In Mendoza the vineyards sit between 900 and 1,500 metres. Altitude is the secret: strong sun by day, cold nights, and a temperature swing that thickens the skins and fixes the colour. There is almost no rain — water comes from Andean snowmelt, through channels."},"v":{"pt":"Maceração de duas semanas e fermentação a temperatura média. O tanino é naturalmente macio, o que dispensa extração agressiva. A madeira varia muito: barrica francesa nos vinhos de guarda, cimento ou aço nos que querem fruta pura — hoje o estilo vai nessa direção.","it":"Macerazione di due settimane e fermentazione a temperatura media. Il tannino è naturalmente morbido, il che evita estrazioni aggressive. Il legno varia molto: barrique francese nei vini da guardia, cemento o acciaio in quelli che cercano frutto puro — oggi lo stile va in questa direzione.","en":"Two weeks of maceration and fermentation at moderate temperature. The tannin is naturally soft, so no aggressive extraction is needed. Oak varies widely: French barriques for wines to keep, concrete or steel for those chasing pure fruit — today's style leans that way."}},"zinfandel":{"n":"Zinfandel","a":["zinfandel","primitivo"],"o":{"pt":"A mesma uva do Primitivo: fruta em compota e álcool alto.","it":"La stessa uva del Primitivo: frutta in confettura e alcol alto.","en":"The same grape as Primitivo: jammy fruit and high alcohol."},"d":{"pt":"O DNA mostrou que Zinfandel, o Primitivo da Puglia e o Tribidrag croata são a mesma uva. Na Califórnia amadurece de forma desigual no mesmo cacho, o que dá fruta em compota ao lado de fruta fresca, álcool alto e uma especiaria de pimenta e canela. Na mesa: «é a uva da Califórnia que na Itália se chama Primitivo — a mesma videira, dois nomes».","it":"Il DNA ha mostrato che Zinfandel, il Primitivo di Puglia e il Tribidrag croato sono la stessa uva. In California matura in modo disomogeneo nello stesso grappolo, e questo dà frutta in confettura accanto a frutta fresca, alcol alto e una spezia di pepe e cannella. A tavola: «è l'uva della California che in Italia si chiama Primitivo — la stessa vite, due nomi».","en":"DNA showed that Zinfandel, Puglia's Primitivo and Croatia's Tribidrag are one grape. In California it ripens unevenly within the same bunch, giving jammy fruit beside fresh fruit, high alcohol and a pepper-and-cinnamon spice. At the table: «California's grape, called Primitivo in Italy — one vine, two names»."},"t":"r","i":0,"q":[3,4,3],"c":{"pt":"Maturação desigual dentro do mesmo cacho: enquanto uma parte ainda está verde, outra já está passa. Não há dia perfeito para colher — o produtor escolhe o compromisso, e é dessa mistura que vem a fruta fresca ao lado da fruta em compota.","it":"Maturazione disomogenea nello stesso grappolo: mentre una parte è ancora acerba, un'altra è già passita. Non esiste un giorno perfetto per vendemmiare — il produttore sceglie il compromesso, e da questa mescolanza vengono frutta fresca e frutta in confettura insieme.","en":"Uneven ripening within the same bunch: while part is still green, another is already raisined. There is no perfect day to pick — the grower chooses a compromise, and that mixture is where fresh fruit beside jammy fruit comes from."},"v":{"pt":"Fermentação a temperatura mais alta para extrair cor das bagas, e muitas vezes com leveduras robustas, porque o açúcar elevado pode travar a fermentação no meio. A madeira americana, de aroma mais doce, é tradicional na Califórnia.","it":"Fermentazione a temperatura più alta per estrarre colore dagli acini, e spesso con lieviti robusti, perché lo zucchero elevato può bloccare la fermentazione a metà. Il legno americano, dal profumo più dolce, è tradizionale in California.","en":"Fermentation at higher temperature to extract colour from the berries, and often with robust yeasts, because the high sugar can stall fermentation midway. American oak, sweeter in aroma, is the Californian tradition."}},"tannat":{"n":"Tannat","a":["tannat"],"o":{"pt":"A uva de mais tanino que existe; entra pouco, estrutura muito.","it":"L'uva col più tannino che esista; entra poca, struttura molto.","en":"The most tannic grape there is; a small share, great structure."},"d":{"pt":"Do sudoeste francês, de Madiran, e hoje uva nacional do Uruguai. O nome vem de tanino, e com razão: tem mais polifenóis que qualquer outra tinta comum. Na Sicília, a Donnafugata plantou-a em 2002 e usa-a em pequena parte para dar estrutura e cor ao blend. Na mesa: «entra em pouca quantidade só para dar coluna ao vinho — sozinha seria dura demais».","it":"Dal sudovest francese, da Madiran, e oggi uva nazionale dell'Uruguay. Il nome viene da tannino, e con ragione: ha più polifenoli di qualsiasi altra rossa comune. In Sicilia la Donnafugata l'ha piantata nel 2002 e la usa in piccola parte per dare struttura e colore al blend. A tavola: «entra in piccola quantità solo per dare colonna al vino — da sola sarebbe troppo dura».","en":"From south-west France, from Madiran, and today Uruguay's national grape. The name comes from tannin, and rightly: it has more polyphenols than any other common red. In Sicily, Donnafugata planted it in 2002 and uses a small share to give the blend structure and colour. At the table: «a small share, purely to give the wine a spine — alone it would be too hard»."},"t":"r","i":0,"q":[4,5,5],"c":{"pt":"Amadurece tarde e precisa de calor para que o tanino amadureça junto com o açúcar — colhida cedo, é intragável. Na Sicília, onde a Donnafugata a planta desde 2002, encontra esse calor com folga.","it":"Matura tardi e ha bisogno di caldo perché il tannino maturi insieme allo zucchero — vendemmiata presto è imbevibile. In Sicilia, dove la Donnafugata la pianta dal 2002, questo caldo c'è in abbondanza.","en":"It ripens late and needs heat so the tannin ripens along with the sugar — picked early, it is undrinkable. In Sicily, where Donnafugata has grown it since 2002, that heat is there in abundance."},"v":{"pt":"Extração deliberadamente contida: pouca remontagem, maceração curta para a casta. Em Madiran usa-se a micro-oxigenação — injeção controlada de oxigénio — inventada justamente para domar este tanino. No blend siciliano, entra em pequena parte e vai à barrica junto com as outras.","it":"Estrazione volutamente contenuta: pochi rimontaggi, macerazione breve per la varietà. A Madiran si usa la microossigenazione — iniezione controllata di ossigeno — inventata proprio per domare questo tannino. Nel blend siciliano entra in piccola parte e va in barrique con le altre.","en":"Deliberately restrained extraction: few pump-overs, short maceration for the variety. In Madiran micro-oxygenation — a controlled injection of oxygen — was invented precisely to tame this tannin. In the Sicilian blend it enters in a small share and goes to barrel with the rest."}},"nebbiolo":{"n":"Nebbiolo","a":["nebbiolo"],"o":{"pt":"A uva do Barolo: cor clara, tanino feroz, rosa e alcatrão.","it":"L'uva del Barolo: colore chiaro, tannino feroce, rosa e catrame.","en":"Barolo's grape: pale colour, fierce tannin, rose and tar."},"d":{"pt":"A grande tinta do Piemonte, obrigatória no Barolo e no Barbaresco. O nome vem de «nebbia», o nevoeiro que cobre as Langhe na vindima tardia, em outubro. É a contradição mais útil de explicar: cor clara, quase alaranjada com os anos, e ao mesmo tempo tanino e acidez altíssimos. Rosa seca, cereja, alcatrão, couro e trufa. Na mesa: «não se deixe enganar pela cor clara — é um dos tintos mais estruturados do mundo».","it":"La grande rossa del Piemonte, obbligatoria nel Barolo e nel Barbaresco. Il nome viene da «nebbia», quella che copre le Langhe nella vendemmia tardiva di ottobre. È la contraddizione più utile da spiegare: colore chiaro, quasi aranciato con gli anni, e insieme tannino e acidità altissimi. Rosa secca, ciliegia, catrame, cuoio e tartufo. A tavola: «non si faccia ingannare dal colore chiaro — è uno dei rossi più strutturati al mondo».","en":"Piedmont's great red, mandatory in Barolo and Barbaresco. The name comes from «nebbia», the fog that covers the Langhe at the late October harvest. It is the most useful contradiction to explain: pale colour, almost orange with age, yet very high tannin and acidity. Dried rose, cherry, tar, leather and truffle. At the table: «do not be fooled by the pale colour — it is one of the most structured reds in the world»."},"t":"r","i":1,"q":[5,4,5],"c":{"pt":"A primeira a brotar e a última a ser colhida: fica na vinha até outubro, sob o nevoeiro que lhe deu o nome. Essa estação longuíssima é o que permite maturar o tanino. Exige as melhores exposições — nas Langhe, as encostas viradas a sul, que se vendem por parcela e têm nome próprio.","it":"La prima a germogliare e l'ultima a essere vendemmiata: resta in vigna fino a ottobre, sotto la nebbia che le ha dato il nome. Questa stagione lunghissima è ciò che permette di maturare il tannino. Pretende le migliori esposizioni — nelle Langhe i versanti a sud, che si vendono a parcella e hanno un nome proprio.","en":"First to bud and last to be picked: it stays on the vine into October, under the fog that gave it its name. That very long season is what ripens the tannin. It demands the best exposures — in the Langhe, the south-facing slopes, sold by parcel and each with its own name."},"v":{"pt":"Maceração longa, de três a cinco semanas nos estilos tradicionais, para extrair tanino que depois precisa de anos para amaciar. O Barolo exige por lei no mínimo 38 meses de envelhecimento, dos quais 18 em madeira; o Barbaresco, 26 meses. A discussão entre tonel grande esloveno e barrica francesa divide o Piemonte há quarenta anos.","it":"Macerazione lunga, tre-cinque settimane negli stili tradizionali, per estrarre un tannino che poi ha bisogno di anni per ammorbidirsi. Il Barolo per legge richiede almeno 38 mesi di affinamento, di cui 18 in legno; il Barbaresco 26. La discussione tra botte grande slavoniana e barrique francese divide il Piemonte da quarant'anni.","en":"Long maceration, three to five weeks in traditional styles, extracting a tannin that then needs years to soften. Barolo requires by law at least 38 months of ageing, 18 of them in wood; Barbaresco 26. The argument between large Slavonian casks and French barriques has divided Piedmont for forty years."}},"sangiovese":{"n":"Sangiovese","a":["sangiovese"],"o":{"pt":"A uva da Toscana: cereja ácida, tomate seco e tanino seco.","it":"L'uva della Toscana: ciliegia acida, pomodoro secco e tannino asciutto.","en":"Tuscany's grape: sour cherry, dried tomato and dry tannin."},"d":{"pt":"A tinta mais plantada da Itália e a alma da Toscana: Chianti Classico, Brunello di Montalcino e Vino Nobile são todos Sangiovese. Acidez alta e tanino seco, com cereja ácida, tomate seco, ervas e, com a madeira, tabaco e couro. É a uva que mais pede comida — sozinha pode parecer austera. Na mesa: «aquela acidez que faz salivar é o que o torna perfeito com tomate e com carne».","it":"La rossa più piantata d'Italia e l'anima della Toscana: Chianti Classico, Brunello di Montalcino e Vino Nobile sono tutti Sangiovese. Acidità alta e tannino asciutto, con ciliegia acida, pomodoro secco, erbe e, col legno, tabacco e cuoio. È l'uva che chiede più cibo — da sola può sembrare austera. A tavola: «quell'acidità che fa salivare è ciò che lo rende perfetto col pomodoro e con la carne».","en":"Italy's most planted red and the soul of Tuscany: Chianti Classico, Brunello di Montalcino and Vino Nobile are all Sangiovese. High acidity and dry tannin, with sour cherry, dried tomato, herbs and, with oak, tobacco and leather. It is the grape that most asks for food — alone it can seem austere. At the table: «that mouth-watering acidity is exactly what makes it perfect with tomato and with meat»."},"t":"r","i":1,"q":[5,3,4],"c":{"pt":"Brota cedo e amadurece tarde, o que a deixa exposta de ponta a ponta da estação. É muito sensível ao clone e ao lugar: a mesma uva dá um vinho leve em solo fértil e um Brunello em solo pobre de galestro. A colheita vai de meados de setembro a outubro.","it":"Germoglia presto e matura tardi, il che la espone da un capo all'altro della stagione. È molto sensibile al clone e al luogo: la stessa uva dà un vino leggero su suolo fertile e un Brunello su galestro povero. La vendemmia va da metà settembre a ottobre.","en":"It buds early and ripens late, exposing it from one end of the season to the other. It is highly sensitive to clone and site: the same grape gives a light wine on fertile soil and a Brunello on poor galestro. Harvest runs from mid-September into October."},"v":{"pt":"Maceração de duas a três semanas. A casca é fina e dá pouca cor, mas muito tanino da semente — por isso se trabalha com cuidado para não extrair amargor. O Brunello di Montalcino exige dois anos em carvalho e um quarto ano antes de sair; o Chianti Classico Gran Selezione, 30 meses. Tonel grande é a tradição; a barrica dividiu opiniões nos anos 1990.","it":"Macerazione di due-tre settimane. La buccia è fine e dà poco colore, ma molto tannino dai vinaccioli — per questo si lavora con cautela per non estrarre amaro. Il Brunello di Montalcino richiede due anni in rovere e un quarto anno prima dell'uscita; il Chianti Classico Gran Selezione 30 mesi. La botte grande è la tradizione; la barrique ha diviso le opinioni negli anni Novanta.","en":"Two to three weeks of maceration. The skin is thin and gives little colour but plenty of pip tannin — so it is handled carefully to avoid extracting bitterness. Brunello di Montalcino requires two years in oak and a fourth year before release; Chianti Classico Gran Selezione, 30 months. Large casks are the tradition; barriques split opinion in the 1990s."}},"barbera":{"n":"Barbera","a":["barbera"],"o":{"pt":"Acidez alta, tanino baixo: cereja preta e muito suco.","it":"Acidità alta, tannino basso: ciliegia nera e molto succo.","en":"High acidity, low tannin: black cherry and plenty of juice."},"d":{"pt":"A uva mais plantada do Piemonte — durante muito tempo o vinho do dia a dia, enquanto o Nebbiolo era o de festa. A combinação é incomum: acidez muito alta e tanino baixo, o que dá um tinto suculento e fácil, de cereja preta, ameixa e violeta. Em barrica ganha corpo e especiaria, como no Pomorosso, que mudou a reputação da uva nos anos 1980. Na mesa: «é o tinto do Piemonte que se bebe sem esperar — fruta e acidez, sem tanino para amaciar».","it":"L'uva più piantata del Piemonte — per molto tempo il vino di tutti i giorni, mentre il Nebbiolo era quello della festa. La combinazione è insolita: acidità altissima e tannino basso, da cui un rosso succoso e facile, di ciliegia nera, prugna e viola. In barrique prende corpo e spezia, come nel Pomorosso, che negli anni Ottanta ha cambiato la reputazione dell'uva. A tavola: «è il rosso del Piemonte che si beve subito — frutto e acidità, senza tannino da ammorbidire».","en":"Piedmont's most planted grape — long the everyday wine, while Nebbiolo was for feast days. The combination is unusual: very high acidity and low tannin, giving a juicy, easy red of black cherry, plum and violet. In oak it gains body and spice, as in Pomorosso, which changed the grape's reputation in the 1980s. At the table: «Piedmont's red to drink now — fruit and acidity, with no tannin to wait out»."},"t":"r","i":1,"q":[5,3,2],"c":{"pt":"Produtiva e fácil de amadurecer — amadurece antes do Nebbiolo e por isso ocupava historicamente as encostas piores, deixando as melhores para ele. A acidez mantém-se alta mesmo quando o açúcar sobe muito, o que é raro.","it":"Produttiva e facile da maturare — matura prima del Nebbiolo e per questo occupava storicamente i versanti peggiori, lasciando a lui i migliori. L'acidità resta alta anche quando lo zucchero sale molto, cosa rara.","en":"Productive and easy to ripen — it matures before Nebbiolo and so historically took the lesser slopes, leaving the best to it. Its acidity stays high even when sugar climbs, which is unusual."},"v":{"pt":"Dois estilos opostos. O tradicional: aço ou tonel grande, para beber jovem, frutado e vivo. O moderno, inaugurado pelo Pomorosso da Coppo em 1984: maturação longa em barrica francesa, que dá corpo, especiaria e baunilha, e que transformou a Barbera de vinho de mesa em vinho de guarda. A malolática é sempre feita — sem ela a acidez seria demais.","it":"Due stili opposti. Il tradizionale: acciaio o botte grande, da bere giovane, fruttato e vivo. Il moderno, inaugurato dal Pomorosso di Coppo nel 1984: lungo affinamento in barrique francese, che dà corpo, spezia e vaniglia, e che ha trasformato la Barbera da vino da tavola a vino da guardia. La malolattica si fa sempre — senza, l'acidità sarebbe eccessiva.","en":"Two opposite styles. The traditional: steel or large cask, to drink young, fruity and lively. The modern, launched by Coppo's Pomorosso in 1984: long ageing in French barriques, giving body, spice and vanilla, and turning Barbera from table wine into a wine for keeping. Malolactic is always done — without it the acidity would be too much."}},"dolcetto":{"n":"Dolcetto","a":["dolcetto"],"o":{"pt":"«Pequeno doce» pela uva, não pelo vinho: é seco e frutado.","it":"«Piccolo dolce» per l'uva, non per il vino: è secco e fruttato.","en":"«Little sweet one» for the grape, not the wine: it is dry."},"d":{"pt":"O nome significa «docinho» e engana muita gente: refere-se ao sabor da uva na vinha, não ao vinho, que é seco. Amadurece cedo e dá um tinto de cor violeta, fruta escura, amêndoa e tanino macio, com acidez baixa — o contrário do Nebbiolo, da mesma região. Na mesa: «apesar do nome, é seco. No Piemonte é o tinto do almoço, não o da garrafeira».","it":"Il nome significa «dolcetto» e inganna molti: si riferisce al sapore dell'uva in vigna, non al vino, che è secco. Matura presto e dà un rosso di colore viola, frutta scura, mandorla e tannino morbido, con acidità bassa — il contrario del Nebbiolo, della stessa zona. A tavola: «nonostante il nome, è secco. In Piemonte è il rosso del pranzo, non quello da cantina».","en":"The name means «little sweet one» and misleads many: it refers to the taste of the grape on the vine, not the wine, which is dry. Early-ripening, it gives a purple red of dark fruit, almond and soft tannin, with low acidity — the opposite of Nebbiolo, from the same hills. At the table: «despite the name, it is dry. In Piedmont it is the lunch red, not the cellar one»."},"t":"r","i":1,"q":[3,3,3],"c":{"pt":"Amadurece cedo, no início de setembro, bem antes do Nebbiolo — o que resolve um problema prático: colhe-se e vinifica-se o Dolcetto antes de a adega ficar ocupada com as uvas importantes. Mas é frágil na vinha e sofre com a chuva.","it":"Matura presto, a inizio settembre, ben prima del Nebbiolo — il che risolve un problema pratico: si vendemmia e si vinifica il Dolcetto prima che la cantina si riempia con le uve importanti. Ma è fragile in vigna e soffre la pioggia.","en":"It ripens early, in the first days of September, well before Nebbiolo — which solves a practical problem: Dolcetto is picked and vinified before the cellar fills with the important grapes. But it is fragile in the vineyard and suffers in rain."},"v":{"pt":"Maceração curta, de cinco a oito dias, e temperatura controlada: a uva tem muita antocianina (a molécula da cor) e extrair demais daria amargor da semente. Aço ou tonel grande, raramente barrica — é um vinho para beber dentro de dois ou três anos.","it":"Macerazione breve, cinque-otto giorni, e temperatura controllata: l'uva ha molta antocianina (la molecola del colore) ed estrarre troppo darebbe amaro dai vinaccioli. Acciaio o botte grande, raramente barrique — è un vino da bere entro due o tre anni.","en":"Short maceration, five to eight days, under controlled temperature: the grape is rich in anthocyanin (the colour molecule) and over-extraction would bring pip bitterness. Steel or large cask, rarely barrique — it is a wine to drink within two or three years."}},"corvina":{"n":"Corvina","a":["corvina"],"o":{"pt":"A base do Amarone: cereja, amêndoa e acidez alta.","it":"La base dell'Amarone: ciliegia, mandorla e acidità alta.","en":"The base of Amarone: cherry, almond and high acidity."},"d":{"pt":"A principal uva da Valpolicella. Cor média, tanino moderado e acidez alta — é justamente isso que permite secar a uva por cem dias sem que o vinho fique pesado. Dá cereja, amarena, amêndoa amarga e especiaria; depois do appassimento, fruta em compota e chocolate. Na mesa: «é ela que faz o Amarone: a acidez dela é o que segura toda aquela concentração».","it":"L'uva principale della Valpolicella. Colore medio, tannino moderato e acidità alta — ed è proprio questo che permette di appassire l'uva per cento giorni senza che il vino diventi pesante. Dà ciliegia, amarena, mandorla amara e spezia; dopo l'appassimento, frutta in confettura e cioccolato. A tavola: «è lei che fa l'Amarone: la sua acidità è ciò che regge tutta quella concentrazione».","en":"Valpolicella's principal grape. Medium colour, moderate tannin and high acidity — which is exactly what allows the fruit to dry for a hundred days without the wine turning heavy. Cherry, morello, bitter almond and spice; after appassimento, jammy fruit and chocolate. At the table: «she makes Amarone: her acidity is what holds all that concentration up»."},"t":"r","i":1,"q":[4,3,3],"c":{"pt":"Colhida cedo e à mão, cacho a cacho, escolhendo só os mais soltos — para o Amarone, o cacho precisa de ar entre as bagas, senão apodrece ao secar. Depois vêm 100 a 120 dias de appassimento em caixas, num galpão arejado, onde a uva perde 40% do peso em água.","it":"Vendemmiata presto e a mano, grappolo per grappolo, scegliendo solo i più spargoli — per l'Amarone il grappolo ha bisogno d'aria tra gli acini, altrimenti marcisce appassendo. Poi 100-120 giorni di appassimento in cassette, in un fruttaio arieggiato, dove l'uva perde il 40% del peso in acqua.","en":"Picked early and by hand, bunch by bunch, choosing only the loosest — for Amarone the bunch needs air between the berries, or it rots while drying. Then 100 to 120 days of appassimento in crates, in a ventilated loft, where the fruit loses 40% of its weight in water."},"v":{"pt":"A uva seca é prensada em janeiro ou fevereiro e fermenta lentamente, a frio, durante semanas — o açúcar é tanto que as leveduras custam a trabalhar. Para o Amarone, fermenta até ao fim e dá 15,5% de álcool; se a fermentação for parada antes, sobra açúcar e nasce o Recioto, doce. Depois, anos em madeira.","it":"L'uva appassita si pressa in gennaio o febbraio e fermenta lentamente, a freddo, per settimane — lo zucchero è tanto che i lieviti faticano. Per l'Amarone fermenta fino in fondo e dà 15,5% di alcol; se la fermentazione viene fermata prima, resta zucchero e nasce il Recioto, dolce. Poi, anni in legno.","en":"The dried fruit is pressed in January or February and ferments slowly, cool, over weeks — there is so much sugar that the yeasts struggle. For Amarone it ferments to dryness and reaches 15.5% alcohol; stop fermentation earlier and the leftover sugar gives Recioto, the sweet version. Then, years in wood."}},"corvinone":{"n":"Corvinone","a":["corvinone"],"o":{"pt":"Parece Corvina mas é outra uva: bago maior, mais corpo.","it":"Sembra Corvina ma è un'altra uva: acino più grande, più corpo.","en":"It looks like Corvina but is another grape: bigger berry, more body."},"d":{"pt":"Por séculos pensou-se que fosse um clone da Corvina; a análise genética provou que é uma variedade distinta. O bago é maior e seca melhor no appassimento, concentrando-se sem apodrecer. Dá mais corpo, cor e tanino que a Corvina, com fruta escura e especiaria. Na mesa: «é parente da Corvina, mas uva diferente — dá a parte mais carnuda do Amarone».","it":"Per secoli si è pensato fosse un clone della Corvina; l'analisi genetica ha dimostrato che è una varietà distinta. L'acino è più grande e appassisce meglio, concentrandosi senza marcire. Dà più corpo, colore e tannino della Corvina, con frutta scura e spezia. A tavola: «è parente della Corvina, ma uva diversa — dà la parte più carnosa dell'Amarone».","en":"For centuries it was thought a clone of Corvina; genetic analysis proved it a distinct variety. The berry is larger and dries better during appassimento, concentrating without rotting. It gives more body, colour and tannin than Corvina, with dark fruit and spice. At the table: «a relative of Corvina, but a different grape — it gives Amarone its fleshiest part»."},"t":"r","i":1,"q":[4,4,4],"c":{"pt":"O bago grande e a casca espessa secam melhor que os da Corvina: perdem água sem colar uns nos outros, o que reduz o risco de mofo durante os quatro meses de appassimento. Por isso ganhou espaço nos Amarone modernos.","it":"L'acino grande e la buccia spessa appassiscono meglio di quelli della Corvina: perdono acqua senza attaccarsi tra loro, riducendo il rischio di muffa nei quattro mesi di appassimento. Per questo ha guadagnato spazio negli Amarone moderni.","en":"The large berry and thick skin dry better than Corvina's: they lose water without sticking together, reducing mould risk over the four months of appassimento. Hence its growing role in modern Amarone."},"v":{"pt":"Vinifica-se junto com a Corvina, depois da secagem. Como a casca é mais grossa, cede mais cor e tanino: é a parte do blend que dá estrutura, enquanto a Corvina dá o perfume e a acidez.","it":"Si vinifica insieme alla Corvina, dopo l'appassimento. Poiché la buccia è più spessa, cede più colore e tannino: è la parte del blend che dà struttura, mentre la Corvina dà profumo e acidità.","en":"It is vinified together with Corvina after drying. With thicker skins it gives more colour and tannin: it is the part of the blend that provides structure, while Corvina provides perfume and acidity."}},"rondinella":{"n":"Rondinella","a":["rondinella"],"o":{"pt":"Cor e confiabilidade: a parceira discreta da Corvina.","it":"Colore e affidabilità: la compagna discreta della Corvina.","en":"Colour and reliability: Corvina's discreet partner."},"d":{"pt":"Uva do Vêneto, cultivada sempre ao lado da Corvina — o nome vem de «rondine», andorinha, pelas bagas de cor escura. Não tem grande personalidade aromática: o que traz é cor, produção segura e boa resistência ao appassimento. Fruta vermelha, amêndoa e um leve amargor. Na mesa: «entra em todo Valpolicella e Amarone, mas é a Corvina que dá o caráter».","it":"Uva del Veneto, coltivata sempre accanto alla Corvina — il nome viene da «rondine», per gli acini di colore scuro. Non ha grande personalità aromatica: porta colore, produzione sicura e buona resistenza all'appassimento. Frutta rossa, mandorla e un leggero amaro. A tavola: «entra in ogni Valpolicella e Amarone, ma è la Corvina a dare il carattere».","en":"A Veneto grape, always grown alongside Corvina — the name comes from «rondine», swallow, for its dark berries. It has little aromatic personality: what it brings is colour, reliable yields and good resistance to drying. Red fruit, almond and a light bitterness. At the table: «it is in every Valpolicella and Amarone, but Corvina gives the character»."},"t":"r","i":1,"q":[3,3,3],"c":{"pt":"Produtiva e confiável: amadurece sem drama e dá colheita certa todo ano, o que explica a sua presença constante ao lado da Corvina. Seca bem no appassimento e resiste ao mofo melhor que a maioria.","it":"Produttiva e affidabile: matura senza drammi e dà raccolto sicuro ogni anno, il che spiega la sua presenza costante accanto alla Corvina. Appassisce bene e resiste alla muffa meglio della maggior parte.","en":"Productive and reliable: it ripens without drama and crops dependably every year, which explains its constant presence beside Corvina. It dries well and resists mould better than most."},"v":{"pt":"Segue exatamente o mesmo caminho da Corvina — appassimento, prensagem no inverno, fermentação lenta e anos em madeira. Entra entre 5% e 30% do blend conforme o produtor e a safra.","it":"Segue esattamente lo stesso percorso della Corvina — appassimento, pressatura invernale, fermentazione lenta e anni in legno. Entra tra il 5% e il 30% del blend secondo il produttore e l'annata.","en":"It follows exactly the same path as Corvina — appassimento, winter pressing, slow fermentation and years in wood. It makes up between 5% and 30% of the blend depending on producer and vintage."}},"molinara":{"n":"Molinara","a":["molinara"],"o":{"pt":"Acidez e leveza; hoje opcional no Amarone.","it":"Acidità e leggerezza; oggi opzionale nell'Amarone.","en":"Acidity and lightness; today optional in Amarone."},"d":{"pt":"Uva veneta de casca clara, coberta por uma camada branca de levedura que lembra farinha — daí «molino», moinho. Dá pouca cor, acidez alta e especiaria, e torna o Amarone mais bebível. Deixou de ser obrigatória no disciplinare e hoje muitos produtores a abandonaram; quem a mantém, como a Masi, usa-a em pequena parte. Na mesa: «é a uva que dá frescor ao Amarone — poucos ainda a usam».","it":"Uva veneta dalla buccia chiara, coperta da uno strato bianco di lieviti che ricorda la farina — da qui «molino». Dà poco colore, acidità alta e spezia, e rende l'Amarone più bevibile. Non è più obbligatoria nel disciplinare e oggi molti l'hanno abbandonata; chi la mantiene, come Masi, la usa in piccola parte. A tavola: «è l'uva che dà freschezza all'Amarone — pochi la usano ancora».","en":"A Veneto grape with pale skin covered in a white bloom of yeast that recalls flour — hence «molino», mill. It gives little colour, high acidity and spice, and makes Amarone more drinkable. No longer mandatory in the appellation rules, many growers have dropped it; those who keep it, like Masi, use a small share. At the table: «the grape that keeps Amarone fresh — few still use it»."},"t":"r","i":1,"q":[5,2,2],"c":{"pt":"Produz muito e amadurece cedo, mas a casca clara e fina perde cor com facilidade e sofre no appassimento. Essa fragilidade é o motivo pelo qual deixou de ser obrigatória no disciplinare do Amarone e desapareceu de muitas adegas.","it":"Produce molto e matura presto, ma la buccia chiara e sottile perde colore con facilità e soffre nell'appassimento. Questa fragilità è il motivo per cui non è più obbligatoria nel disciplinare dell'Amarone ed è sparita da molte cantine.","en":"It crops heavily and ripens early, but its pale, thin skin loses colour easily and suffers during drying. That fragility is why it is no longer mandatory in the Amarone rules and has vanished from many cellars."},"v":{"pt":"Quando é usada, segue o mesmo appassimento das outras e entra em pequena proporção na fermentação conjunta. O que ela dá não é cor nem corpo, mas acidez e uma nota especiada que torna o Amarone menos pesado.","it":"Quando si usa, segue lo stesso appassimento delle altre ed entra in piccola proporzione nella fermentazione comune. Ciò che dà non è colore né corpo, ma acidità e una nota speziata che rende l'Amarone meno pesante.","en":"When used, it follows the same drying as the others and enters the shared fermentation in a small proportion. What it gives is neither colour nor body but acidity and a spiced note that keeps Amarone from feeling heavy."}},"oseleta":{"n":"Oseleta","a":["oseleta"],"o":{"pt":"Quase extinta e recuperada pela Masi: cor e tanino puros.","it":"Quasi estinta e recuperata da Masi: colore e tannino puri.","en":"Nearly extinct, recovered by Masi: pure colour and tannin."},"d":{"pt":"Uva veronesa de bago minúsculo, abandonada por produzir pouquíssimo e redescoberta pela Masi nos anos 1980. A relação casca/polpa é altíssima: dá cor densa, tanino concentrado e especiaria, mesmo em 5–8% do blend. O nome vem de «osèi», pássaros, que comiam as bagas. Na mesa: «é uma uva que tinha desaparecido do Vêneto; entra em pouca quantidade e dá a cor e o tanino».","it":"Uva veronese dall'acino minuscolo, abbandonata perché produce pochissimo e riscoperta da Masi negli anni Ottanta. Il rapporto buccia/polpa è altissimo: dà colore denso, tannino concentrato e spezia, anche al 5–8% del blend. Il nome viene da «osèi», uccelli, che ne mangiavano gli acini. A tavola: «è un'uva che era sparita dal Veneto; entra in piccola quantità e dà colore e tannino».","en":"A Veronese grape with tiny berries, abandoned for its minute yields and rediscovered by Masi in the 1980s. The skin-to-pulp ratio is very high: dense colour, concentrated tannin and spice, even at 5–8% of a blend. The name comes from «osèi», birds, which ate the berries. At the table: «a grape that had vanished from the Veneto; a small share, and it gives the colour and the tannin»."},"t":"r","i":1,"q":[4,5,5],"c":{"pt":"O bago é minúsculo e a produção é tão baixa que foi por isso que a abandonaram. Amadurece tarde e seca muito bem, concentrando-se sem apodrecer. A Masi recuperou-a de vinhas esquecidas nos anos 1980 e levou vinte anos a multiplicá-la.","it":"L'acino è minuscolo e la produzione così bassa che per questo l'avevano abbandonata. Matura tardi e appassisce molto bene, concentrandosi senza marcire. Masi l'ha recuperata da vigne dimenticate negli anni Ottanta e ci ha messo vent'anni a moltiplicarla.","en":"The berry is tiny and the yield so low that this is why it was abandoned. It ripens late and dries very well, concentrating without rotting. Masi recovered it from forgotten vineyards in the 1980s and took twenty years to propagate it."},"v":{"pt":"A relação casca/polpa altíssima significa que basta 5 a 10% do blend para mudar o vinho: dá cor quase negra e tanino concentrado. Fermenta junto com as outras depois do appassimento e amadurece em madeira pelos mesmos anos.","it":"Il rapporto buccia/polpa altissimo significa che basta il 5-10% del blend per cambiare il vino: dà colore quasi nero e tannino concentrato. Fermenta con le altre dopo l'appassimento e matura in legno per gli stessi anni.","en":"The very high skin-to-pulp ratio means 5 to 10% of the blend is enough to change the wine: near-black colour and concentrated tannin. It ferments with the others after drying and ages in wood for the same years."}},"lagrein":{"n":"Lagrein","a":["lagrein"],"o":{"pt":"Alto-atesina escura: amora, violeta, chocolate e tanino firme.","it":"Altoatesina scura: mora, viola, cioccolato e tannino saldo.","en":"A dark Alto Adige red: blackberry, violet, chocolate, firm tannin."},"d":{"pt":"Tinta autóctone do Alto Adige, parente do Syrah e do Teroldego. Cresce no fundo do vale, em solos de areia e cascalho, onde o calor permite madurar. Cor escura, amora, violeta, chocolate amargo e um tanino firme com final levemente amargo — a assinatura da uva. Na mesa: «é o tinto estruturado do Alto Adige, não o leve que se espera da montanha».","it":"Rossa autoctona dell'Alto Adige, parente del Syrah e del Teroldego. Cresce sul fondovalle, su suoli di sabbia e ghiaia, dove il calore permette la maturazione. Colore scuro, mora, viola, cioccolato amaro e un tannino saldo con finale leggermente amaro — la firma dell'uva. A tavola: «è il rosso strutturato dell'Alto Adige, non il leggero che si aspetta dalla montagna».","en":"A native red of Alto Adige, related to Syrah and Teroldego. It grows on the valley floor, on sand and gravel, where the heat lets it ripen. Dark colour, blackberry, violet, bitter chocolate and firm tannin with a faintly bitter finish — the grape's signature. At the table: «Alto Adige's structured red, not the light mountain wine you might expect»."},"t":"r","i":1,"q":[4,4,4],"c":{"pt":"Precisa de calor para amadurecer o tanino, e por isso só funciona no fundo do vale, em Bolzano, e não nas encostas altas do Alto Adige. Amadurece tarde, em outubro, em solos de cascalho que guardam o calor do dia.","it":"Ha bisogno di caldo per maturare il tannino, e per questo funziona solo sul fondovalle, a Bolzano, e non sui versanti alti dell'Alto Adige. Matura tardi, in ottobre, su suoli di ghiaia che trattengono il calore del giorno.","en":"It needs heat to ripen its tannin, which is why it works only on the valley floor around Bolzano, not on the high slopes of Alto Adige. It ripens late, in October, on gravel soils that hold the day's warmth."},"v":{"pt":"O tanino é naturalmente áspero e seco no final — o trabalho de adega consiste em domá-lo. Maceração controlada, malolática completa e envelhecimento em barrica, frequentemente com uma parte nova, que arredonda o amargor. Nas Riserva, dois anos ou mais.","it":"Il tannino è naturalmente ruvido e asciutto nel finale — il lavoro di cantina consiste nel domarlo. Macerazione controllata, malolattica completa e affinamento in barrique, spesso con una parte nuova, che arrotonda l'amaro. Nelle Riserva, due anni o più.","en":"The tannin is naturally rough and drying on the finish — the cellar's work is to tame it. Controlled maceration, full malolactic and barrel ageing, often with a share of new oak that rounds the bitterness. In the Riserva, two years or more."}},"montepulciano":{"n":"Montepulciano","a":["montepulciano"],"o":{"pt":"A uva do Abruzzo — não a cidade toscana do Vino Nobile.","it":"L'uva dell'Abruzzo — non la città toscana del Vino Nobile.","en":"The Abruzzo grape — not the Tuscan town of Vino Nobile."},"d":{"pt":"Cuidado com a confusão mais comum da carta: Montepulciano é uma uva do Abruzzo, e Montepulciano é também uma cidade da Toscana cujo vinho, o Vino Nobile, é feito de Sangiovese. Não têm relação. A uva dá cor densa, ameixa, cereja preta, especiaria e tanino macio com acidez média. Na mesa: «é a uva do Abruzzo; a cidade toscana com o mesmo nome faz vinho de Sangiovese».","it":"Attenzione alla confusione più comune: il Montepulciano è un'uva d'Abruzzo, e Montepulciano è anche una città toscana il cui vino, il Nobile, è di Sangiovese. Non c'entrano nulla. L'uva dà colore denso, prugna, ciliegia nera, spezia e tannino morbido con acidità media. A tavola: «è l'uva d'Abruzzo; la città toscana con lo stesso nome fa vino di Sangiovese».","en":"Beware the most common confusion: Montepulciano is a grape from Abruzzo, and Montepulciano is also a Tuscan town whose wine, Vino Nobile, is made of Sangiovese. They are unrelated. The grape gives dense colour, plum, black cherry, spice and soft tannin with medium acidity. At the table: «it is the Abruzzo grape; the Tuscan town of the same name makes its wine from Sangiovese»."},"t":"r","i":1,"q":[3,4,3],"c":{"pt":"Amadurece tarde, em outubro, e é muito produtiva: no Abruzzo a pergola tradicional sustenta uma grande carga de uva, e é por isso que a região produz tanto volume. Para o vinho sério, corta-se o rendimento pela metade ou menos.","it":"Matura tardi, in ottobre, ed è molto produttiva: in Abruzzo la pergola tradizionale sostiene un grande carico d'uva, ed è per questo che la regione produce tanto volume. Per il vino serio si dimezzano le rese o meno.","en":"It ripens late, in October, and crops heavily: in Abruzzo the traditional pergola carries a large load, which is why the region produces such volume. For serious wine, yields are halved or more."},"v":{"pt":"Maceração média a longa, com temperatura controlada para não extrair demais — a uva tem cor de sobra. A malolática suaviza a acidez média. Madeira grande nos estilos tradicionais, barrica nos modernos; a Riserva exige dois anos de envelhecimento.","it":"Macerazione media o lunga, con temperatura controllata per non estrarre troppo — l'uva ha colore in abbondanza. La malolattica ammorbidisce l'acidità media. Botte grande negli stili tradizionali, barrique nei moderni; la Riserva richiede due anni di affinamento.","en":"Medium to long maceration, with controlled temperature to avoid over-extraction — the grape has colour to spare. Malolactic softens the medium acidity. Large casks in traditional styles, barriques in modern ones; the Riserva requires two years of ageing."}},"nerodavola":{"n":"Nero d'Avola","a":["nero d'avola","nero d’avola"],"o":{"pt":"A grande tinta siciliana: cereja, especiaria e calor.","it":"La grande rossa siciliana: ciliegia, spezie e calore.","en":"Sicily's great red: cherry, spice and warmth."},"d":{"pt":"A tinta mais importante da Sicília, originária de Avola, perto de Siracusa. Resiste à seca e ao calor e, em vinhas de alberello e rendimentos baixos, dá vinhos sérios: cereja preta, ameixa, especiaria, alcaçuz e tanino médio, com acidez melhor do que o clima faria supor. Na mesa: «é a uva da Sicília — fruta madura e calor, mas sem perder o frescor quando bem feita».","it":"La rossa più importante della Sicilia, originaria di Avola, vicino a Siracusa. Resiste alla siccità e al caldo e, da vigne ad alberello e basse rese, dà vini seri: ciliegia nera, prugna, spezie, liquirizia e tannino medio, con acidità migliore di quanto il clima farebbe pensare. A tavola: «è l'uva della Sicilia — frutta matura e calore, ma senza perdere freschezza quando è ben fatta».","en":"Sicily's most important red, native to Avola near Syracuse. It resists drought and heat and, from bush vines at low yields, gives serious wines: black cherry, plum, spice, liquorice and medium tannin, with better acidity than the climate would suggest. At the table: «Sicily's grape — ripe fruit and warmth, but it keeps its freshness when well made»."},"t":"r","i":1,"q":[4,4,4],"c":{"pt":"Amadurece no fim de agosto ou setembro, e a colheita é de madrugada, por causa do calor. Nas vinhas de alberello de Noto, baixas e sem arame, os rendimentos são mínimos e as raízes vão fundo atrás da água — é daí que vem a concentração.","it":"Matura a fine agosto o a settembre, e la vendemmia è all'alba, per via del caldo. Nelle vigne ad alberello di Noto, basse e senza filo, le rese sono minime e le radici vanno in profondità in cerca d'acqua — da lì viene la concentrazione.","en":"It ripens in late August or September, and picking is at dawn because of the heat. In the bush-trained vineyards of Noto, low and wireless, yields are minimal and roots dig deep for water — that is where the concentration comes from."},"v":{"pt":"Maceração de duas semanas com temperatura controlada, porque o calor siciliano acelera tudo. O ponto crítico é não deixar o álcool subir demais: colhe-se antes do que o sol pediria. Madeira francesa de 12 a 18 meses nos vinhos sérios, barricas usadas em boa parte, para não cobrir a fruta.","it":"Macerazione di due settimane con temperatura controllata, perché il caldo siciliano accelera tutto. Il punto critico è non far salire troppo l'alcol: si vendemmia prima di quanto il sole chiederebbe. Legno francese per 12-18 mesi nei vini seri, barrique usate in buona parte, per non coprire il frutto.","en":"Two weeks of maceration under controlled temperature, since Sicilian heat speeds everything up. The critical point is not letting alcohol climb too high: picking happens earlier than the sun would suggest. French oak for 12 to 18 months in serious wines, much of it used, so as not to cover the fruit."}},"nerellomascalese":{"n":"Nerello Mascalese","a":["nerello mascalese"],"o":{"pt":"O «Nebbiolo do Etna»: claro, perfumado e mineral.","it":"Il «Nebbiolo dell'Etna»: chiaro, profumato e minerale.","en":"The «Nebbiolo of Etna»: pale, perfumed and mineral."},"d":{"pt":"Cresce nas encostas do Etna, em areia vulcânica e muitas vezes em vinhas pré-filoxéricas com mais de cem anos. Dá cor clara, tanino fino e acidez alta, com cereja, casca de laranja, erva seca, fumo e uma mineralidade de pedra queimada. Por isso é comparado ao Nebbiolo e ao Pinot Nero. Na mesa: «é o tinto do vulcão: parece leve na cor e é complexo na boca».","it":"Cresce sulle pendici dell'Etna, su sabbia vulcanica e spesso su vigne prefillosseriche di oltre cent'anni. Dà colore chiaro, tannino fine e acidità alta, con ciliegia, scorza d'arancia, erbe secche, fumo e una mineralità di pietra bruciata. Per questo si paragona al Nebbiolo e al Pinot Nero. A tavola: «è il rosso del vulcano: sembra leggero di colore ed è complesso in bocca».","en":"It grows on Etna's slopes, in volcanic sand and often on pre-phylloxera vines over a century old. Pale colour, fine tannin and high acidity, with cherry, orange peel, dried herbs, smoke and a scorched-stone minerality. Hence the comparisons with Nebbiolo and Pinot Noir. At the table: «the volcano's red: pale in the glass, complex in the mouth»."},"t":"r","i":1,"q":[5,2,4],"c":{"pt":"Última a ser colhida na Sicília — outubro ou mesmo novembro, nas vinhas altas do Etna. As vinhas mais velhas são pré-filoxéricas, com mais de cem anos, porque a areia vulcânica impede o inseto de se instalar. Cada contrada, cada altitude, amadurece num momento diferente.","it":"Ultima a essere vendemmiata in Sicilia — ottobre o addirittura novembre, nelle vigne alte dell'Etna. Le più vecchie sono prefillosseriche, oltre cent'anni, perché la sabbia vulcanica impedisce all'insetto di insediarsi. Ogni contrada, ogni altitudine, matura in un momento diverso.","en":"The last picked in Sicily — October or even November, on the high Etna vineyards. The oldest vines are pre-phylloxera, over a century old, because volcanic sand stops the insect from taking hold. Each contrada, each altitude, ripens at a different moment."},"v":{"pt":"Trabalha-se como um Pinot Nero: maceração delicada, extração suave, nada de barrica nova. Madeira grande e usada, de modo a não cobrir a transparência da uva. A casca é fina e dá pouca cor, mas o tanino é fino e abundante — a estrutura não se vê, sente-se.","it":"Si lavora come un Pinot Nero: macerazione delicata, estrazione soffice, nessuna barrique nuova. Legno grande e usato, per non coprire la trasparenza dell'uva. La buccia è fine e dà poco colore, ma il tannino è fine e abbondante — la struttura non si vede, si sente.","en":"It is handled like Pinot Noir: delicate maceration, gentle extraction, no new barriques. Large, used oak, so as not to cover the grape's transparency. The skin is thin and gives little colour, but the tannin is fine and plentiful — the structure is not seen, it is felt."}},"carignano":{"n":"Carignano","a":["carignano","carignan"],"o":{"pt":"Espanhola de origem; no Sulcis sardo dá tinto sério.","it":"Spagnola d'origine; nel Sulcis sardo dà un rosso serio.","en":"Spanish in origin; in Sardinian Sulcis it gives a serious red."},"d":{"pt":"Veio da Espanha (Cariñena) e por décadas foi a uva de maior volume do sul da França, plantada para render muito. No Sulcis, sudoeste da Sardenha, acontece o contrário: vinhas velhas em areia — onde a filoxera não pega — e rendimentos baixos dão um tinto de amora, maquis mediterrâneo, especiaria, tanino firme e acidez boa. Na mesa: «a mesma uva que na França fazia vinho de mesa, na Sardenha faz vinho de guarda».","it":"Viene dalla Spagna (Cariñena) e per decenni è stata l'uva da volume del sud della Francia, piantata per rendere molto. Nel Sulcis, sudovest della Sardegna, avviene il contrario: vigne vecchie su sabbia — dove la fillossera non attacca — e rese basse danno un rosso di mora, macchia mediterranea, spezie, tannino saldo e buona acidità. A tavola: «la stessa uva che in Francia faceva vino da tavola, in Sardegna fa vino da guardia».","en":"It came from Spain (Cariñena) and was for decades southern France's bulk grape, planted for volume. In Sulcis, south-west Sardinia, the opposite happens: old vines in sand — where phylloxera cannot take hold — and low yields give a red of blackberry, Mediterranean scrub, spice, firm tannin and good acidity. At the table: «the grape that made table wine in France makes a keeping wine in Sardinia»."},"t":"r","i":1,"q":[4,4,4],"c":{"pt":"Brota cedo e amadurece muito tarde, o que só funciona em lugares quentes e secos. No Sulcis cresce em areia pura à beira-mar, onde a filoxera não sobrevive — por isso há vinhas centenárias de pé franco, sem enxerto, que é coisa rara no mundo do vinho.","it":"Germoglia presto e matura molto tardi, il che funziona solo in luoghi caldi e asciutti. Nel Sulcis cresce su sabbia pura in riva al mare, dove la fillossera non sopravvive — per questo ci sono vigne centenarie a piede franco, senza innesto, cosa rara nel mondo del vino.","en":"It buds early and ripens very late, which only works in hot, dry places. In Sulcis it grows in pure sand by the sea, where phylloxera cannot survive —
