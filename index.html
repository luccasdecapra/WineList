const AROM=[{"comp":{"pt":"Polvo, batata, aipo, azeitonas Taggiasche, tomatinhos amarelos e vermelhos.","it":"Polpo, patate, sedano, olive taggiasche, pomodorini gialli e rossi.","en":"Octopus, potatoes, celery, Taggiasca olives, yellow and red cherry tomatoes.","es":"Pulpo, patatas, apio, aceitunas Taggiasca, tomates cherry amarillos y rojos."},"perfil":{"pt":"O polvo sugere um sabor marinho delicado, com doçura natural. A batata oferece uma base macia e neutra; o aipo traz frescor vegetal; as azeitonas acrescentam salinidade e notas frutadas; os tomates equilibram com acidez e doçura. O conjunto tende a ser mediterrâneo, fresco e de intensidade moderada.","it":"Il polpo offre un gusto marino delicato, con una naturale dolcezza. La patata crea una base morbida e neutra; il sedano aggiunge freschezza vegetale; le olive apportano sapidità e note fruttate; i pomodorini bilanciano con acidità e dolcezza. Il risultato è mediterraneo, fresco e di intensità moderata.","en":"The octopus brings a delicate marine character and natural sweetness. Potato provides a soft, neutral base; celery adds green freshness; olives contribute salinity and fruity notes; tomatoes balance the dish with acidity and sweetness. The overall impression is fresh, Mediterranean and moderately intense.","es":"El pulpo aporta un carácter marino delicado y un dulzor natural. La patata ofrece una base suave y neutra; el apio añade frescura vegetal; las aceitunas aportan salinidad y notas afrutadas; los tomates equilibran con acidez y dulzor. El conjunto resulta fresco, mediterráneo y de intensidad moderada."},"aroma":{"pt":"Notas marinhas suaves, vegetais frescas, tomate maduro e azeitona.","it":"Note marine delicate, sentori vegetali freschi, pomodoro maturo e oliva.","en":"Gentle sea notes, fresh green aromas, ripe tomato and olive.","es":"Notas marinas suaves, aromas vegetales frescos, tomate maduro y aceituna."},"textura":{"pt":"Contraste entre polvo firme e tenro, batata macia e elementos vegetais mais crocantes.","it":"Contrasto tra polpo tenero e consistente, patata morbida ed elementi vegetali più croccanti.","en":"A contrast of tender, springy octopus, soft potato and crisper vegetable elements.","es":"Contraste entre pulpo tierno y firme, patata suave y elementos vegetales más crujientes."},"apre":{"pt":"Uma entrada de inspiração mediterrânea, com polvo, batata, azeitonas Taggiasche e tomates coloridos. É uma combinação delicada, fresca e equilibrada entre notas marinhas, vegetais e levemente ácidas.","it":"Un antipasto d’ispirazione mediterranea con polpo, patate, olive taggiasche e pomodorini colorati. Una combinazione delicata e fresca, equilibrata tra note marine, vegetali e leggermente acidule.","en":"A Mediterranean-inspired starter with octopus, potatoes, Taggiasca olives and colourful cherry tomatoes. It is a delicate, fresh combination balancing marine, vegetal and gently tangy notes.","es":"Un entrante de inspiración mediterránea con pulpo, patatas, aceitunas Taggiasca y tomates cherry de colores. Una combinación delicada y fresca que equilibra notas marinas, vegetales y ligeramente ácidas."},"nota":"Azeitonas Taggiasche: pequenas azeitonas da Ligúria, descritas na ficha como doces e pouco amargas."},{"comp":{"pt":"Tartare de Fassona, cenoura, aipo, rabanete, pepino, mostarda e soja.","it":"Tartare di Fassona, carote, sedano, ravanello, cetriolo, senape e soia.","en":"Piedmontese Fassona beef tartare, carrots, celery, radish, cucumber, mustard and soy.","es":"Tartar de ternera Fassona del Piamonte, zanahoria, apio, rábano, pepino, mostaza y soja."},"perfil":{"pt":"A Fassona é descrita na ficha como uma carne piemontesa muito magra e de fibra fina. Em tartare, a carne crua cortada à faca oferece textura delicada e definida. Cenoura acrescenta doçura; pepino e aipo, frescor; rabanete, um toque vegetal mais vivo; mostarda, pungência; soja, salinidade e umami.","it":"La Fassona è descritta nella scheda come una carne piemontese molto magra e dalla fibra fine. Nella tartare, la carne cruda tagliata al coltello mantiene una consistenza delicata e definita. La carota aggiunge dolcezza; cetriolo e sedano freschezza; il ravanello una nota vegetale vivace; la senape carattere pungente; la soia sapidità e umami.","en":"The menu describes Fassona as a very lean Piedmontese beef with fine fibres. In tartare, hand-cut raw beef has a delicate, clearly defined texture. Carrot adds sweetness; cucumber and celery freshness; radish a lively vegetal bite; mustard pungency; soy saltiness and umami.","es":"La ficha describe la Fassona como una carne piamontesa muy magra y de fibra fina. En tartar, la carne cruda cortada a cuchillo conserva una textura delicada y definida. La zanahoria aporta dulzor; el pepino y el apio, frescura; el rábano, un toque vegetal vivo; la mostaza, intensidad; y la soja, salinidad y umami."},"aroma":{"pt":"Aromas de carne fresca e vegetais crus, com nota pungente de mostarda.","it":"Profumi di carne fresca e verdure crude, con una nota pungente di senape.","en":"Fresh beef and raw-vegetable aromas, with a pungent mustard note.","es":"Aromas de carne fresca y verduras crudas, con una nota intensa de mostaza."},"textura":{"pt":"Carne picada à faca, com fibra perceptível; vegetais crus acrescentam crocância.","it":"Carne tagliata al coltello, con fibra percepibile; le verdure crude aggiungono croccantezza.","en":"Knife-cut beef with a perceptible grain; raw vegetables add crunch.","es":"Carne cortada a cuchillo, con fibra perceptible; las verduras crudas aportan crujiente."},"apre":{"pt":"Nossa tartare é preparada com carne Fassona piemontesa crua, cortada à faca, acompanhada de vegetais frescos, mostarda e soja. É delicada na textura, com frescor vegetal e um final mais saboroso e salino.","it":"La nostra tartare è preparata con carne Fassona piemontese cruda, tagliata al coltello, accompagnata da verdure fresche, senape e soia. Ha una consistenza delicata, freschezza vegetale e un finale più saporito e sapido.","en":"Our tartare is made with raw Piedmontese Fassona beef, hand-cut and served with fresh vegetables, mustard and soy. It is delicate in texture, with fresh vegetal notes and a savoury, salty finish.","es":"Nuestro tartar se prepara con carne Fassona del Piamonte cruda y cortada a cuchillo, acompañada de verduras frescas, mostaza y soja. Tiene una textura delicada, notas vegetales frescas y un final sabroso y salino."},"nota":"A ficha explica que tartare é carne crua cortada à faca, não moída. A Fassona é uma raça bovina piemontesa."},{"comp":{"pt":"Vitela fatiada, molho tonnato e alcaparras.","it":"Vitello, salsa tonnata e capperi.","en":"Sliced veal with traditional tuna sauce and capers.","es":"Ternera en lonchas, salsa tonnata tradicional y alcaparras."},"perfil":{"pt":"A vitela tem perfil delicado e suave. O molho tonnato acrescenta cremosidade, salinidade e sabor marinho do atum e da anchova; as alcaparras trazem acidez e um toque salino que corta a riqueza do molho. O resultado é macio, envolvente e equilibrado entre carne e mar.","it":"Il vitello ha un profilo delicato e morbido. La salsa tonnata aggiunge cremosità, sapidità e note marine di tonno e acciuga; i capperi portano acidità e una nota salina che alleggerisce la ricchezza della salsa. Il risultato è morbido e avvolgente, in equilibrio tra carne e mare.","en":"Veal has a delicate, mild profile. The tonnato sauce adds creaminess, saltiness and marine notes from tuna and anchovy; capers bring acidity and a salty accent that cuts through the sauce’s richness. The result is soft and rounded, balancing land and sea.","es":"La ternera tiene un perfil delicado y suave. La salsa tonnata aporta cremosidad, salinidad y notas marinas de atún y anchoa; las alcaparras añaden acidez y un toque salino que aligera la riqueza de la salsa. El resultado es suave y envolvente, en equilibrio entre carne y mar."},"aroma":{"pt":"Aroma suave de vitela, com notas marinhas e salinas do molho.","it":"Profumo delicato di vitello, con note marine e sapide della salsa.","en":"Gentle veal aroma with marine and savoury notes from the sauce.","es":"Aroma suave de ternera, con notas marinas y sabrosas de la salsa."},"textura":{"pt":"Vitela tenra e fina; molho frio, liso e cremoso; alcaparras pontuam a textura.","it":"Vitello tenero e sottile; salsa fredda, liscia e cremosa; i capperi aggiungono piccoli contrasti.","en":"Thin, tender veal; a cool, smooth and creamy sauce; capers provide little textural accents.","es":"Ternera fina y tierna; salsa fría, lisa y cremosa; las alcaparras aportan pequeños contrastes."},"apre":{"pt":"Um clássico piemontês: fatias delicadas de vitela servidas com molho frio e cremoso de atum, anchova e alcaparras. É suave, mas com uma agradável profundidade marinha e um toque ácido.","it":"Un classico piemontese: fettine delicate di vitello servite con una salsa fredda e cremosa a base di tonno, acciughe e capperi. È delicato, ma con una piacevole profondità marina e una nota acidula.","en":"A Piedmontese classic: delicate slices of veal served with a cool, creamy sauce made with tuna, anchovies and capers. It is gentle yet has pleasant marine depth and a tangy note.","es":"Un clásico piamontés: finas lonchas de ternera con una salsa fría y cremosa de atún, anchoas y alcaparras. Es delicado, pero con una agradable profundidad marina y un toque ácido."},"nota":"A ficha define o molho tonnato como molho frio piemontês de atum, anchova, alcaparra e azeite, emulsionado."},{"comp":{"pt":"Salmão, beterraba, laranja, funcho, caviar e creme azedo.","it":"Salmone, barbabietola, arancia, finocchietto, caviale e panna acida.","en":"Marinated salmon, beetroot, orange, fennel, caviar and sour cream.","es":"Salmón marinado, remolacha, naranja, hinojo, caviar y crema agria."},"perfil":{"pt":"O salmão oferece gordura natural e sabor marinho; a beterraba acrescenta doçura terrosa; a laranja introduz acidez e perfume cítrico; o funcho, notas anisadas e frescas; o caviar, salinidade marinha; e o creme azedo, acidez láctea que equilibra a riqueza do peixe.","it":"Il salmone offre grassezza naturale e gusto marino; la barbabietola aggiunge dolcezza terrosa; l’arancia porta acidità e profumo agrumato; il finocchietto note fresche e anisate; il caviale sapidità marina; la panna acida un’acidità lattica che bilancia la ricchezza del pesce.","en":"Salmon brings natural richness and a marine flavour; beetroot adds earthy sweetness; orange contributes citrus aroma and acidity; fennel gives fresh anise-like notes; caviar adds marine salinity; sour cream provides lactic tang to balance the fish’s richness.","es":"El salmón aporta grasa natural y sabor marino; la remolacha añade dulzor terroso; la naranja aporta aroma cítrico y acidez; el hinojo ofrece notas frescas anisadas; el caviar añade salinidad marina; y la crema agria aporta acidez láctica para equilibrar la riqueza del pescado."},"aroma":{"pt":"Notas marinhas, cítricas, vegetais doces e um perfume fresco de funcho.","it":"Note marine e agrumate, sentori vegetali dolci e un profumo fresco di finocchietto.","en":"Marine and citrus notes, sweet vegetal hints and fresh fennel fragrance.","es":"Notas marinas y cítricas, matices vegetales dulces y el aroma fresco del hinojo."},"textura":{"pt":"Salmão macio; creme sedoso; beterraba e caviar acrescentam pequenas variações de textura.","it":"Salmone morbido; crema vellutata; barbabietola e caviale introducono piccoli contrasti.","en":"Soft salmon and silky cream, with small textural variations from beetroot and caviar.","es":"Salmón suave y crema sedosa, con pequeños contrastes de textura de la remolacha y el caviar."},"apre":{"pt":"Salmão marinado acompanhado de beterraba, laranja, funcho, caviar e creme azedo. O prato combina a riqueza do peixe com notas cítricas, frescas e uma delicada salinidade marinha.","it":"Salmone marinato accompagnato da barbabietola, arancia, finocchietto, caviale e panna acida. Il piatto unisce la ricchezza del pesce a note agrumate, fresche e a una delicata sapidità marina.","en":"Marinated salmon with beetroot, orange, fennel, caviar and sour cream. The dish combines the richness of the fish with fresh citrus notes and delicate marine salinity.","es":"Salmón marinado con remolacha, naranja, hinojo, caviar y crema agria. El plato combina la riqueza del pescado con notas cítricas, frescas y una delicada salinidad marina."},"nota":"A ficha lista caviar e creme azedo; confirme com a cozinha a espécie de caviar e a composição exata do creme."},{"comp":{"pt":"Alcachofra frita, hortelã, trufa negra e pecorino.","it":"Carciofo fritto, menta, tartufo nero e pecorino.","en":"Crispy fried artichoke, mint, black truffle and Pecorino cheese.","es":"Alcachofa frita, menta, trufa negra y queso pecorino."},"perfil":{"pt":"A alcachofra tem notas vegetais e um amargor elegante. A fritura sugere crocância e aromas tostados; a hortelã refresca; a trufa negra acrescenta perfume terroso e profundo; o pecorino oferece salinidade e intensidade láctea. É um prato aromático, com contraste entre crocante, vegetal, terroso e salino.","it":"Il carciofo presenta note vegetali e un’elegante sfumatura amarognola. La frittura suggerisce croccantezza e profumi tostati; la menta rinfresca; il tartufo nero aggiunge un profumo terroso e profondo; il pecorino dona sapidità e intensità lattica. Un piatto aromatico, tra croccantezza, vegetale, terra e sapidità.","en":"Artichoke has vegetal notes and an elegant hint of bitterness. Frying suggests crispness and toasted aromas; mint refreshes; black truffle adds deep earthy fragrance; Pecorino brings saltiness and dairy intensity. An aromatic dish balancing crisp, vegetal, earthy and savoury elements.","es":"La alcachofa presenta notas vegetales y un elegante matiz amargo. La fritura sugiere crujiente y aromas tostados; la menta refresca; la trufa negra aporta un perfume terroso y profundo; el pecorino añade salinidad e intensidad láctica. Un plato aromático que combina crujiente, vegetal, terroso y salino."},"aroma":{"pt":"Hortelã fresca, alcachofra frita, notas terrosas da trufa e queijo curado.","it":"Menta fresca, carciofo fritto, note terrose del tartufo e formaggio stagionato.","en":"Fresh mint, fried artichoke, earthy truffle and aged-cheese aromas.","es":"Menta fresca, alcachofa frita, notas terrosas de trufa y queso curado."},"textura":{"pt":"Exterior crocante e interior mais macio, segundo a técnica tradicional descrita na ficha; pecorino pode acrescentar textura granulosa.","it":"Esterno croccante e interno più morbido, secondo la tecnica tradizionale descritta nella scheda; il pecorino può aggiungere una consistenza granulosa.","en":"A crisp exterior and softer centre, following the traditional method described in the menu; Pecorino may add a granular texture.","es":"Exterior crujiente e interior más tierno, según la técnica tradicional descrita en la ficha; el pecorino puede aportar una textura granulosa."},"apre":{"pt":"Uma preparação tradicional romana: alcachofra frita com hortelã, trufa negra e pecorino. É aromática, com exterior crocante, notas vegetais e um final terroso e salino.","it":"Una preparazione della tradizione romano-giudaica: carciofo fritto con menta, tartufo nero e pecorino. È aromatico, con esterno croccante, note vegetali e un finale terroso e sapido.","en":"A traditional Roman-Jewish preparation: fried artichoke with mint, black truffle and Pecorino. It is aromatic, with a crisp exterior, vegetal notes and an earthy, savoury finish.","es":"Una preparación tradicional romano-judía: alcachofa frita con menta, trufa negra y pecorino. Es aromática, con exterior crujiente, notas vegetales y un final terroso y sabroso."},"nota":"A ficha descreve a tradição da alcachofra frita inteira, duas vezes. Confirme se a execução atual segue exatamente essa técnica."},{"comp":{"pt":"Mix de folhas, ovos de codorna, vagem, anchovas, tomatinhos, batata, citronette e atum em azeite.","it":"Misticanza, uova di quaglia, fagiolini, acciughe, pomodorini, patate, citronette e tonno sott’olio.","en":"Mixed salad leaves, quail eggs, green beans, anchovies, cherry tomatoes, potatoes, citronette and tuna in olive oil.","es":"Mezcla de hojas, huevos de codorniz, judías verdes, anchoas, tomates cherry, patatas, citronette y atún en aceite de oliva."},"perfil":{"pt":"Salada de perfil mediterrâneo e salino. Atum e anchovas trazem sabor marinho e umami; ovo e batata suavizam; vagem e folhas dão frescor; tomate oferece doçura e acidez. A citronette — limão, azeite extravirgem e sal, segundo a ficha — ilumina o conjunto.","it":"Insalata dal profilo mediterraneo e sapido. Tonno e acciughe apportano gusto marino e umami; uova e patate ammorbidiscono; fagiolini e foglie danno freschezza; il pomodoro offre dolcezza e acidità. La citronette — limone, olio extravergine e sale, secondo la scheda — ravviva l’insieme.","en":"A Mediterranean, savoury salad. Tuna and anchovies bring marine flavour and umami; egg and potato soften the profile; green beans and leaves add freshness; tomato contributes sweetness and acidity. The citronette—lemon, extra-virgin olive oil and salt according to the menu—brightens the whole dish.","es":"Una ensalada mediterránea y sabrosa. El atún y las anchoas aportan sabor marino y umami; el huevo y la patata suavizan el conjunto; las judías y las hojas dan frescura; el tomate aporta dulzor y acidez. La citronette —limón, aceite de oliva virgen extra y sal, según la ficha— aporta viveza."},"aroma":{"pt":"Aromas verdes das folhas, notas marinhas de atum e anchova e perfume cítrico de limão.","it":"Profumi verdi delle foglie, note marine di tonno e acciuga e sentore agrumato di limone.","en":"Green leafy aromas, marine tuna and anchovy notes, and a citrus hint of lemon.","es":"Aromas verdes de las hojas, notas marinas de atún y anchoa y un toque cítrico de limón."},"textura":{"pt":"Folhas e vagem frescas; batata macia; ovo cremoso; diferentes elementos criam mordidas variadas.","it":"Foglie e fagiolini freschi; patata morbida; uovo cremoso; diversi elementi creano consistenze variate.","en":"Fresh leaves and beans, soft potato and creamy egg create varied textures.","es":"Hojas y judías frescas, patata suave y huevo cremoso crean distintas texturas."},"apre":{"pt":"Uma salada mediterrânea completa, com atum, anchovas, ovos de codorna, batata e vagem. A citronette de limão dá frescor e equilibra as notas salinas do peixe.","it":"Un’insalata mediterranea completa, con tonno, acciughe, uova di quaglia, patate e fagiolini. La citronette al limone dona freschezza e bilancia le note sapide del pesce.","en":"A complete Mediterranean salad with tuna, anchovies, quail eggs, potatoes and green beans. Lemon citronette adds freshness and balances the fish’s savoury notes.","es":"Una ensalada mediterránea completa con atún, anchoas, huevos de codorniz, patatas y judías verdes. La citronette de limón aporta frescura y equilibra las notas salinas del pescado."},"nota":"Citronette: limão, azeite extravirgem e sal. Misticanza: mistura de folhas jovens com perfis doces, amargos e picantes."},{"comp":{"pt":"Alface romana, camarão-rei, anchova, Parmigiano Reggiano, croutons e molho Caesar.","it":"Lattuga romana, mazzancolla, acciuga, Parmigiano Reggiano, crostini e salsa Caesar.","en":"Romaine lettuce, king prawns, anchovies, Parmigiano Reggiano, croutons and Caesar dressing.","es":"Lechuga romana, langostinos, anchoas, Parmigiano Reggiano, picatostes y salsa César."},"perfil":{"pt":"O camarão traz doçura marinha; Parmigiano e anchova acrescentam salinidade e umami; o molho Caesar une os sabores numa emulsão cremosa; alface refresca e croutons oferecem notas tostadas. O resultado é rico, crocante e saboroso.","it":"Il gambero apporta dolcezza marina; Parmigiano e acciuga aggiungono sapidità e umami; la salsa Caesar lega i sapori in un’emulsione cremosa; la lattuga rinfresca e i crostini offrono note tostate. Il risultato è ricco, croccante e saporito.","en":"Prawns bring marine sweetness; Parmigiano and anchovy add saltiness and umami; Caesar dressing binds the flavours in a creamy emulsion; lettuce refreshes and croutons add toasted notes. The result is rich, crunchy and savoury.","es":"Los langostinos aportan dulzor marino; el Parmigiano y la anchoa añaden salinidad y umami; la salsa César une los sabores en una emulsión cremosa; la lechuga refresca y los picatostes aportan notas tostadas. El resultado es rico, crujiente y sabroso."},"aroma":{"pt":"Aroma fresco de alface, camarão delicado, queijo curado, alho e anchova no molho.","it":"Profumo fresco di lattuga, gambero delicato, formaggio stagionato, aglio e acciuga nella salsa.","en":"Fresh lettuce and delicate prawn aromas, with aged cheese, garlic and anchovy in the dressing.","es":"Aroma fresco de lechuga y langostino delicado, con queso curado, ajo y anchoa en la salsa."},"textura":{"pt":"Folhas crocantes, camarão firme e tenro, molho cremoso e croutons secos e crocantes.","it":"Foglie croccanti, gambero sodo e tenero, salsa cremosa e crostini asciutti e croccanti.","en":"Crisp leaves, firm-tender prawns, creamy dressing and dry, crunchy croutons.","es":"Hojas crujientes, langostinos firmes y tiernos, salsa cremosa y picatostes secos y crujientes."},"apre":{"pt":"Uma Caesar com camarão-rei, Parmigiano, croutons e molho à base de anchova, alho, limão e gema. É cremosa e crocante, com sabor marinho e umami.","it":"Una Caesar con mazzancolle, Parmigiano, crostini e salsa a base di acciuga, aglio, limone e tuorlo. È cremosa e croccante, con note marine e umami.","en":"A Caesar salad with king prawns, Parmigiano, croutons and a dressing based on anchovy, garlic, lemon and egg yolk. Creamy and crunchy, with marine flavour and umami.","es":"Una ensalada César con langostinos, Parmigiano, picatostes y una salsa a base de anchoa, ajo, limón y yema. Es cremosa y crujiente, con sabor marino y umami."},"nota":"A ficha informa que a anchova está presente no molho Caesar mesmo sem aparecer visualmente."},{"comp":{"pt":"Mix de folhas, manga, abacate, frango marinado na páprica doce, castanha de caju e vinagrete de maracujá e limão.","it":"Misticanza, mango, avocado, pollo marinato alla paprika dolce, anacardi, vinaigrette al frutto della passione e lime.","en":"Mixed salad leaves, mango, avocado, sweet-paprika-marinated chicken, cashews, passion-fruit and lime vinaigrette.","es":"Mezcla de hojas, mango, aguacate, pollo marinado con pimentón dulce, anacardos y vinagreta de maracuyá y lima."},"perfil":{"pt":"Manga oferece doçura tropical; maracujá e limão contrapõem com acidez perfumada; abacate acrescenta cremosidade; frango é a base proteica suave, com páprica doce aromática; castanha de caju traz gordura e crocância. Perfil agridoce, fresco e tropical.","it":"Il mango offre dolcezza tropicale; frutto della passione e lime rispondono con acidità profumata; l’avocado aggiunge cremosità; il pollo è una base proteica delicata, aromatizzata dalla paprika dolce; gli anacardi apportano grasso e croccantezza. Profilo agrodolce, fresco e tropicale.","en":"Mango provides tropical sweetness; passion fruit and lime counter it with fragrant acidity; avocado adds creaminess; chicken is a mild protein base, scented with sweet paprika; cashews bring richness and crunch. A fresh, tropical sweet-and-sour profile.","es":"El mango aporta dulzor tropical; el maracuyá y la lima lo equilibran con acidez aromática; el aguacate añade cremosidad; el pollo ofrece una base proteica suave, perfumada con pimentón dulce; los anacardos aportan grasa y crujiente. Perfil agridulce, fresco y tropical."},"aroma":{"pt":"Fragrância tropical de manga e maracujá, notas cítricas e toque suave de páprica.","it":"Profumo tropicale di mango e frutto della passione, note agrumate e un tocco delicato di paprika.","en":"Tropical mango and passion-fruit fragrance, citrus notes and a gentle hint of paprika.","es":"Fragancia tropical de mango y maracuyá, notas cítricas y un toque suave de pimentón."},"textura":{"pt":"Abacate macio, frango tenro, folhas frescas e castanha crocante.","it":"Avocado morbido, pollo tenero, foglie fresche e anacardi croccanti.","en":"Soft avocado, tender chicken, fresh leaves and crunchy cashews.","es":"Aguacate suave, pollo tierno, hojas frescas y anacardos crujientes."},"apre":{"pt":"Uma salada tropical com manga, abacate e frango à páprica doce, finalizada com vinagrete de maracujá e limão. Combina doçura frutada, acidez cítrica e crocância de castanha.","it":"Un’insalata tropicale con mango, avocado e pollo alla paprika dolce, completata da una vinaigrette al frutto della passione e lime. Unisce dolcezza fruttata, acidità agrumata e croccantezza degli anacardi.","en":"A tropical salad with mango, avocado and sweet-paprika chicken, finished with passion-fruit and lime vinaigrette. It combines fruity sweetness, citrus acidity and cashew crunch.","es":"Una ensalada tropical con mango, aguacate y pollo al pimentón dulce, terminada con vinagreta de maracuyá y lima. Combina dulzor frutal, acidez cítrica y crujiente de anacardo."},"nota":"A ficha descreve páprica doce e vinagrete de maracujá e lima; confirme a composição da marinada para questões de alergia."},{"comp":{"pt":"Abacate, tofu, pepino, maçã verde, amêndoas, guacamole e mix de folhas.","it":"Avocado, tofu, cetriolo, mela verde, mandorle, guacamole e misticanza.","en":"Avocado, tofu, cucumber, green apple, almonds, guacamole and mixed salad leaves.","es":"Aguacate, tofu, pepino, manzana verde, almendras, guacamole y mezcla de hojas."},"perfil":{"pt":"O abacate e o guacamole dão corpo cremoso; tofu tem perfil suave; pepino refresca; maçã verde acrescenta acidez e crocância; amêndoas trazem notas tostadas. A mistura de folhas acrescenta variação vegetal. É um perfil fresco, verde e cremoso.","it":"Avocado e guacamole danno una consistenza cremosa; il tofu ha un profilo delicato; il cetriolo rinfresca; la mela verde aggiunge acidità e croccantezza; le mandorle portano note tostate. La misticanza aggiunge varietà vegetale. Profilo fresco, verde e cremoso.","en":"Avocado and guacamole create a creamy body; tofu has a mild profile; cucumber refreshes; green apple adds acidity and crunch; almonds bring toasted notes. Mixed leaves add vegetal variety. A fresh, green and creamy profile.","es":"El aguacate y el guacamole aportan cuerpo cremoso; el tofu tiene un perfil suave; el pepino refresca; la manzana verde añade acidez y crujiente; las almendras aportan notas tostadas. Las hojas añaden variedad vegetal. Perfil fresco, verde y cremoso."},"aroma":{"pt":"Aromas verdes e frescos, com notas suaves de amêndoa.","it":"Profumi verdi e freschi, con delicate note di mandorla.","en":"Fresh green aromas with gentle almond notes.","es":"Aromas verdes y frescos, con delicadas notas de almendra."},"textura":{"pt":"Abacate e guacamole aveludados; pepino e folhas frescos; maçã e amêndoas crocantes.","it":"Avocado e guacamole vellutati; cetriolo e foglie freschi; mela e mandorle croccanti.","en":"Velvety avocado and guacamole; fresh cucumber and leaves; crisp apple and almonds.","es":"Aguacate y guacamole aterciopelados; pepino y hojas frescos; manzana y almendras crujientes."},"apre":{"pt":"Uma salada de perfil vegetal com abacate, tofu, pepino, maçã verde, amêndoas e guacamole. É fresca e cremosa, com um contraste crocante da maçã e das amêndoas.","it":"Un’insalata dal profilo vegetale con avocado, tofu, cetriolo, mela verde, mandorle e guacamole. È fresca e cremosa, con un contrasto croccante dato da mela e mandorle.","en":"A vegetable-forward salad with avocado, tofu, cucumber, green apple, almonds and guacamole. It is fresh and creamy, with a crisp contrast from the apple and almonds.","es":"Una ensalada de perfil vegetal con aguacate, tofu, pepino, manzana verde, almendras y guacamole. Es fresca y cremosa, con un contraste crujiente de manzana y almendras."},"nota":"A ficha descreve guacamole frio, sem picância, preparado com abacate, limão, sal e cebola."},{"comp":{"pt":"Presunto cru San Daniele, burrata, melão cantalupo, rúcula, pane guttiau, avelãs e molho ponzu.","it":"Prosciutto crudo San Daniele, burrata, melone cantalupo, rucola, pane guttiau, nocciole e salsa ponzu.","en":"San Daniele Parma ham, burrata, cantaloupe melon, rocket, pane guttiau, hazelnuts and ponzu sauce.","es":"Jamón curado San Daniele, burrata, melón cantalupo, rúcula, pane guttiau, avellanas y salsa ponzu."},"perfil":{"pt":"Presunto curado traz salinidade e notas de cura; burrata envolve com cremosidade láctea; melão oferece doçura fresca; rúcula acrescenta amargor e picância; avelãs, notas tostadas; pane guttiau, crocância; ponzu, acidez cítrica e salinidade de soja. Um jogo agridoce e rico em contrastes.","it":"Il prosciutto crudo porta sapidità e note di stagionatura; la burrata avvolge con cremosità lattica; il melone offre dolcezza fresca; la rucola aggiunge amaro e una lieve piccantezza; le nocciole note tostate; il pane guttiau croccantezza; il ponzu acidità agrumata e sapidità di soia. Un gioco agrodolce e ricco di contrasti.","en":"Cured ham brings saltiness and curing notes; burrata adds milky creaminess; melon offers fresh sweetness; rocket contributes bitterness and pepperiness; hazelnuts bring toastiness; pane guttiau crunch; ponzu citrus acidity and soy salinity. A sweet-savoury combination full of contrasts.","es":"El jamón curado aporta salinidad y notas de curación; la burrata, cremosidad láctica; el melón, dulzor fresco; la rúcula, amargor y un toque picante; las avellanas, notas tostadas; el pane guttiau, crujiente; y el ponzu, acidez cítrica y salinidad de soja. Una combinación agridulce y llena de contrastes."},"aroma":{"pt":"Notas de presunto curado, melão maduro, rúcula fresca e cítricos do ponzu.","it":"Note di prosciutto stagionato, melone maturo, rucola fresca e agrumi del ponzu.","en":"Cured-ham notes, ripe melon, fresh rocket and citrus from the ponzu.","es":"Notas de jamón curado, melón maduro, rúcula fresca y cítricos del ponzu."},"textura":{"pt":"Burrata cremosa, melão macio, folhas frescas, pane crocante e avelãs firmes.","it":"Burrata cremosa, melone morbido, foglie fresche, pane croccante e nocciole consistenti.","en":"Creamy burrata, soft melon, fresh leaves, crisp bread and firm hazelnuts.","es":"Burrata cremosa, melón suave, hojas frescas, pan crujiente y avellanas firmes."},"apre":{"pt":"Uma salada de contrastes: San Daniele, burrata cremosa e melão doce, com rúcula, avelãs crocantes e molho ponzu cítrico. O resultado combina notas salinas, lácteas, frutadas e frescas.","it":"Un’insalata di contrasti: San Daniele, burrata cremosa e melone dolce, con rucola, nocciole croccanti e salsa ponzu agrumata. Il risultato unisce note sapide, lattiche, fruttate e fresche.","en":"A salad of contrasts: San Daniele ham, creamy burrata and sweet melon, with rocket, crunchy hazelnuts and citrusy ponzu. It combines savoury, milky, fruity and fresh notes.","es":"Una ensalada de contrastes: San Daniele, burrata cremosa y melón dulce, con rúcula, avellanas crujientes y salsa ponzu cítrica. Combina notas salinas, lácteas, frutales y frescas."},"nota":"A ficha explica ponzu como molho japonês cítrico com shoyu; pane guttiau como pão carasau sardo tostado; burrata com recheio de stracciatella. A ficha também lista avelãs nos ingredientes."},{"comp":{"pt":"Risoto de açafrão, óleo de salsinha, fundo escuro e limão.","it":"Risotto allo zafferano, olio al prezzemolo, fondo bruno e limone.","en":"Saffron risotto, parsley oil, veal jus and lemon.","es":"Risotto al azafrán, aceite de perejil, fondo oscuro de ternera y limón."},"perfil":{"pt":"O açafrão perfuma com notas florais, quentes e delicadamente terrosas. O fundo escuro de vitela dá profundidade, concentração e umami; o óleo de salsinha acrescenta frescor herbáceo; o limão introduz acidez que ilumina a cremosidade do risoto. Perfil rico, aromático e equilibrado.","it":"Lo zafferano profuma con note floreali, calde e delicatamente terrose. Il fondo bruno di vitello dona profondità, concentrazione e umami; l’olio al prezzemolo aggiunge freschezza erbacea; il limone introduce acidità che illumina la cremosità del risotto. Profilo ricco, aromatico ed equilibrato.","en":"Saffron lends warm, floral and gently earthy aromas. Veal jus brings depth, concentration and umami; parsley oil adds herbal freshness; lemon introduces acidity that brightens the risotto’s creaminess. A rich, aromatic and balanced profile.","es":"El azafrán aporta aromas cálidos, florales y ligeramente terrosos. El fondo oscuro de ternera da profundidad, concentración y umami; el aceite de perejil añade frescura herbácea; el limón aporta acidez que ilumina la cremosidad del risotto. Perfil rico, aromático y equilibrado."},"aroma":{"pt":"Perfume característico de açafrão, notas tostadas e profundas de vitela e final herbáceo-cítrico.","it":"Profumo caratteristico di zafferano, note tostate e profonde di vitello e finale erbaceo-agrumato.","en":"Distinctive saffron fragrance, deep toasted veal notes and an herbal-citrus finish.","es":"Perfume característico de azafrán, notas tostadas y profundas de ternera y final herbáceo-cítrico."},"textura":{"pt":"Grãos de arroz cremosos, com sensação envolvente; o fundo reduzido dá densidade ao sabor.","it":"Chicchi di riso cremosi e avvolgenti; il fondo ridotto dà densità al gusto.","en":"Creamy, enveloping rice grains; the reduced jus gives depth and density to the flavour.","es":"Granos de arroz cremosos y envolventes; el fondo reducido aporta densidad al sabor."},"apre":{"pt":"Um risoto de açafrão com óleo de salsinha, fundo escuro de vitela e limão. É cremoso e perfumado, com profundidade de carne e um toque cítrico que traz equilíbrio.","it":"Un risotto allo zafferano con olio al prezzemolo, fondo bruno di vitello e limone. È cremoso e profumato, con profondità di carne e una nota agrumata che dona equilibrio.","en":"A saffron risotto with parsley oil, veal jus and lemon. It is creamy and fragrant, with savoury depth from the veal and a citrus note that brings balance.","es":"Un risotto al azafrán con aceite de perejil, fondo oscuro de ternera y limón. Es cremoso y aromático, con profundidad cárnica y un toque cítrico que aporta equilibrio."},"nota":"A ficha define o fundo escuro como ossos de vitela tostados com legumes, cozidos por horas e reduzidos; o açafrão é o estigma da flor do croco."},{"comp":{"pt":"Tagliolino fresco, manteiga ácida (beurre blanc), lima, cebolinha e caviar Calvisius.","it":"Tagliolino fresco, burro acido (beurre blanc), lime, erba cipollina e caviale Calvisius.","en":"Fresh tagliolini, beurre blanc, lime, chives and Calvisius caviar.","es":"Tagliolini fresco, mantequilla ácida (beurre blanc), lima, cebollino y caviar Calvisius."},"perfil":{"pt":"Massa fresca de sabor delicado recebe um molho de manteiga cremoso, mas com acidez da redução de vinho branco e chalota. A lima acrescenta brilho cítrico; a cebolinha, frescor vegetal; o caviar, salinidade e intensidade marinha. A acidez evita que a manteiga encubra o caviar.","it":"La pasta fresca dal gusto delicato incontra una salsa al burro cremosa, ma resa fresca dall’acidità della riduzione di vino bianco e scalogno. Il lime aggiunge brillantezza agrumata; l’erba cipollina freschezza vegetale; il caviale sapidità e intensità marina. L’acidità evita che il burro copra il caviale.","en":"Delicate fresh pasta meets a buttery, creamy sauce lifted by the acidity of white-wine and shallot reduction. Lime adds citrus brightness, chives green freshness, and caviar marine salinity and intensity. The acidity keeps the butter from masking the caviar.","es":"La pasta fresca y delicada se combina con una salsa cremosa de mantequilla, equilibrada por la acidez de la reducción de vino blanco y chalota. La lima aporta brillo cítrico; el cebollino, frescura vegetal; y el caviar, salinidad e intensidad marina. La acidez evita que la mantequilla oculte el caviar."},"aroma":{"pt":"Notas lácteas e amanteigadas, cítrico fresco de lima e perfume verde da cebolinha, com toque marinho do caviar.","it":"Note lattiche e burrose, agrume fresco del lime e profumo verde dell’erba cipollina, con un tocco marino del caviale.","en":"Milky, buttery notes, fresh lime citrus and green chive fragrance, with a marine hint from the caviar.","es":"Notas lácteas y mantecosas, cítrico fresco de lima y aroma verde del cebollino, con un toque marino del caviar."},"textura":{"pt":"Massa fresca macia, molho sedoso e pequenas esferas de caviar que acrescentam uma sensação delicada.","it":"Pasta fresca morbida, salsa setosa e piccole perle di caviale che aggiungono una sensazione delicata.","en":"Soft fresh pasta, silky sauce and small caviar pearls that add a delicate pop.","es":"Pasta fresca suave, salsa sedosa y pequeñas perlas de caviar que aportan un delicado estallido."},"apre":{"pt":"Tagliolino fresco com beurre blanc, lima, cebolinha e caviar Calvisius. É delicado e cremoso, mas a acidez cítrica mantém o conjunto leve e deixa aparecer a salinidade do caviar.","it":"Tagliolino fresco con beurre blanc, lime, erba cipollina e caviale Calvisius. È delicato e cremoso, ma l’acidità agrumata mantiene l’insieme fresco e lascia emergere la sapidità del caviale.","en":"Fresh tagliolini with beurre blanc, lime, chives and Calvisius caviar. Delicate and creamy, with citrus acidity keeping the dish lively and allowing the caviar’s salinity to shine.","es":"Tagliolini fresco con beurre blanc, lima, cebollino y caviar Calvisius. Es delicado y cremoso, pero la acidez cítrica mantiene el conjunto fresco y deja destacar la salinidad del caviar."},"nota":"A ficha explica beurre blanc como manteiga montada sobre redução de vinho branco e chalota; caviar Calvisius produzido em Calvisano, perto de Brescia."},{"comp":{"pt":"Ravioli del plin, abobrinha, flores de abobrinha, molho de Parmigiano e trufa negra.","it":"Ravioli del plin, zucchine, fiori di zucca, salsa al Parmigiano e tartufo nero.","en":"Traditional Piedmontese plin ravioli, zucchini, zucchini flowers, Parmesan sauce and black truffle.","es":"Ravioli del plin tradicionales del Piamonte, calabacín, flores de calabacín, salsa de Parmigiano y trufa negra."},"perfil":{"pt":"A massa recheada oferece uma base macia; abobrinha e flores de abobrinha trazem notas vegetais delicadas; o molho de Parmigiano é salino, lácteo e envolvente; a trufa negra acrescenta perfume terroso e profundo. O conjunto combina delicadeza vegetal com riqueza de queijo e aroma de trufa.","it":"La pasta ripiena offre una base morbida; zucchine e fiori di zucca portano note vegetali delicate; la salsa al Parmigiano è sapida, lattica e avvolgente; il tartufo nero aggiunge un profumo terroso e profondo. L’insieme unisce delicatezza vegetale, ricchezza del formaggio e aroma di tartufo.","en":"The filled pasta provides a soft base; zucchini and its flowers bring delicate vegetal notes; the Parmigiano sauce is savoury, milky and enveloping; black truffle adds deep earthy fragrance. The dish combines gentle vegetables with cheese richness and truffle aroma.","es":"La pasta rellena ofrece una base suave; el calabacín y sus flores aportan notas vegetales delicadas; la salsa de Parmigiano es sabrosa, láctica y envolvente; la trufa negra añade un perfume terroso y profundo. El conjunto combina delicadeza vegetal, riqueza del queso y aroma de trufa."},"aroma":{"pt":"Aroma de queijo curado e trufa, com notas vegetais suaves de abobrinha e flor.","it":"Profumo di formaggio stagionato e tartufo, con delicate note vegetali di zucchina e fiore.","en":"Aged-cheese and truffle fragrance, with gentle zucchini and blossom notes.","es":"Aroma de queso curado y trufa, con suaves notas vegetales de calabacín y flor."},"textura":{"pt":"Massa macia e recheada, molho cremoso e textura vegetal delicada.","it":"Pasta morbida e ripiena, salsa cremosa e consistenza vegetale delicata.","en":"Soft filled pasta, creamy sauce and delicate vegetable texture.","es":"Pasta rellena y suave, salsa cremosa y textura vegetal delicada."},"apre":{"pt":"Ravioli piemonteses del plin com abobrinha, flores de abobrinha, molho cremoso de Parmigiano e trufa negra. É um prato delicado na base, mas aromático e envolvente no final.","it":"Ravioli piemontesi del plin con zucchine, fiori di zucca, salsa cremosa al Parmigiano e tartufo nero. È delicato alla base, ma aromatico e avvolgente nel finale.","en":"Piedmontese plin ravioli with zucchini, zucchini flowers, creamy Parmigiano sauce and black truffle. Delicate at its base, yet aromatic and rounded on the finish.","es":"Ravioli del plin del Piamonte con calabacín, flores de calabacín, salsa cremosa de Parmigiano y trufa negra. Es delicado en su base, pero aromático y envolvente al final."},"nota":"A ficha explica que «plin» significa beliscão em piemontês; o molho de Parmigiano é queijo derretido em creme ou leite; a trufa negra é descrita como mais discreta que a branca."},{"comp":{"pt":"Spaghetti alla chitarra, tomate e manjericão.","it":"Spaghetti alla chitarra, pomodoro e basilico.","en":"Fresh chitarra spaghetti, tomato sauce and basil.","es":"Espagueti alla chitarra, tomate y albahaca."},"perfil":{"pt":"Tomate oferece equilíbrio entre acidez e doçura; manjericão acrescenta perfume verde, fresco e levemente adocicado; a massa dá estrutura e notas de cereal. É uma combinação simples, direta e aromática, na qual poucos elementos precisam estar bem equilibrados.","it":"Il pomodoro offre equilibrio tra acidità e dolcezza; il basilico aggiunge un profumo verde, fresco e leggermente dolce; la pasta dà struttura e note di cereale. È una combinazione semplice, diretta e aromatica, in cui pochi elementi devono essere ben equilibrati.","en":"Tomato offers a balance of acidity and sweetness; basil adds a green, fresh and gently sweet fragrance; the pasta provides structure and cereal notes. A simple, direct and aromatic combination in which a few ingredients need to be well balanced.","es":"El tomate ofrece equilibrio entre acidez y dulzor; la albahaca aporta un aroma verde, fresco y ligeramente dulce; la pasta da estructura y notas de cereal. Es una combinación sencilla, directa y aromática en la que pocos ingredientes deben estar bien equilibrados."},"aroma":{"pt":"Tomate cozido e manjericão fresco, com notas de cereal da massa.","it":"Pomodoro cotto e basilico fresco, con note di cereale della pasta.","en":"Cooked tomato and fresh basil, with cereal notes from the pasta.","es":"Tomate cocinado y albahaca fresca, con notas de cereal de la pasta."},"textura":{"pt":"Massa firme e elástica, envolvida pelo molho de tomate.","it":"Pasta soda ed elastica, avvolta dal sugo di pomodoro.","en":"Firm, springy pasta coated in tomato sauce.","es":"Pasta firme y elástica, envuelta en salsa de tomate."},"apre":{"pt":"Um clássico italiano: spaghetti alla chitarra com tomate e manjericão fresco. É uma combinação simples e aromática, com acidez e doçura do tomate e frescor herbáceo do manjericão.","it":"Un classico italiano: spaghetti alla chitarra con pomodoro e basilico fresco. Una combinazione semplice e aromatica, con l’acidità e la dolcezza del pomodoro e la freschezza erbacea del basilico.","en":"An Italian classic: chitarra spaghetti with tomato and fresh basil. A simple, aromatic combination of tomato acidity and sweetness with basil’s herbal freshness.","es":"Un clásico italiano: espagueti alla chitarra con tomate y albahaca fresca. Una combinación sencilla y aromática de acidez y dulzor del tomate con la frescura herbácea de la albahaca."},"nota":"A ficha identifica a massa como spaghetti alla chitarra."},{"comp":{"pt":"Salmão, azeite e molho tzatziki.","it":"Salmone, olio e salsa tzatziki.","en":"Salmon, olive oil and tzatziki sauce.","es":"Salmón, aceite de oliva y salsa tzatziki."},"perfil":{"pt":"O salmão é naturalmente rico e macio; o azeite reforça a sensação untuosa. O tzatziki, feito segundo a ficha com iogurte coado, pepino, alho, azeite e limão, traz acidez láctea, frescor vegetal e perfume de alho. O contraste refresca a riqueza do peixe.","it":"Il salmone è naturalmente ricco e morbido; l’olio d’oliva rafforza la sensazione avvolgente. La tzatziki, preparata secondo la scheda con yogurt colato, cetriolo, aglio, olio e limone, porta acidità lattica, freschezza vegetale e profumo d’aglio. Il contrasto rinfresca la ricchezza del pesce.","en":"Salmon is naturally rich and soft; olive oil reinforces its rounded mouthfeel. Tzatziki, described in the menu as strained yogurt, cucumber, garlic, olive oil and lemon, brings lactic tang, vegetal freshness and garlic fragrance. This contrast refreshes the richness of the fish.","es":"El salmón es naturalmente rico y suave; el aceite de oliva refuerza su sensación untuosa. El tzatziki, descrito en la ficha con yogur colado, pepino, ajo, aceite y limón, aporta acidez láctica, frescura vegetal y aroma de ajo. El contraste refresca la riqueza del pescado."},"aroma":{"pt":"Aroma marinho do salmão, frescor de pepino e limão e nota aromática de alho.","it":"Profumo marino del salmone, freschezza di cetriolo e limone e nota aromatica d’aglio.","en":"Salmon’s marine aroma, cucumber and lemon freshness, and an aromatic hint of garlic.","es":"Aroma marino del salmón, frescura de pepino y limón y una nota aromática de ajo."},"textura":{"pt":"Peixe macio e suculento; molho frio, cremoso e fresco. A palavra 'croccante' está no nome do prato, mas a ficha não detalha a técnica da crosta.","it":"Pesce morbido e succoso; salsa fredda, cremosa e fresca. La parola 'croccante' è nel nome del piatto, ma la scheda non specifica la tecnica della crosta.","en":"Soft, succulent fish with a cool, creamy and fresh sauce. 'Crispy' appears in the dish name, but the menu does not specify how the crust is made.","es":"Pescado suave y jugoso con una salsa fría, cremosa y fresca. 'Crujiente' aparece en el nombre del plato, pero la ficha no especifica cómo se prepara la costra."},"apre":{"pt":"Salmão acompanhado de molho tzatziki grego, preparado com iogurte, pepino, alho e limão. A cremosidade do molho e sua acidez fresca equilibram a riqueza natural do peixe.","it":"Salmone accompagnato da salsa tzatziki greca, preparata con yogurt, cetriolo, aglio e limone. La cremosità e la freschezza acidula della salsa bilanciano la ricchezza naturale del pesce.","en":"Salmon served with Greek tzatziki made with yogurt, cucumber, garlic and lemon. The sauce’s creaminess and fresh acidity balance the fish’s natural richness.","es":"Salmón acompañado de salsa tzatziki griega, preparada con yogur, pepino, ajo y limón. La cremosidad y la acidez fresca de la salsa equilibran la riqueza natural del pescado."},"nota":"A ficha descreve o tzatziki como molho grego frio de iogurte coado, pepino ralado, alho, azeite e limão."},{"comp":{"pt":"Filé bovino, molho de pimenta verde, alface grelhada, cenouras baby e batatas novas.","it":"Filetto di manzo, salsa al pepe verde, lattughino grigliato, carote baby e patate novelle.","en":"Beef fillet, green-pepper sauce, grilled baby lettuce, baby carrots and new potatoes.","es":"Solomillo de ternera, salsa de pimienta verde, lechuga baby a la parrilla, zanahorias baby y patatas nuevas."},"perfil":{"pt":"O filé bovino é valorizado pela textura tenra e sabor de carne. A pimenta verde perfuma com notas vegetais e picância mais aromática do que agressiva, conforme a ficha. O molho acrescenta intensidade; cenouras oferecem doçura; batatas, conforto; alface grelhada, notas tostadas e vegetais.","it":"Il filetto di manzo è apprezzato per la tenerezza e il gusto di carne. Il pepe verde profuma con note vegetali e una piccantezza più aromatica che aggressiva, secondo la scheda. La salsa aggiunge intensità; le carote dolcezza; le patate comfort; il lattughino grigliato note tostate e vegetali.","en":"Beef fillet is valued for tenderness and a clear beef flavour. Green pepper gives vegetal fragrance and a more aromatic than aggressive heat, as the menu notes. The sauce adds intensity; carrots bring sweetness, potatoes comfort, and grilled lettuce toasted vegetal notes.","es":"El solomillo destaca por su ternura y sabor cárnico. La pimienta verde aporta notas vegetales y un picor más aromático que agresivo, según la ficha. La salsa añade intensidad; las zanahorias, dulzor; las patatas, sensación reconfortante; y la lechuga a la parrilla, notas tostadas y vegetales."},"aroma":{"pt":"Carne assada, notas vegetais e aromáticas da pimenta verde e perfume tostado dos acompanhamentos grelhados.","it":"Carne arrosto, note vegetali e aromatiche del pepe verde e profumo tostato dei contorni grigliati.","en":"Roasted-meat aromas, green-pepper herbal fragrance and toasted notes from the grilled sides.","es":"Aromas de carne asada, fragancia vegetal y aromática de pimienta verde y notas tostadas de las guarniciones a la parrilla."},"textura":{"pt":"Filé tenro; batatas macias; cenouras firmes e alface grelhada com textura própria.","it":"Filetto tenero; patate morbide; carote consistenti e lattughino grigliato con una propria struttura.","en":"Tender fillet, soft potatoes, firm carrots and grilled lettuce with its own structure.","es":"Solomillo tierno, patatas suaves, zanahorias firmes y lechuga a la parrilla con textura propia."},"apre":{"pt":"Filé bovino tenro com molho aromático de pimenta verde, acompanhado de alface grelhada, cenouras baby e batatas novas. A pimenta dá caráter sem necessariamente dominar o sabor da carne.","it":"Filetto di manzo tenero con salsa aromatica al pepe verde, accompagnato da lattughino grigliato, carote baby e patate novelle. Il pepe dona carattere senza necessariamente coprire il gusto della carne.","en":"Tender beef fillet with an aromatic green-pepper sauce, served with grilled baby lettuce, baby carrots and new potatoes. The pepper adds character without necessarily overpowering the beef.","es":"Solomillo tierno con salsa aromática de pimienta verde, acompañado de lechuga baby a la parrilla, zanahorias baby y patatas nuevas. La pimienta aporta carácter sin necesariamente dominar la carne."},"nota":"A ficha informa que o molho de pimenta verde perfuma mais do que arde. Confirme ponto de cocção e composição exata do molho com a cozinha."},{"comp":{"pt":"Atum vermelho Balfegó, tomate fresco, vagem e azeitonas secas.","it":"Tonno rosso Balfegó, pomodoro fresco, fagiolini e olive essiccate.","en":"Balfegó bluefin tuna, fresh tomatoes, green beans and dried olives.","es":"Atún rojo Balfegó, tomate fresco, judías verdes y aceitunas secas."},"perfil":{"pt":"O atum vermelho tem sabor marinho mais pronunciado e textura firme. Tomate acrescenta acidez e doçura; vagem, frescor vegetal; azeitonas secas, concentração salina e notas intensas. A combinação é mediterrânea, direta e de personalidade.","it":"Il tonno rosso ha un gusto marino più pronunciato e una consistenza compatta. Il pomodoro aggiunge acidità e dolcezza; i fagiolini freschezza vegetale; le olive essiccate concentrazione sapida e note intense. L’insieme è mediterraneo, diretto e caratteristico.","en":"Bluefin tuna has a pronounced marine flavour and firm texture. Tomato adds acidity and sweetness; green beans bring vegetal freshness; dried olives provide concentrated saltiness and intensity. The combination is direct, Mediterranean and distinctive.","es":"El atún rojo tiene un sabor marino pronunciado y una textura firme. El tomate añade acidez y dulzor; las judías verdes aportan frescura vegetal; las aceitunas secas, salinidad concentrada e intensidad. La combinación es mediterránea, directa y característica."},"aroma":{"pt":"Aroma marinho do atum, tomate fresco e notas concentradas de azeitona.","it":"Profumo marino del tonno, pomodoro fresco e note concentrate di oliva.","en":"Marine tuna aroma, fresh tomato and concentrated olive notes.","es":"Aroma marino del atún, tomate fresco y notas concentradas de aceituna."},"textura":{"pt":"Atum de fibra firme; tomate suculento; vagem com leve resistência e azeitonas mais concentradas.","it":"Tonno dalla fibra compatta; pomodoro succoso; fagiolini leggermente consistenti e olive più concentrate.","en":"Firm-fibred tuna, juicy tomato, slightly crisp green beans and concentrated olives.","es":"Atún de fibra firme, tomate jugoso, judías ligeramente consistentes y aceitunas concentradas."},"apre":{"pt":"Tagliata de atum vermelho Balfegó com tomate fresco, vagem e azeitonas secas. É um prato de caráter mediterrâneo, com sabor marinho, frescor vegetal e final salino.","it":"Tagliata di tonno rosso Balfegó con pomodoro fresco, fagiolini e olive essiccate. Un piatto dal carattere mediterraneo, con gusto marino, freschezza vegetale e finale sapido.","en":"Balfegó bluefin tuna tagliata with fresh tomato, green beans and dried olives. A Mediterranean-style dish with marine flavour, vegetal freshness and a savoury finish.","es":"Tagliata de atún rojo Balfegó con tomate fresco, judías verdes y aceitunas secas. Un plato de carácter mediterráneo, con sabor marino, frescura vegetal y final salino."},"nota":"A ficha descreve o atum Balfegó como atum vermelho do Mediterrâneo, com rastreabilidade."},{"comp":{"pt":"Costeleta de vitela empanada, rúcula, tomatinhos e Grana Padano.","it":"Costoletta di vitello impanata, rucola, pomodorini e Grana Padano.","en":"Breaded veal cutlet, rocket, cherry tomatoes and Grana Padano.","es":"Chuleta de ternera empanada, rúcula, tomates cherry y Grana Padano."},"perfil":{"pt":"A vitela oferece sabor delicado; o empanado frito na manteiga clarificada, conforme a ficha, traz notas tostadas e riqueza; rúcula acrescenta amargor e picância; tomate, acidez e doçura; Grana Padano, salinidade e umami. Um prato rico, crocante e equilibrado pelos acompanhamentos frescos.","it":"Il vitello offre un gusto delicato; la panatura fritta nel burro chiarificato, secondo la scheda, porta note tostate e ricchezza; la rucola aggiunge amaro e una lieve piccantezza; il pomodoro acidità e dolcezza; il Grana Padano sapidità e umami. Un piatto ricco e croccante, bilanciato dai contorni freschi.","en":"Veal offers a delicate flavour; the breading fried in clarified butter, according to the menu, brings toasted notes and richness; rocket adds bitterness and pepperiness; tomato contributes acidity and sweetness; Grana Padano adds saltiness and umami. A rich, crisp dish balanced by fresh sides.","es":"La ternera ofrece un sabor delicado; el empanado frito en mantequilla clarificada, según la ficha, aporta notas tostadas y riqueza; la rúcula añade amargor y un toque picante; el tomate, acidez y dulzor; el Grana Padano, salinidad y umami. Un plato rico y crujiente, equilibrado por los acompañamientos frescos."},"aroma":{"pt":"Notas tostadas do empanado e manteiga, carne suave, rúcula fresca e queijo curado.","it":"Note tostate della panatura e del burro, carne delicata, rucola fresca e formaggio stagionato.","en":"Toasted breading and butter aromas, mild meat, fresh rocket and aged cheese.","es":"Notas tostadas del empanado y la mantequilla, carne suave, rúcula fresca y queso curado."},"textura":{"pt":"Crosta crocante, interior de vitela tenro; folhas frescas e tomate suculento.","it":"Crosta croccante, interno di vitello tenero; foglie fresche e pomodoro succoso.","en":"Crisp crust, tender veal inside, fresh leaves and juicy tomato.","es":"Costra crujiente, interior de ternera tierno, hojas frescas y tomate jugoso."},"apre":{"pt":"A clássica cotoletta alla milanese: costeleta de vitela empanada e frita na manteiga clarificada, servida com rúcula, tomatinhos e Grana Padano. Crocante e saborosa, com frescor dos acompanhamentos.","it":"La classica cotoletta alla milanese: costoletta di vitello impanata e fritta nel burro chiarificato, servita con rucola, pomodorini e Grana Padano. Croccante e saporita, con la freschezza dei contorni.","en":"The classic cotoletta alla Milanese: breaded veal cutlet fried in clarified butter, served with rocket, cherry tomatoes and Grana Padano. Crisp and savoury, with freshness from the sides.","es":"La clásica cotoletta alla milanese: chuleta de ternera empanada y frita en mantequilla clarificada, servida con rúcula, tomates cherry y Grana Padano. Crujiente y sabrosa, con frescura de las guarniciones."},"nota":"A ficha descreve a costeleta com osso, empanada e frita na manteiga clarificada; prato símbolo de Milão."},{"comp":{"pt":"Peito de frango, pimentões e molho agridoce picante.","it":"Pollo, peperoni e salsa agrodolce piccante.","en":"Chicken breast, peppers and spicy sweet-and-sour sauce.","es":"Pechuga de pollo, pimientos y salsa agridulce picante."},"perfil":{"pt":"O frango tem sabor suave e funciona como base para o molho. Pimentões trazem doçura vegetal; o molho combina açúcar e vinagre em equilíbrio, com pimenta. A doçura amortece a picância, criando uma sensação agridoce e levemente ardente, não necessariamente forte.","it":"Il pollo ha un gusto delicato e fa da base alla salsa. I peperoni portano dolcezza vegetale; la salsa combina zucchero e aceto in equilibrio, con peperoncino. La dolcezza attenua la piccantezza, creando una sensazione agrodolce e leggermente piccante, non necessariamente forte.","en":"Chicken has a mild flavour and acts as a base for the sauce. Peppers bring vegetal sweetness; the sauce balances sugar and vinegar with chilli. Sweetness softens the heat, creating a sweet-and-sour, gently spicy impression rather than an overpowering burn.","es":"El pollo tiene un sabor suave y sirve de base para la salsa. Los pimientos aportan dulzor vegetal; la salsa equilibra azúcar y vinagre con guindilla. El dulzor suaviza el picante y crea una sensación agridulce y ligeramente picante, no necesariamente intensa."},"aroma":{"pt":"Aroma de frango e pimentão, com nota avinagrada e especiada do molho.","it":"Profumo di pollo e peperone, con nota acetosa e speziata della salsa.","en":"Chicken and pepper aromas, with a vinegary and spiced note from the sauce.","es":"Aroma de pollo y pimiento, con una nota avinagrada y especiada de la salsa."},"textura":{"pt":"Frango macio, pimentões tenros e molho que envolve com equilíbrio entre doce, ácido e picante.","it":"Pollo morbido, peperoni teneri e salsa avvolgente, in equilibrio tra dolce, acido e piccante.","en":"Tender chicken, soft peppers and a coating sauce balancing sweet, sour and spicy sensations.","es":"Pollo tierno, pimientos suaves y salsa envolvente que equilibra dulce, ácido y picante."},"apre":{"pt":"Peito de frango com pimentões e molho agridoce picante. A combinação equilibra doçura e acidez, com uma picância suave que dá personalidade ao prato.","it":"Petto di pollo con peperoni e salsa agrodolce piccante. La combinazione bilancia dolcezza e acidità, con una piccantezza delicata che dà carattere al piatto.","en":"Chicken breast with peppers and a sweet-and-sour spicy sauce. It balances sweetness and acidity with gentle heat that gives the dish character.","es":"Pechuga de pollo con pimientos y salsa agridulce picante. Equilibra dulzor y acidez con un picante suave que da carácter al plato."},"nota":"A ficha explica que açúcar e vinagre equilibram a pimenta: arde de leve, não queima. 'Nenhum declarado' não substitui confirmação em caso de alergia."},{"comp":{"pt":"Espaguete, alho, azeite, peperoncino, lagostins, bisque de crustáceos e limão.","it":"Spaghetti, aglio, olio, peperoncino, scampi, bisque di crostacei e limone.","en":"Spaghetti with garlic, olive oil, chilli pepper, langoustines, shellfish bisque and lemon.","es":"Espagueti con ajo, aceite de oliva, guindilla, cigalas, bisque de crustáceos y limón."},"perfil":{"pt":"Alho e azeite criam uma base aromática; peperoncino acrescenta calor; scampi traz doçura marinha; bisque concentra sabor de crustáceos e umami; limão corta a riqueza e refresca. É um prato intenso, perfumado e de forte identidade marítima.","it":"Aglio e olio creano una base aromatica; il peperoncino aggiunge calore; gli scampi portano dolcezza marina; la bisque concentra il sapore dei crostacei e l’umami; il limone alleggerisce e rinfresca. È un piatto intenso, profumato e di forte identità marina.","en":"Garlic and olive oil create an aromatic base; chilli adds heat; langoustines bring marine sweetness; shellfish bisque concentrates crustacean flavour and umami; lemon cuts through the richness and refreshes. An intense, fragrant dish with a strong seafood identity.","es":"El ajo y el aceite crean una base aromática; la guindilla aporta calor; las cigalas ofrecen dulzor marino; la bisque concentra el sabor de los crustáceos y el umami; el limón aligera y refresca. Es un plato intenso, fragante y de marcada identidad marina."},"aroma":{"pt":"Alho aromático, azeite, notas marinhas concentradas da bisque, pimenta e limão.","it":"Aglio aromatico, olio, note marine concentrate della bisque, peperoncino e limone.","en":"Aromatic garlic, olive oil, concentrated marine bisque notes, chilli and lemon.","es":"Ajo aromático, aceite de oliva, notas marinas concentradas de la bisque, guindilla y limón."},"textura":{"pt":"Massa firme; scampi tenro; bisque de consistência mais envolvente, conforme a preparação.","it":"Pasta soda; scampi teneri; bisque dalla consistenza più avvolgente, secondo la preparazione.","en":"Firm pasta, tender langoustines and a more enveloping bisque, depending on its preparation.","es":"Pasta firme, cigalas tiernas y una bisque de textura más envolvente, según su preparación."},"apre":{"pt":"Espaguete com alho, azeite e peperoncino, scampi, bisque de crustáceos e limão. É intenso e aromático, com sabor marinho concentrado, um toque picante e final cítrico.","it":"Spaghetti con aglio, olio e peperoncino, scampi, bisque di crostacei e limone. È intenso e aromatico, con gusto marino concentrato, una nota piccante e un finale agrumato.","en":"Spaghetti with garlic, olive oil and chilli, langoustines, shellfish bisque and lemon. It is intense and aromatic, with concentrated seafood flavour, a touch of heat and a citrus finish.","es":"Espagueti con ajo, aceite y guindilla, cigalas, bisque de crustáceos y limón. Es intenso y aromático, con sabor marino concentrado, un toque picante y un final cítrico."},"nota":"A ficha explica que a bisque é caldo concentrado feito tostando cabeças e cascas de crustáceos e reduzindo longamente."},{"comp":{"pt":"Salada mista.","it":"Insalata mista.","en":"Mixed salad.","es":"Ensalada mixta."},"perfil":{"pt":"Perfil vegetal leve e refrescante. A ficha explica a misticanza como mistura de folhas jovens que pode reunir notas doces, amargas e picantes. O sabor depende das variedades utilizadas no dia.","it":"Profilo vegetale leggero e rinfrescante. La scheda descrive la misticanza come un insieme di foglie giovani che può riunire note dolci, amare e piccanti. Il gusto dipende dalle varietà utilizzate.","en":"A light, refreshing vegetal profile. The menu describes misticanza as a mix of young leaves that may combine sweet, bitter and peppery notes. The exact flavour depends on the varieties used.","es":"Perfil vegetal ligero y refrescante. La ficha describe la misticanza como una mezcla de hojas jóvenes que puede reunir notas dulces, amargas y picantes. El sabor depende de las variedades utilizadas."},"aroma":{"pt":"Aromas verdes e frescos, variáveis conforme as folhas.","it":"Profumi verdi e freschi, variabili secondo le foglie.","en":"Fresh green aromas, varying with the leaves used.","es":"Aromas verdes y frescos, variables según las hojas."},"textura":{"pt":"Folhas jovens com texturas variadas, de tenras a ligeiramente crocantes.","it":"Foglie giovani con consistenze diverse, da tenere a leggermente croccanti.","en":"Young leaves with varied textures, from tender to slightly crisp.","es":"Hojas jóvenes con distintas texturas, de tiernas a ligeramente crujientes."},"apre":{"pt":"Uma salada mista leve, feita com folhas jovens de diferentes variedades. Pode apresentar notas doces, amargas e levemente picantes.","it":"Un’insalata mista leggera, preparata con foglie giovani di diverse varietà. Può offrire note dolci, amare e leggermente piccanti.","en":"A light mixed salad made with young leaves of different varieties. It may offer sweet, bitter and gently peppery notes.","es":"Una ensalada mixta ligera, preparada con hojas jóvenes de distintas variedades. Puede ofrecer notas dulces, amargas y ligeramente picantes."},"nota":"A ficha explica misticanza como mistura de folhas jovens colhidas tradicionalmente de forma espontânea."},{"comp":{"pt":"Batatas fritas.","it":"Patatine fritte.","en":"French fries.","es":"Patatas fritas."},"perfil":{"pt":"Sabor simples de batata, com notas tostadas da fritura e salinidade do tempero, se aplicado. É um acompanhamento neutro e familiar que contrasta com pratos mais ricos.","it":"Gusto semplice di patata, con note tostate della frittura e sapidità del condimento, se presente. È un contorno familiare e relativamente neutro che contrasta con piatti più ricchi.","en":"A straightforward potato flavour with toasted frying notes and seasoning salt, if applied. A familiar, relatively neutral side that contrasts with richer dishes.","es":"Sabor sencillo de patata, con notas tostadas de la fritura y salinidad del sazonado, si se aplica. Es una guarnición familiar y relativamente neutra que contrasta con platos más ricos."},"aroma":{"pt":"Aroma de batata frita e notas tostadas.","it":"Profumo di patata fritta e note tostate.","en":"Fried-potato aroma and toasted notes.","es":"Aroma de patata frita y notas tostadas."},"textura":{"pt":"Exterior potencialmente crocante e interior macio; confirme o corte e a fritura com a cozinha.","it":"Esterno potenzialmente croccante e interno morbido; verificare taglio e frittura con la cucina.","en":"Potentially crisp outside and soft inside; confirm the cut and frying style with the kitchen.","es":"Exterior potencialmente crujiente e interior suave; confirmar el corte y la fritura con cocina."},"apre":{"pt":"Um acompanhamento clássico de batata frita, ideal para quem procura uma opção simples e familiar.","it":"Un contorno classico di patatine fritte, ideale per chi desidera un accompagnamento semplice e familiare.","en":"A classic side of French fries, ideal for guests looking for a simple, familiar accompaniment.","es":"Una guarnición clásica de patatas fritas, ideal para quienes buscan un acompañamiento sencillo y familiar."},"nota":"A ficha não detalha óleo de fritura, corte ou tempero; confirme esses pontos e possível contaminação cruzada."},{"comp":{"pt":"Abobrinha, berinjela e tomates grelhados.","it":"Zucchine, melanzane e pomodori grigliati.","en":"Grilled zucchini, eggplant and tomatoes.","es":"Calabacín, berenjena y tomates a la parrilla."},"perfil":{"pt":"O grelhado tende a concentrar a doçura natural dos vegetais e acrescentar notas tostadas. Abobrinha é suave, berinjela mais carnuda e tomate combina doçura e acidez. Um acompanhamento vegetal de perfil mediterrâneo.","it":"La griglia tende a concentrare la dolcezza naturale delle verdure e ad aggiungere note tostate. La zucchina è delicata, la melanzana più carnosa e il pomodoro unisce dolcezza e acidità. Un contorno vegetale dal profilo mediterraneo.","en":"Grilling tends to concentrate the vegetables’ natural sweetness and add toasted notes. Zucchini is mild, aubergine more substantial, while tomato combines sweetness and acidity. A Mediterranean-style vegetable side.","es":"La parrilla tiende a concentrar el dulzor natural de las verduras y añadir notas tostadas. El calabacín es suave, la berenjena más carnosa y el tomate combina dulzor y acidez. Una guarnición vegetal de perfil mediterráneo."},"aroma":{"pt":"Notas vegetais grelhadas, com aroma tostado e tomate maduro.","it":"Note vegetali grigliate, con profumo tostato e pomodoro maturo.","en":"Grilled vegetable notes, toasted aromas and ripe tomato.","es":"Notas de verduras a la parrilla, aromas tostados y tomate maduro."},"textura":{"pt":"Abobrinha macia, berinjela carnuda e tomate suculento; textura depende do ponto de grelha.","it":"Zucchina morbida, melanzana carnosa e pomodoro succoso; la consistenza dipende dalla cottura alla griglia.","en":"Soft zucchini, fleshy aubergine and juicy tomato; texture depends on the grilling point.","es":"Calabacín suave, berenjena carnosa y tomate jugoso; la textura depende del punto de parrilla."},"apre":{"pt":"Abobrinha, berinjela e tomates grelhados. Um acompanhamento vegetal com notas naturalmente doces e um leve aroma tostado da grelha.","it":"Zucchine, melanzane e pomodori grigliati. Un contorno vegetale con note naturalmente dolci e un leggero profumo tostato della griglia.","en":"Grilled zucchini, aubergine and tomatoes. A vegetable side with natural sweetness and a gentle toasted aroma from the grill.","es":"Calabacín, berenjena y tomates a la parrilla. Una guarnición vegetal con notas naturalmente dulces y un suave aroma tostado de la parrilla."},"nota":"A ficha não lista óleo, marinada ou temperos; confirmar com a cozinha se necessário."},{"comp":{"pt":"Tomate, fior di latte e manjericão.","it":"Pomodoro, fior di latte e basilico.","en":"Tomato, fior di latte mozzarella and basil.","es":"Tomate, mozzarella fior di latte y albahaca."},"perfil":{"pt":"Tomate oferece acidez e doçura; fior di latte traz suavidade láctea e cremosidade; manjericão acrescenta perfume fresco e herbáceo; massa assada fornece notas de pão e tostado. O equilíbrio é clássico, simples e aromático.","it":"Il pomodoro offre acidità e dolcezza; il fior di latte porta delicatezza lattica e cremosità; il basilico aggiunge un profumo fresco ed erbaceo; l’impasto cotto dona note di pane e tostatura. L’equilibrio è classico, semplice e aromatico.","en":"Tomato provides acidity and sweetness; fior di latte brings gentle dairy flavour and creaminess; basil adds fresh herbal fragrance; baked dough gives bread-like and toasted notes. A classic, simple and aromatic balance.","es":"El tomate aporta acidez y dulzor; la mozzarella fior di latte ofrece suavidad láctica y cremosidad; la albahaca añade un aroma fresco y herbáceo; la masa horneada aporta notas de pan y tostado. Un equilibrio clásico, sencillo y aromático."},"aroma":{"pt":"Tomate assado, leite fresco do queijo e perfume verde do manjericão.","it":"Pomodoro cotto, latte fresco del formaggio e profumo verde del basilico.","en":"Baked tomato, fresh dairy notes and green basil fragrance.","es":"Tomate asado, notas lácteas frescas y aroma verde de albahaca."},"textura":{"pt":"Massa assada, queijo derretido e folhas de manjericão frescas.","it":"Impasto cotto, formaggio fuso e foglie fresche di basilico.","en":"Baked dough, melted cheese and fresh basil leaves.","es":"Masa horneada, queso fundido y hojas frescas de albahaca."},"apre":{"pt":"A clássica Margherita, com tomate, fior di latte e manjericão fresco. Simples e equilibrada, combina acidez do tomate, cremosidade do queijo e perfume herbáceo.","it":"La classica Margherita, con pomodoro, fior di latte e basilico fresco. Semplice ed equilibrata, unisce l’acidità del pomodoro, la cremosità del formaggio e il profumo erbaceo.","en":"The classic Margherita, with tomato, fior di latte and fresh basil. Simple and balanced, combining tomato acidity, creamy cheese and herbal fragrance.","es":"La clásica Margherita, con tomate, mozzarella fior di latte y albahaca fresca. Sencilla y equilibrada, combina la acidez del tomate, la cremosidad del queso y el aroma herbáceo."},"nota":"A ficha especifica fior di latte."},{"comp":{"pt":"Fior di latte, creme de Parmigiano Reggiano, abobrinha marinada em vinagre de Champagne e trufa negra.","it":"Fior di latte, crema di Parmigiano Reggiano, zucchine marinate all’aceto di Champagne e tartufo nero.","en":"Fior di latte, Parmigiano Reggiano cream, zucchini marinated in Champagne vinegar and black truffle.","es":"Fior di latte, crema de Parmigiano Reggiano, calabacín marinado en vinagre de Champagne y trufa negra."},"perfil":{"pt":"Pizza branca, sem tomate na composição descrita. Fior di latte e creme de Parmigiano dão cremosidade e intensidade láctea; abobrinha marinada oferece frescor e acidez; trufa negra acrescenta perfume terroso e persistente. É rica, aromática e equilibrada por uma nota ácida.","it":"Pizza bianca, senza pomodoro nella composizione descritta. Fior di latte e crema di Parmigiano danno cremosità e intensità lattica; le zucchine marinate offrono freschezza e acidità; il tartufo nero aggiunge un profumo terroso e persistente. È ricca e aromatica, bilanciata da una nota acida.","en":"A white pizza, with no tomato listed in its composition. Fior di latte and Parmigiano cream provide dairy richness; marinated zucchini adds freshness and acidity; black truffle contributes persistent earthy fragrance. Rich and aromatic, balanced by a tangy note.","es":"Una pizza blanca, sin tomate en la composición indicada. El fior di latte y la crema de Parmigiano aportan cremosidad e intensidad láctica; el calabacín marinado ofrece frescura y acidez; la trufa negra añade un perfume terroso y persistente. Es rica y aromática, equilibrada por una nota ácida."},"aroma":{"pt":"Trufa negra terrosa, queijo curado e nota avinagrada delicada da abobrinha.","it":"Tartufo nero terroso, formaggio stagionato e delicata nota acetosa delle zucchine.","en":"Earthy black truffle, aged cheese and a gentle vinegary note from the zucchini.","es":"Trufa negra terrosa, queso curado y una delicada nota avinagrada del calabacín."},"textura":{"pt":"Massa crocante nas bordas, centro cremoso e abobrinha mais tenra.","it":"Impasto croccante ai bordi, centro cremoso e zucchine più tenere.","en":"Crisp edges, creamy centre and tender zucchini.","es":"Bordes crujientes, centro cremoso y calabacín tierno."},"apre":{"pt":"Uma pizza branca com fior di latte, creme de Parmigiano, abobrinha marinada em vinagre de Champagne e trufa negra. Cremosa e aromática, com acidez delicada e notas terrosas.","it":"Una pizza bianca con fior di latte, crema di Parmigiano, zucchine marinate all’aceto di Champagne e tartufo nero. Cremosa e aromatica, con delicata acidità e note terrose.","en":"A white pizza with fior di latte, Parmigiano cream, zucchini marinated in Champagne vinegar and black truffle. Creamy and aromatic, with gentle acidity and earthy notes.","es":"Una pizza blanca con fior di latte, crema de Parmigiano, calabacín marinado en vinagre de Champagne y trufa negra. Cremosa y aromática, con acidez delicada y notas terrosas."},"nota":"A ficha não descreve molho de tomate; 'pizza bianca' é uma explicação de serviço baseada na composição listada."},{"comp":{"pt":"Tomate San Marzano, stracciatella, manjericão, anchovas do Cantábrico e azeitonas Taggiasche.","it":"Pomodoro San Marzano, stracciatella, basilico, acciughe del Cantabrico e olive taggiasche.","en":"San Marzano tomato, stracciatella, basil, Cantabrian anchovies and Taggiasca olives.","es":"Tomate San Marzano, stracciatella, albahaca, anchoas del Cantábrico y aceitunas Taggiasca."},"perfil":{"pt":"Tomate San Marzano traz acidez e doçura concentrada; stracciatella oferece cremosidade láctea; anchovas do Cantábrico e azeitonas acrescentam salinidade e intensidade; manjericão refresca. A stracciatella suaviza o lado salino e une os sabores.","it":"Il pomodoro San Marzano porta acidità e dolcezza concentrata; la stracciatella offre cremosità lattica; acciughe del Cantabrico e olive aggiungono sapidità e intensità; il basilico rinfresca. La stracciatella ammorbidisce la componente sapida e lega i sapori.","en":"San Marzano tomato brings acidity and concentrated sweetness; stracciatella provides milky creaminess; Cantabrian anchovies and olives add saltiness and intensity; basil refreshes. Stracciatella softens the savoury elements and brings the flavours together.","es":"El tomate San Marzano aporta acidez y dulzor concentrado; la stracciatella ofrece cremosidad láctica; las anchoas del Cantábrico y las aceitunas añaden salinidad e intensidad; la albahaca refresca. La stracciatella suaviza el componente salino y une los sabores."},"aroma":{"pt":"Tomate maduro, manjericão fresco, notas marinhas de anchova e aroma lácteo da stracciatella.","it":"Pomodoro maturo, basilico fresco, note marine di acciuga e profumo lattico della stracciatella.","en":"Ripe tomato, fresh basil, marine anchovy notes and milky stracciatella aroma.","es":"Tomate maduro, albahaca fresca, notas marinas de anchoa y aroma lácteo de stracciatella."},"textura":{"pt":"Massa assada, stracciatella cremosa e azeitonas e anchovas de textura mais firme.","it":"Impasto cotto, stracciatella cremosa e olive e acciughe dalla consistenza più decisa.","en":"Baked dough, creamy stracciatella and firmer-textured olives and anchovies.","es":"Masa horneada, stracciatella cremosa y aceitunas y anchoas de textura más firme."},"apre":{"pt":"Uma pizza de perfil mediterrâneo com tomate San Marzano, stracciatella, manjericão, anchovas do Cantábrico e azeitonas Taggiasche. Cremosa, fresca e com uma salinidade marcante.","it":"Una pizza dal profilo mediterraneo con pomodoro San Marzano, stracciatella, basilico, acciughe del Cantabrico e olive taggiasche. Cremosa, fresca e con una sapidità decisa.","en":"A Mediterranean-style pizza with San Marzano tomato, stracciatella, basil, Cantabrian anchovies and Taggiasca olives. Creamy and fresh, with pronounced savoury notes.","es":"Una pizza de perfil mediterráneo con tomate San Marzano, stracciatella, albahaca, anchoas del Cantábrico y aceitunas Taggiasca. Cremosa y fresca, con una salinidad marcada."},"nota":"A ficha lista anchovas do Cantábrico; informar claramente a presença de peixe."},{"comp":{"pt":"Pão branco tostado, frango, bacon crocante, ovos, tomate, alface, maionese e batatas fritas.","it":"Pane bianco tostato, pollo, bacon croccante, uova, pomodoro, lattuga, maionese e patatine fritte.","en":"Toasted white bread, chicken, crispy bacon, eggs, tomato, lettuce, mayonnaise and French fries.","es":"Pan blanco tostado, pollo, bacon crujiente, huevos, tomate, lechuga, mayonesa y patatas fritas."},"perfil":{"pt":"Frango oferece sabor suave; bacon acrescenta sal, gordura e notas defumadas; ovo e maionese dão cremosidade; tomate traz acidez e alface frescor; pão tostado adiciona notas de cereal e torra. É um sanduíche completo, rico e contrastado.","it":"Il pollo offre un gusto delicato; il bacon aggiunge sale, grasso e note affumicate; uovo e maionese danno cremosità; il pomodoro porta acidità e la lattuga freschezza; il pane tostato aggiunge note di cereale e tostatura. È un sandwich completo, ricco e contrastato.","en":"Chicken provides a mild flavour; bacon adds salt, fat and smoky notes; egg and mayonnaise bring creaminess; tomato adds acidity and lettuce freshness; toasted bread contributes cereal and toast notes. A complete, rich sandwich with contrasts.","es":"El pollo ofrece un sabor suave; el bacon añade sal, grasa y notas ahumadas; el huevo y la mayonesa aportan cremosidad; el tomate añade acidez y la lechuga frescura; el pan tostado aporta notas de cereal y tostado. Un sándwich completo, rico y contrastado."},"aroma":{"pt":"Pão tostado, bacon defumado, frango e tomate fresco.","it":"Pane tostato, bacon affumicato, pollo e pomodoro fresco.","en":"Toasted bread, smoky bacon, chicken and fresh tomato.","es":"Pan tostado, bacon ahumado, pollo y tomate fresco."},"textura":{"pt":"Camadas de pão tostado, frango macio, bacon crocante, ovo e maionese cremosos e folhas frescas.","it":"Strati di pane tostato, pollo morbido, bacon croccante, uovo e maionese cremosi e foglie fresche.","en":"Layers of toasted bread, tender chicken, crisp bacon, creamy egg and mayonnaise, and fresh leaves.","es":"Capas de pan tostado, pollo tierno, bacon crujiente, huevo y mayonesa cremosos y hojas frescas."},"apre":{"pt":"Um club sandwich clássico com frango, bacon crocante, ovos, tomate, alface e maionese, servido com batatas fritas. Combina camadas cremosas, frescas e crocantes.","it":"Un classico club sandwich con pollo, bacon croccante, uova, pomodoro, latt
